}

/* Filtra profissionais que têm ao menos uma alocação na grade dentro dos
   dias visíveis (respeitando o filtro de sprint) e que passe no matchFn
   (respeitando o filtro de projeto). Usado para não mostrar linha de quem
   não tem nenhuma atividade no período/sprint filtrado. */
/* Ordem fixa das linhas da Lego, por PAPEL — nunca por nível
   (Júnior/Pleno/Sênior/Lead não mudam a posição, só o cargo em si): primeiro
   Desenvolvedor Backend, depois Desenvolvedor Frontend, depois Analista de
   QA. Qualquer outro papel (Head de Produto, Analista de Requisitos etc.)
   fica depois desses três, na ordem em que já estava. */
function ordemPapelProfissional(tecnologia){
  const t = (tecnologia || '').toLowerCase();
  if(t.includes('backend')) return 0;
  if(t.includes('frontend')) return 1;
  if(t.includes('qa')) return 2;
  return 3;
}
function profissionaisComAtividadeNoPeriodo(lista, diasList, matchFn){
  const diasSet = new Set(diasList.map(d=> d.toDateString()));
  return lista
    .filter(p=> {
      const temReal = DB.grade.some(g=>{
        if(g.profissional_id !== p.id) return false;
        if(!diasSet.has(g.data.toDateString())) return false;
        const sub = getSubtarefa(g.tarefa_id);
        return sub && matchFn(sub);
      });
      if(temReal) return true;
      // conta também quem só tem card fixo do PLANO nesse período (ex: já
      // concluiu tudo antes do previsto, sem mais nada dinâmico agendado,
      // mas o card do plano continua visível na Grade).
      for(const chave of GRADE_PLANO_POR_CELULA.keys()){
        const [profId, idxStr] = chave.split('|');
        if(profId !== p.id) continue;
        const slot = TURN_SLOTS[Number(idxStr)];
        if(!slot || !diasSet.has(slot.data.toDateString())) continue;
        const sub = getSubtarefa(GRADE_PLANO_POR_CELULA.get(chave));
        if(sub && matchFn(sub)) return true;
      }
      return false;
    })
    .sort((a,b)=> ordemPapelProfissional(a.tecnologia_principal) - ordemPapelProfissional(b.tecnologia_principal));
}

function renderGradeSprintMode(){
  const el = document.getElementById('viewGrade');
  construirGradePlanejada();
  const colWidth = 64;
  const dias = diasVisiveis();
  // buildTableHeaderHTML PRECISA rodar antes de buildRowsHTML — é ela quem
  // recalcula GRADE_FAIXA_POR_DATA/GRADE_FIM_SPRINT (a borda grossa de fim de
  // sprint), e renderCellGeneric (chamada dentro de buildRowsHTML) só lê
  // essas globais, não as recalcula. Invertido, o corpo da grade renderiza
  // com a borda do ciclo de render ANTERIOR — some, aparece deslocada ou só
  // no cabeçalho, dependendo do que estava filtrado antes. Ordem importa.
  const headerHTML = buildTableHeaderHTML(colWidth, dias, true, GRADE_LEAD_WIDTH);
  const profissionaisComAtiv = profissionaisComAtividadeNoPeriodo(DB.profissionais, dias, matchesProjectFilter);
  const rows = buildRowsHTML(profissionaisComAtiv, colWidth, matchesProjectFilter, false, dias);
  // Burndown só faz sentido com UMA sprint específica selecionada (a conta
  // de "entregas planejadas x andamento real" é por sprint) — com "todas as
  // sprints" ou nenhum projeto filtrado, o botão nem aparece.
  const mostrarBurndown = SPRINT_FILTER !== 'all';
  el.innerHTML = `
    <div class="flex-1 min-h-0 overflow-auto scrollbox" id="gradeApresentacaoOuter">
      <div class="inline-block min-w-full" id="gradeApresentacaoWrap">
        ${headerHTML}
        ${rows || `<div class="p-6 text-sm text-[var(--ink-faint)] italic">Nenhum profissional com atividade neste período.</div>`}
      </div>
    </div>
    ${mostrarBurndown ? renderBlocoBurndown(SPRINT_FILTER) : ''}`;
  ajustarEscalaApresentacao();
}

/* ==========================================================================
   BURNDOWN DA SPRINT — botão no final do quadro LEGO (só com uma sprint
   específica filtrada) que abre, logo abaixo, um gráfico com duas linhas:
   "Plano" (quanto deveria restar, dia a dia, segundo a Data fim planejada de
   cada subtarefa) e "Real" (quanto de fato resta, segundo quem já foi
   concluída e quando — data_termino_real), truncada em "hoje" (CURRENT_IDX).
   ========================================================================== */
let BURNDOWN_ABERTO = false;
function toggleBurndown(){ BURNDOWN_ABERTO = !BURNDOWN_ABERTO; render(); }

function renderBlocoBurndown(sprintId){
  const sprint = getSprint(sprintId);
  if(!sprint) return '';
  return `
    <div class="shrink-0 border-t border-[var(--line)] bg-[var(--panel)]">
      <button onclick="toggleBurndown()" class="w-full flex items-center justify-center gap-1.5 py-2 text-[11px] font-bold text-[var(--ink-dim)] mono uppercase hover:bg-[var(--panel-2)]">
        <span>${BURNDOWN_ABERTO ? '▲' : '▼'}</span>
        <span>${BURNDOWN_ABERTO ? 'Fechar' : 'Abrir'} burndown — ${nomeSprint(sprintId)}</span>
      </button>
      ${BURNDOWN_ABERTO ? renderBurndownChart(sprintId) : ''}
    </div>`;
}

function renderBurndownChart(sprintId){
  const dias = (SPRINT_DIAS.get(sprintId) || []).slice();
  if(!dias.length) return `<div class="p-4 text-xs text-[var(--ink-faint)] italic">Sprint sem dias cadastrados.</div>`;

  const subs = DB.subtarefas.filter(s => s.sprint_id === sprintId);
  const totalHoras = subs.reduce((soma, s) => soma + horasEstimadas(s), 0);
  if(totalHoras <= 0) return `<div class="p-4 text-xs text-[var(--ink-faint)] italic">Sprint sem subtarefas estimadas — nada pra plotar.</div>`;

  // "Hoje" aqui é só o ponteiro de turno simulado (CURRENT_IDX) — não tem
  // relação com a data real do sistema, e começa em 0 (o primeiro turno de
  // todo o horizonte) até alguém avançar turno manualmente. Por isso a linha
  // Real NÃO pode depender dele pra decidir o que plotar — senão ela fica
  // sempre achatada em 100%, mesmo com um monte de trabalho já concluído de
  // verdade (data_termino_real no passado). Usada só pro marcador visual
  // abaixo, que é decorativo.
  const hojeSlot = TURN_SLOTS[CURRENT_IDX];
  const hojeIso = hojeSlot ? isoLocal(hojeSlot.data) : null;

  // Ponto 0 = início da sprint (100% do trabalho restante). Depois, um ponto
  // por dia útil da sprint (posição = fim daquele dia). Feriado dentro da
  // sprint não abate nada de nenhuma das duas linhas (ninguém entrega em
  // feriado — mesma regra do motor) mas continua marcado no eixo X. A linha
  // Real reflete só o que de fato já aconteceu (data_termino_real de
  // subtarefas concluídas) — sem trabalho concluído registrado num dia, ela
  // simplesmente não desce naquele ponto (fica "atrasada" em relação ao
  // Plano), nunca precisa ser cortada/escondida.
  const pontosPlano = [totalHoras];
  const pontosReal = [totalHoras];
  const rotulos = ['Início'];
  const feriadoPorIdx = [false];
  let acumPlano = 0, acumReal = 0;

  dias.forEach(dia => {
    const iso = isoLocal(dia);
    const feriado = getFeriado(dia);
    rotulos.push(fmtData(dia));
    feriadoPorIdx.push(!!feriado);
    if(!feriado){
      acumPlano += subs.filter(s => s.data_fim_planejada === iso).reduce((n, s) => n + horasEstimadas(s), 0);
      acumReal += subs.filter(s => s.status === 'concluida' && s.data_termino_real === iso).reduce((n, s) => n + horasEstimadas(s), 0);
    }
    pontosPlano.push(Math.max(0, totalHoras - acumPlano));
    pontosReal.push(Math.max(0, totalHoras - acumReal));
  });

  const W = 640, H = 200, padL = 40, padR = 14, padT = 14, padB = 26;
  const n = rotulos.length;
  const areaW = W - padL - padR, areaH = H - padT - padB;
  const xStep = n > 1 ? areaW / (n - 1) : 0;
  const xDe = i => padL + i * xStep;
  const yDe = v => padT + areaH * (1 - v / totalHoras);

  function caminho(pontos){
    let d = '', aberto = false;
    pontos.forEach((v, i) => {
      if(v === null){ aberto = false; return; }
      d += (aberto ? ' L ' : 'M ') + xDe(i).toFixed(1) + ' ' + yDe(v).toFixed(1);
      aberto = true;
    });
    return d;
  }

  const faixasFeriado = feriadoPorIdx.map((f, i) => f
    ? `<rect x="${(xDe(i) - xStep / 2).toFixed(1)}" y="${padT}" width="${xStep.toFixed(1)}" height="${areaH}" fill="#E9EAEC" opacity="0.6"/>`
    : '').join('');

  const linhasGrade = [0, 0.25, 0.5, 0.75, 1].map(f => {
    const y = padT + areaH * (1 - f);
    return `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="var(--line)" stroke-width="1"/>
      <text x="${padL - 6}" y="${(y + 3).toFixed(1)}" text-anchor="end" font-size="8" fill="var(--ink-faint)" font-family="monospace">${Math.round(totalHoras * f)}h</text>`;
  }).join('');

  const rotulosX = rotulos.map((r, i) => `<text x="${xDe(i).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="8" fill="var(--ink-faint)" font-family="monospace">${r}</text>`).join('');

  const pontosPlanoSvg = pontosPlano.map((v, i) => `<circle cx="${xDe(i).toFixed(1)}" cy="${yDe(v).toFixed(1)}" r="2.5" fill="var(--ink-dim)"><title>Plano em ${rotulos[i]}: ${v}h restantes</title></circle>`).join('');
  const pontosRealSvg = pontosReal.map((v, i) => v === null ? '' : `<circle cx="${xDe(i).toFixed(1)}" cy="${yDe(v).toFixed(1)}" r="2.5" fill="var(--orange)"><title>Real em ${rotulos[i]}: ${v}h restantes</title></circle>`).join('');

  const hojeIdx = rotulos.findIndex((_, i) => i > 0 && isoLocal(dias[i - 1]) === hojeIso);
  const marcadorHoje = hojeIdx >= 0
    ? `<line x1="${xDe(hojeIdx).toFixed(1)}" y1="${padT}" x2="${xDe(hojeIdx).toFixed(1)}" y2="${H - padB}" stroke="var(--orange)" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/>`
    : '';

  return `
    <div class="p-4">
      <div class="flex items-center gap-4 mb-2 text-[10px] font-bold mono uppercase">
        <span class="flex items-center gap-1.5"><span style="display:inline-block; width:14px; height:0; border-top:2px dashed var(--ink-dim);"></span> Plano (entregas planejadas)</span>
        <span class="flex items-center gap-1.5"><span style="display:inline-block; width:14px; height:2px; background:var(--orange);"></span> Real (andamento dia a dia)</span>
        <span class="ml-auto text-[var(--ink-faint)]">${totalHoras}h estimadas na sprint</span>
      </div>
      <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; max-width:${W}px;">
        ${faixasFeriado}
        ${linhasGrade}
        ${marcadorHoje}
        <path d="${caminho(pontosPlano)}" fill="none" stroke="var(--ink-dim)" stroke-width="1.5" stroke-dasharray="4 3"/>
        <path d="${caminho(pontosReal)}" fill="none" stroke="var(--orange)" stroke-width="2"/>
        ${pontosPlanoSvg}
        ${pontosRealSvg}
        ${rotulosX}
      </svg>
    </div>`;
}

/* A bandeirinha laranja de "hoje" (sysdate) sempre foi desenhada certinho na
   coluna certa — o problema é que o calendário tem dezenas de dias, e sem
   rolar a Grade pra direita a coluna de hoje fica fora da área visível, sem
   nenhum aviso de que ela existe. Chamada só ao entrar na aba (setTab), não
   a cada re-render — senão brigaria com o scroll manual da pessoa toda vez
   que qualquer coisa mudasse na tela. */
function scrollGradeParaHoje(){
  const outer = document.getElementById('gradeApresentacaoOuter');
  if(!outer) return;
  const colWidth = 64;
  const dias = diasVisiveis();
  const idx = dias.findIndex(d=> isHojeReal(d));
  if(idx < 0) return;
  const posColuna = GRADE_LEAD_WIDTH + idx*colWidth;
  const areaVisivelDepoisDoLead = Math.max(colWidth, outer.clientWidth - GRADE_LEAD_WIDTH);
  outer.scrollLeft = Math.max(0, posColuna - areaVisivelDepoisDoLead/2 + colWidth/2);
}

function openPerfilForm(id){
  const p = id ? getProf(id) : null;
  const semAcesso = DB.profissionais.filter(x=> x.id!=='p-na' && !x.email);
  const seletorNovo = !p ? `
    <div class="field"><label>Profissional</label>
      <select id="fPerfilProfId">
        <option value="">Selecione quem vai receber acesso...</option>
        ${semAcesso.map(x=>`<option value="${x.id}">${x.nome}</option>`).join('')}
      </select>
    </div>` : '';
  openFormModal(`
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-sm font-bold">${p ? `Editar acesso — ${p.nome}` : 'Conceder acesso'}</h3>
      <button onclick="closeModal()" class="text-[var(--ink-faint)] hover:text-[var(--ink)] text-lg leading-none">✕</button>
    </div>
    ${seletorNovo}
    <div class="field"><label>E-mail</label><input type="email" id="fPerfilEmail" value="${p ? p.email || '' : ''}" placeholder="nome@leany.com.br"></div>
    <div class="field"><label>Senha${p ? ' (deixe em branco pra manter a atual)' : ''}</label><input type="password" id="fPerfilSenha" placeholder="${p ? '••••••••' : 'Defina uma senha'}"></div>
    <div class="field"><label>Perfil</label>
      <select id="fPerfilTipo">
        <option value="desenvolvedor" ${!p || p.perfil_acesso==='desenvolvedor' ? 'selected' : ''}>Desenvolvedor</option>
        <option value="qa" ${p && p.perfil_acesso==='qa' ? 'selected' : ''}>QA</option>
        <option value="administrador" ${p && p.perfil_acesso==='administrador' ? 'selected' : ''}>Administrador</option>
      </select>
    </div>
    <button onclick="salvarPerfilAcesso(${p ? `'${p.id}'` : 'null'})" class="w-full bg-[var(--orange)] text-[var(--bg)] rounded-lg py-2 text-sm font-bold mt-2">Salvar</button>
  `);
}
function salvarPerfilAcesso(id){
  const profId = id || document.getElementById('fPerfilProfId').value;
  if(!profId){ toast('Selecione o profissional.', 'red'); return; }
  const p = getProf(profId);
  if(!p) return;
  const email = document.getElementById('fPerfilEmail').value.trim().toLowerCase();
  const senha = document.getElementById('fPerfilSenha').value;
  const tipo = document.getElementById('fPerfilTipo').value;
  if(!email){ toast('Informe o e-mail.', 'red'); return; }
  if(!id && !senha){ toast('Defina uma senha pro acesso novo.', 'red'); return; }
  const jaExiste = DB.profissionais.find(x=> x.id!==profId && (x.email||'').toLowerCase()===email);
  if(jaExiste){ toast('Já existe outro profissional com esse e-mail.', 'red'); return; }
  p.email = email;
  if(senha) p.senha = senha;
  p.perfil_acesso = tipo;
  closeModal();
  render();
  toast('Acesso salvo.', 'green');
}
function removerAcessoPerfil(id){
  if(id === USUARIO_LOGADO_REAL){ toast('Você não pode remover o próprio acesso.', 'red'); return; }
  if(!confirm('Remover o acesso deste profissional? Ele deixa de conseguir logar (continua existindo como recurso alocável).')) return;
  const p = getProf(id);
  if(!p) return;
  delete p.email;
  delete p.senha;
  render();
  toast('Acesso removido.', 'ink');
}

/* ---------- FERIADOS ----------
   Data que não deve receber alocação na Lego. Diferente de fim de
   semana (que nem entra no calendário), o feriado continua aparecendo como
   coluna — só fica marcado em cinza — pra deixar claro pro time por que
   ninguém está trabalhando naquele dia. */
function renderTabelaFeriados(){
  const feriadosOrdenados = [...DB.feriados].sort((a,b)=> a.data.localeCompare(b.data));
  const linhas = feriadosOrdenados.map(f=>{
    let dataFmt = f.data;
    try{ dataFmt = fmtDataComAno(new Date(f.data+'T00:00:00')); }catch(e){}
    return `<tr>
      <td class="mono font-semibold">${dataFmt}</td>
      <td>${f.nome}</td>
      <td class="text-right">
        <button class="icon-btn" onclick="openFeriadoForm('${f.id}')">Editar</button>
        <button class="icon-btn danger ml-1" onclick="excluirFeriado('${f.id}')">Excluir</button>
      </td>
    </tr>`;
  }).join('');
  const minimizado = CADASTRO_FERIADOS_MINIMIZADO;
  return `
    <div class="flex items-center justify-between mb-3 mt-8">
      <button onclick="toggleCadastroFeriados()" class="flex items-center gap-2 text-left hover:opacity-75">
        <span class="text-[var(--ink-faint)] text-xs shrink-0">${minimizado?'▸':'▾'}</span>
        <div>
          <h2 class="text-sm font-bold uppercase tracking-wide text-[var(--ink-dim)]">Feriados <span class="text-[var(--ink-faint)] font-normal normal-case">(${feriadosOrdenados.length})</span></h2>
          ${!minimizado ? `<p class="text-[11px] text-[var(--ink-faint)]">Nessas datas ninguém é alocado na Lego — a coluna do dia fica cinza.</p>` : ''}
        </div>
      </button>
      <div class="flex items-center gap-2 shrink-0">
        <button onclick="openFeriadoForm(null)" class="bg-[var(--orange)] text-[var(--bg)] px-3 py-1.5 rounded-md text-xs font-bold">+ Novo feriado</button>
        <button onclick="toggleCadastroFeriados()" class="icon-btn">${minimizado?'Maximizar':'Minimizar'}</button>
      </div>
    </div>
    ${minimizado ? '' : `<table class="cad-table">
      <thead><tr><th>Data</th><th>Nome</th><th></th></tr></thead>
      <tbody>${linhas || `<tr><td colspan="3" class="text-[var(--ink-faint)] italic">Nenhum feriado cadastrado.</td></tr>`}</tbody>
    </table>`}`;
}

function openFeriadoForm(id){
  const f = id ? DB.feriados.find(x=>x.id===id) : null;
  openFormModal(`
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-sm font-bold">${f ? 'Editar feriado' : 'Novo feriado'}</h3>
      <button onclick="closeModal()" class="text-[var(--ink-faint)] hover:text-[var(--ink)] text-lg leading-none">✕</button>
    </div>
    <div class="field"><label>Data</label><input type="date" id="fFeriadoData" value="${f?f.data:''}"></div>
    <div class="field"><label>Nome</label><input type="text" id="fFeriadoNome" value="${f?f.nome:''}" placeholder="Ex: Independência do Brasil"></div>
    <button onclick="salvarFeriado(${f?`'${f.id}'`:'null'})" class="w-full bg-[var(--orange)] text-[var(--bg)] rounded-lg py-2 text-sm font-bold mt-2">Salvar</button>
  `);
}

function salvarFeriado(id){
  const data = document.getElementById('fFeriadoData').value;
  const nome = document.getElementById('fFeriadoNome').value.trim();
  if(!data){ toast('Informe a data do feriado.', 'red'); return; }
  if(!nome){ toast('Informe o nome do feriado.', 'red'); return; }
  if(!id && DB.feriados.some(f=>f.data===data)){ toast('Já existe um feriado cadastrado nessa data.', 'red'); return; }
  if(id){
    const f = DB.feriados.find(x=>x.id===id);
    f.data = data; f.nome = nome;
  } else {
    DB.feriados.push({ id: genId('fer'), data, nome });
  }
  recalcularCronograma();
  closeModal();
  render();
  toast('Feriado salvo.', 'green');
}

function excluirFeriado(id){
  if(!confirm('Excluir este feriado? A data volta a ficar disponível pro motor alocar normalmente.')) return;
  DB.feriados = DB.feriados.filter(f=>f.id!==id);
  recalcularCronograma();
  render();
  toast('Feriado excluído.', 'green');
}

function salvarProfissional(id){
  const nome = document.getElementById('fProfNome').value.trim();
  const tech = document.getElementById('fProfTech').value.trim();
  if(!nome){ toast('Informe o nome do profissional.', 'red'); return; }
  if(id){
    const p = getProf(id);
    p.nome = nome; p.tecnologia_principal = tech || '—';

    DB.profissionais.push({ id: genId('p'), nome, tecnologia_principal: tech || '—' });

  recalcularCronograma();
  closeModal();
  render();
  render();
  toast('Profissional salvo.', 'green');

function excluirProfissional(id){
  if(DB.subtarefas.some(s=>s.responsavel_id===id)){
    toast('Não é possível excluir: há subtarefas atribuídas a este profissional.', 'red');
    return;
  }
  if(!confirm('Excluir este profissional?')) return;
  DB.profissionais = DB.profissionais.filter(p=>p.id!==id);
  DB.projetos.forEach(pj=>{ pj.equipe = pj.equipe.filter(m=>m.profissional_id!==id); });

  render();
  render();
  toast('Profissional excluído.', 'ink');

    </div>
    ${grupoTabelaProjetos('pre_projeto', 'Pré Projetos')}

}

const PALETA_PROJETOS = ['#0F4984','#2F5D50','#35679A','#4F7D70','#C9471D','#3A414A','#68707A','#1F2329'];
function corPadraoProjeto(){ return PALETA_PROJETOS[DB.projetos.length % PALETA_PROJETOS.length]; }
function statusProjetoLabel(v){ return { pre_projeto:'Pré Projeto', ativo:'Projeto Ativo', concluido:'Projeto Concluído' }[v] || 'Pré Projeto'; }
function statusProjetoCor(v){ return { pre_projeto:'var(--ink-dim)', ativo:'var(--blue-deep)', concluido:'var(--green)' }[v] || 'var(--ink-dim)'; }
// Fundo de cada "raia" da Lista de Projetos. Pré Projetos voltou pro cinza
// neutro (--panel-2) da versão anterior, a pedido. Ativos está em verde
// (--green-mist), Concluídos na escala institucional laranja L2/L5.
function statusProjetoFundo(v){ return { pre_projeto:'var(--panel-2)', ativo:'var(--green-mist)', concluido:'var(--orange-l2)' }[v] || 'var(--panel-2)'; }
function statusProjetoAccent(v){ return { pre_projeto:'var(--ink-dim)', ativo:'var(--green-deep)', concluido:'var(--orange-l5)' }[v] || 'var(--ink-dim)'; }

    <div class="field"><label>Status</label><select id="fProjStatus">
      ${['pre_projeto','ativo','concluido'].map(s=>`<option value="${s}" ${(pj ? pj.status : 'pre_projeto')===s?'selected':''}>${statusProjetoLabel(s)}</option>`).join('')}
    </select></div>
    <p class="text-[10px] text-[var(--ink-faint)] -mt-2 mb-2">Define em qual das 3 listas ("Pré Projetos", "Projetos Ativos", "Projetos Concluídos") ele aparece na Lista de Projetos.</p>
    <button onclick="salvarProjeto(${pj ? `'${pj.id}'` : 'null'})" class="w-full bg-[var(--orange)] text-[var(--bg)] rounded-lg py-2 text-sm font-bold mt-2">Salvar</button>
    <p class="text-[11px] text-[var(--ink-faint)] mt-3">A cor identifica o projeto (um pontinho) em cima da cor da subtarefa nas grades — veja a legenda no topo da Lego.</p>
    ${!pj ? `<p class="text-[11px] text-[var(--ink-faint)] mt-1">Depois de criar, use o botão "Equipe" na página do projeto para adicionar profissionais e definir o perfil de cada um nele.</p>` : ''}
    ${!DB.clientes.length ? `<p class="text-[11px] text-[var(--amber)] mt-3">Nenhum cliente cadastrado ainda — cadastre um na aba Clientes para poder vincular.</p>` : ''}
    ${pj ? `<button onclick="excluirProjeto('${pj.id}')" class="w-full text-[var(--red)] text-xs font-semibold mt-3 py-1">Excluir projeto</button>` : ''}

function salvarProjeto(id){
  if(!podeCriarProjeto()){ toast('Só administradores podem criar/editar projetos.', 'red'); return; }
  const nome = document.getElementById('fProjNome').value.trim();
  const clienteVal = document.getElementById('fProjCliente').value;
  const cor = document.getElementById('fProjCor').value;
  const sigla = document.getElementById('fProjSigla').value.trim().toUpperCase();
  const status = document.getElementById('fProjStatus').value;
  if(!nome){ toast('Informe o nome do projeto.', 'red'); return; }
  if(!sigla){ toast('Informe a sigla do projeto.', 'red'); return; }
  if(!id && DB.projetos.some(p=> p.sigla===sigla)){ toast('Já existe um projeto com essa sigla.', 'red'); return; }
  if(id){
    const pj = getProjeto(id);
    pj.nome = nome; pj.cliente_id = clienteVal || null; pj.cor_hex = cor; pj.status = status;
    // sigla não é editável depois de criado (já usada em códigos existentes)
  } else {
    DB.projetos.push({ id: genId('proj'), nome, cliente_id: clienteVal || null, cor_hex: cor, sigla, status, equipe: [] });
  }
  closeModal();
  initFiltroSelects();
  render();
  render();
  toast('Projeto salvo.', 'green');
}

/* Próximo código sugerido para uma nova história deste projeto, a partir da
   sigla cadastrada — ex: PP2-1, PP2-2... continuando a maior numeração já usada. */
function proximoIdHistoria(projetoId){
  const pj = getProjeto(projetoId);
  if(!pj || !pj.sigla) return '';
  const prefixo = pj.sigla + '-';
  let maior = 0;
  DB.historias.forEach(h=>{
    if(h.id.startsWith(prefixo)){
      const n = parseInt(h.id.slice(prefixo.length), 10);
      if(!isNaN(n) && n > maior) maior = n;
    }
  });
  return prefixo + (maior + 1);
}

function excluirProjeto(id){
  if(!podeCriarProjeto()){ toast('Só administradores podem excluir projetos.', 'red'); return; }
  if(DB.historias.some(h=>h.projeto_id===id)){
    toast('Não é possível excluir: há histórias associadas a este projeto.', 'red');
    return;
  }
  if(!confirm('Excluir este projeto?')) return;
  DB.projetos = DB.projetos.filter(p=>p.id!==id);
  if(PROJECT_FILTER === id) PROJECT_FILTER = 'all';
  initFiltroSelects();
  closeModal();
  // se o projeto excluído era o que estava aberto na página dedicada, volta
  // pra lista em vez de deixar a tela "presa" num projeto que não existe mais.
  if(PROJETOS_AREA_PROJETO === id) abrirListaProjetos(); else render();
  render();
  toast('Projeto excluído.', 'ink');
}

/* ---- Equipe do projeto (profissionais + perfil) ---- */
// % de alocação de um profissional NUM PROJETO específico — quanto do tempo
// dele é dedicado a esse projeto (o resto vai pra outros projetos/atividades
// fora do app). Usado pra calcular o fim real de uma atividade a partir da
// estimativa (ver calcularFimComAlocacao). Sem membro cadastrado = 100%.
const ALOCACOES_PCT = [25, 50, 75, 100];
function alocacaoDoProfissionalNoProjeto(profId, projetoId){
  const pj = getProjeto(projetoId);
  const membro = pj ? pj.equipe.find(m=> m.profissional_id===profId) : null;
  return membro && membro.alocacao_pct ? membro.alocacao_pct : 100;
}

function openEquipeModal(projetoId){
  const pj = getProjeto(projetoId);
  // 'p-na' (Não atribuído) é um membro-placeholder interno, usado só pra
  // subtarefas ainda sem responsável terem uma % de alocação padrão — não é
  // gente de verdade, então não aparece na tela de Equipe.
  const membrosVisiveis = pj.equipe.filter(m=> m.profissional_id !== 'p-na');
  const membrosHtml = membrosVisiveis.length ? membrosVisiveis.map(m=>{
    const p = getProf(m.profissional_id);
    const pct = m.alocacao_pct || 100;
    return `<div class="flex items-center justify-between border border-[var(--line)] rounded-lg px-3 py-2 mb-2">
      <div><div class="text-xs font-semibold">${p ? p.nome : '—'}</div><div class="text-[10px] text-[var(--ink-faint)]">${m.perfil}</div></div>
      <div class="flex items-center gap-2">
        <select onchange="alterarAlocacaoMembro('${projetoId}','${m.profissional_id}', this.value)" class="bg-[var(--panel-2)] border border-[var(--line)] rounded-md text-xs font-medium px-2 py-1 text-[var(--ink-dim)] mono" title="% de alocação nesse projeto">
          ${ALOCACOES_PCT.map(v=>`<option value="${v}" ${pct===v?'selected':''}>${v}%</option>`).join('')}
        </select>
        <button class="icon-btn danger" onclick="removerMembroEquipe('${projetoId}','${m.profissional_id}')">Remover</button>
      </div>
    </div>`;
  }).join('') : `<div class="text-xs text-[var(--ink-faint)] italic mb-2">Nenhum profissional na equipe ainda.</div>`;

  const disponiveis = DB.profissionais.filter(p=> p.id!=='p-na' && p.id!=='p-admin' && !pj.equipe.some(m=>m.profissional_id===p.id));
  const formHtml = disponiveis.length ? `
    <div class="border-t border-[var(--line)] pt-3">
      <div class="field"><label>Profissional</label><select id="fEquipeProf">${disponiveis.map(p=>`<option value="${p.id}">${p.nome}</option>`).join('')}</select></div>
      <div class="field"><label>Perfil no projeto</label><input type="text" id="fEquipePerfil" placeholder="Ex: Dev Backend Pleno"></div>
      <div class="field"><label>% de alocação neste projeto</label><select id="fEquipeAlocacao">${ALOCACOES_PCT.map(v=>`<option value="${v}" ${v===100?'selected':''}>${v}%</option>`).join('')}</select></div>
      <button onclick="adicionarMembroEquipe('${projetoId}')" class="w-full bg-[var(--orange)] text-[var(--bg)] rounded-lg py-2 text-sm font-bold">+ Adicionar à equipe</button>
    </div>` : `<p class="text-[11px] text-[var(--ink-faint)] italic border-t border-[var(--line)] pt-3">Todos os profissionais cadastrados já estão na equipe deste projeto.</p>`;

  openFormModal(`
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-sm font-bold">Equipe — ${pj.nome}</h3>
      <button onclick="closeModal()" class="text-[var(--ink-faint)] hover:text-[var(--ink)] text-lg leading-none">✕</button>
    </div>
    <div class="mb-2">${membrosHtml}</div>
    ${formHtml}
  `);
}

function adicionarMembroEquipe(projetoId){
  const pj = getProjeto(projetoId);
  const profId = document.getElementById('fEquipeProf').value;
  const perfil = document.getElementById('fEquipePerfil').value.trim();
  const alocacao_pct = parseInt(document.getElementById('fEquipeAlocacao').value, 10) || 100;
  if(!profId){ toast('Cadastre um profissional antes.', 'red'); return; }
  if(!perfil){ toast('Informe o perfil do profissional neste projeto.', 'red'); return; }
  pj.equipe.push({ profissional_id: profId, perfil, alocacao_pct });
  openEquipeModal(projetoId);
  render();
  toast('Profissional adicionado à equipe.', 'green');
}

function alterarAlocacaoMembro(projetoId, profId, pct){
  const pj = getProjeto(projetoId);
  const membro = pj.equipe.find(m=> m.profissional_id===profId);
  if(!membro) return;
  membro.alocacao_pct = parseInt(pct, 10) || 100;
  recalcularCronograma();
  render();
  toast('% de alocação atualizada.', 'green');
}

function removerMembroEquipe(projetoId, profId){
  const pj = getProjeto(projetoId);
  if(DB.subtarefas.some(s=> s.projeto_id===projetoId && s.responsavel_id===profId)){
    toast('Não é possível remover: profissional tem subtarefas atribuídas neste projeto.', 'red');
    return;
  }
  pj.equipe = pj.equipe.filter(m=>m.profissional_id!==profId);
  openEquipeModal(projetoId);
  render();
  toast('Profissional removido da equipe.', 'ink');
}

/* ---------- SPRINTS (sempre dentro da página de um projeto) ----------
   idx/moverSprint continuam usando o índice GLOBAL de DB.sprints (não só
   deste projeto) — é assim desde sempre, porque a ordem de swap ↑/↓ é uma
   troca de posição adjacente no array inteiro. Como as sprints de um mesmo
   projeto ficam sempre agrupadas no array (nunca intercaladas com as de
   outro projeto), na prática o resultado é sempre "sobe/desce dentro do
   próprio projeto" — só não é um limite travado explicitamente. A listagem
   em si (com expandir pra história/subtarefa) é a renderConteudoSprints,
   mais abaixo — não existe mais uma tabela plana separada. */

function openSprintForm(id, projetoIdPadrao){
  const sp = id ? getSprint(id) : null;
  const projetoSelecionado = sp ? sp.projeto_id : (projetoIdPadrao || null);
  const projOptions = DB.projetos.map(p=>`<option value="${p.id}" ${projetoSelecionado===p.id?'selected':''}>${p.nome}</option>`).join('');
  openFormModal(`
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-sm font-bold">${sp ? 'Editar sprint' : 'Nova sprint'}</h3>
      <button onclick="closeModal()" class="text-[var(--ink-faint)] hover:text-[var(--ink)] text-lg leading-none">✕</button>
    </div>
    <div class="field"><label>Projeto</label><select id="fSprintProjeto">${projOptions || '<option value="">—</option>'}</select></div>
    <div class="field"><label>Nome da sprint</label><input type="text" id="fSprintNome" value="${sp ? sp.nome : 'Sprint ' + (DB.sprints.length+1)}" placeholder="Ex: Sprint 3"></div>
    <div class="grid grid-cols-2 gap-3">
      <div class="field"><label>Data início (real)</label><input type="date" id="fSprintDataInicio" value="${sp && sp.data_inicio_real ? sp.data_inicio_real : ''}"></div>
      <div class="field"><label>Data fim (real)</label><input type="date" id="fSprintDataFim" value="${sp && sp.data_fim_real ? sp.data_fim_real : ''}"></div>
    </div>
    <p class="text-[10px] text-[var(--ink-faint)] -mt-2 mb-2">Se preenchido, a Lego usa essas datas reais (do board de verdade) pra posicionar as colunas dessa sprint, em vez de calcular sequencialmente pela duração. Deixe em branco pra manter o comportamento sequencial de sempre.</p>
    <div class="grid grid-cols-2 gap-3">
      <div class="field">
        <label>Duração <span class="text-[var(--ink-faint)] normal-case font-normal">(se não tiver data fim)</span></label>
        <select id="fSprintDuracao">
          ${[1,2,3,4,5,6,7,8].map(n=>`<option value="${n}" ${sp && sp.duracao_semanas===n ? 'selected':''}>${n} semana${n>1?'s':''}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Status</label><select id="fSprintStatus">
        ${['planejada','em_andamento','concluida'].map(s=>`<option value="${s}" ${sp && sp.status===s?'selected':''}>${statusSprintLabel(s)}</option>`).join('')}
      </select></div>
    </div>
    <div class="field"><label>Objetivo da sprint (Sprint Goal)</label><textarea id="fSprintObjetivo" rows="2" placeholder="O que a equipe pretende entregar/alcançar nesta sprint?">${sp ? sp.objetivo||'' : ''}</textarea></div>
    <button onclick="salvarSprint(${sp ? `'${sp.id}'` : 'null'})" class="w-full bg-[var(--orange)] text-[var(--bg)] rounded-lg py-2 text-sm font-bold mt-2">Salvar</button>
  `);
}

function salvarSprint(id){
  if(!podeGerenciarSprint()){ toast('Só Administrador ou QA podem criar/editar sprints.', 'red'); return; }
  const nome = document.getElementById('fSprintNome').value.trim();
  const duracao = parseInt(document.getElementById('fSprintDuracao').value, 10);
  const projeto_id = document.getElementById('fSprintProjeto').value;
  const status = document.getElementById('fSprintStatus').value;
  const objetivo = document.getElementById('fSprintObjetivo').value.trim();
  const data_inicio_real = document.getElementById('fSprintDataInicio').value || null;
  const data_fim_real = document.getElementById('fSprintDataFim').value || null;
  if(!nome){ toast('Informe o nome da sprint.', 'red'); return; }
  if(!projeto_id){ toast('Selecione o projeto desta sprint.', 'red'); return; }
  if(data_inicio_real && data_fim_real && data_fim_real < data_inicio_real){ toast('A data fim não pode ser antes da data início.', 'red'); return; }
  // Não deixa ativar uma sprint com subtarefa sem responsável — isso trava o
  // motor de agendamento silenciosamente (ele nunca aloca quem não existe),
  // e é melhor travar aqui, com um número concreto, do que descobrir depois
  // olhando um buraco na Lego. Uso alert() de propósito (não toast) —
  // aqui precisa realmente parar a pessoa e ser visto, não só um aviso que
  // passa despercebido.
  if(status === 'em_andamento' && id){
    const semResponsavel = DB.subtarefas.filter(s=> s.sprint_id === id && (!s.responsavel_id || s.responsavel_id === 'p-na')).length;
    if(semResponsavel > 0){
      alert(`Não é possível ativar "${nome}": ${semResponsavel} subtarefa${semResponsavel===1?'':'s'} desta sprint ainda ${semResponsavel===1?'está':'estão'} sem responsável definido. Atribua um responsável a ela${semResponsavel===1?'':'s'} antes de ativar a sprint.`);
      return;
    }
  }
  // Sprint só pode ficar "Em andamento" se a sprint ANTERIOR do mesmo projeto
  // (na ordem cadastrada — a mesma que aparece em Cadastro → Sprints, com as
  // setas de mover pra cima/baixo) já estiver Concluída. Vale tanto pra
  // sprint nova entrando direto como "Em andamento" quanto pra edição.
  if(status === 'em_andamento'){
    const sprintsProjeto = sprintsDoProjeto(projeto_id);
    const idxAtual = id ? sprintsProjeto.findIndex(s=>s.id===id) : sprintsProjeto.length;
    const anterior = idxAtual > 0 ? sprintsProjeto[idxAtual-1] : null;
    if(anterior && anterior.status !== 'concluida'){
      alert(`Não é possível ativar "${nome}": a sprint anterior deste projeto, "${anterior.nome}", ainda não está concluída (está ${statusSprintLabel(anterior.status).toLowerCase()}). Conclua-a antes de ativar esta.`);
      return;
    }
  }
  let precisaReconstruirCalendario = false;
  if(id){
    const sp = getSprint(id);
    precisaReconstruirCalendario = sp.duracao_semanas !== duracao || sp.data_inicio_real !== data_inicio_real || sp.data_fim_real !== data_fim_real;
    sp.nome = nome; sp.duracao_semanas = duracao; sp.projeto_id = projeto_id; sp.status = status; sp.objetivo = objetivo;
    sp.data_inicio_real = data_inicio_real; sp.data_fim_real = data_fim_real;
  } else {
    DB.sprints.push({ id: genId('sp'), nome, duracao_semanas: duracao, projeto_id, status, objetivo, data_inicio_real, data_fim_real });
    precisaReconstruirCalendario = true; // sprint nova sempre muda o calendário
  }
  closeModal();
  initFiltroSelects();
  if(precisaReconstruirCalendario){
    resetSimulacao(`Sprint "${nome}" salva — datas/duração mudaram, calendário reconstruído e simulação reiniciada.`);
  } else {
    recalcularCronograma();
    render();
  }
}

function moverSprint(id, dir){
  if(!podeGerenciarSprint()) return;
  const idx = DB.sprints.findIndex(s=>s.id===id);
  const novoIdx = idx + dir;
  if(novoIdx < 0 || novoIdx >= DB.sprints.length) return;
  const tmp = DB.sprints[idx];
  DB.sprints[idx] = DB.sprints[novoIdx];
  DB.sprints[novoIdx] = tmp;
  initFiltroSelects();
  render();
  resetSimulacao('Ordem das sprints alterada — calendário reconstruído.');
}

function excluirSprint(id){
  if(!podeGerenciarSprint()){ toast('Só Administrador ou QA podem excluir sprints.', 'red'); return; }
  if(DB.historias.some(h=>h.sprint_id===id)){
    toast('Não é possível excluir: há histórias associadas a esta sprint.', 'red');
    return;
  }
  if(DB.sprints.length <= 1){
    toast('É preciso manter ao menos uma sprint cadastrada.', 'red');
    return;
  }
  if(!confirm('Excluir esta sprint?')) return;
  DB.sprints = DB.sprints.filter(s=>s.id!==id);
  if(SPRINT_FILTER === id) SPRINT_FILTER = 'all';
  initFiltroSelects();
  render();
  resetSimulacao('Sprint excluída — calendário reconstruído e simulação reiniciada.');
}

/* =========================================================================
   ABA CLIENTES — cadastro + visualização de todos os projetos do cliente
   e o status de cada um.
   ========================================================================= */
function toggleExpandCliente(id){
  EXPANDED_CLIENTE_ID = EXPANDED_CLIENTE_ID === id ? null : id;
  renderClientes();
}

function renderClientes(){
  const el = document.getElementById('viewClientes');
  const linhas = DB.clientes.map(c=>{
    const projetos = projetosDoCliente(c.id);
    const expanded = EXPANDED_CLIENTE_ID === c.id;
    const linhaPrincipal = `<tr class="cursor-pointer" onclick="toggleExpandCliente('${c.id}')">
      <td>${expanded?'▾':'▸'} <span class="font-bold">${c.nome}</span></td>
      <td class="text-[var(--ink-dim)]">${c.contato || '—'}</td>

/* ---- Subtarefas ---- */

/* Capacidade: cada profissional tem 8h/dia = 2 turnos (4h manhã + 4h tarde).
   turnosUteisNoPeriodo conta quantos turnos úteis existem no calendário entre
   duas datas (inclusive); turnosComprometidos soma a estimativa de outras
   subtarefas do mesmo profissional cujo período planejado se sobrepõe. */
function turnosUteisNoPeriodo(dataIniStr, dataFimStr){
  if(!dataIniStr || !dataFimStr) return 0;
  const ini = new Date(dataIniStr+'T00:00:00');
  const fim = new Date(dataFimStr+'T00:00:00');
  return TURN_SLOTS.filter(s=> s.data >= ini && s.data <= fim).length;
}
function turnosComprometidos(profId, dataIniStr, dataFimStr, excluirSubId){
  if(!profId || !dataIniStr || !dataFimStr) return 0;
  const ini = new Date(dataIniStr+'T00:00:00');
  const fim = new Date(dataFimStr+'T00:00:00');
  let total = 0;
  DB.subtarefas.forEach(s=>{
    if(s.id === excluirSubId) return;
    if(s.responsavel_id !== profId) return;
    if(!s.data_inicio_planejada || !s.data_fim_planejada) return;
    const sIni = new Date(s.data_inicio_planejada+'T00:00:00');
    const sFim = new Date(s.data_fim_planejada+'T00:00:00');
    if(sIni <= fim && sFim >= ini) total += s.estimativa_turnos;
  });
  return total;
}
/* Retorna {capacidadeTotal, comprometido, disponivel, cabe} para exibição e validação. */
function calcularCapacidade(profId, dataIniStr, dataFimStr, estimativa, excluirSubId){
  const capacidadeTotal = turnosUteisNoPeriodo(dataIniStr, dataFimStr);
  const comprometido = turnosComprometidos(profId, dataIniStr, dataFimStr, excluirSubId);
  const disponivel = capacidadeTotal - comprometido;
  return { capacidadeTotal, comprometido, disponivel, cabe: estimativa <= disponivel };
}

    ${sub && (sub.data_inicio_real || sub.data_termino_real) ? `<div class="grid grid-cols-2 gap-3">
      <div class="field"><label>Início real</label><div class="text-xs mono text-[var(--ink-dim)] py-1.5">${sub.data_inicio_real ? fmtData(new Date(sub.data_inicio_real+'T00:00:00')) : '—'}</div></div>
      <div class="field"><label>Término real</label><div class="text-xs mono text-[var(--ink-dim)] py-1.5">${sub.data_termino_real ? fmtData(new Date(sub.data_termino_real+'T00:00:00')) : '—'}</div></div>
    </div>
    <p class="text-[10px] text-[var(--ink-faint)] -mt-2 mb-2">Preenchidos sozinhos: início real quando a subtarefa entra em Desenvolvimento pela primeira vez, término real toda vez que chega em Code Review.</p>` : ''}
    ${hist ? `<p class="text-[11px] text-[var(--ink-faint)] mb-2">A cor desta subtarefa é sempre a mesma da história ${hist.id} — <span style="color:${hist.cor_hex}; font-weight:700;">●</span> — para facilitar o reconhecimento no timeline.</p>` : ''}
    <button onclick="salvarSubtarefa(${historiaId?`'${historiaId}'`:'null'}, ${sub?`'${sub.id}'`:'null'})" class="w-full bg-[var(--orange)] text-[var(--bg)] rounded-lg py-2 text-sm font-bold mt-2" ${!DB.historias.length?'disabled style="opacity:.4"':''}>Salvar</button>
  `);

/* Recalcula a Data fim planejada toda vez que início, período de início,
   estimativa ou responsável mudam no formulário — usa a % de alocação do
   responsável NESSE projeto (Cadastro → Projetos → Equipe) pra saber quanto
   do tempo dele realmente vai pra essa atividade. Editar a Data fim na mão
   depois funciona normal (só não recalcula sozinha de novo, a não ser que
   início/turno/estimativa/responsável mudem de novo). */
function recalcularFimSubtarefa(){
  const dataIniEl = document.getElementById('fSubDataInicio');
  const turnoEl = document.getElementById('fSubTurnoInicio');
  const estimativaEl = document.getElementById('fSubEstimativa');
  const respEl = document.getElementById('fSubResp');
  const dataFimEl = document.getElementById('fSubDataFim');
  // só precisa de início + período + estimativa pra calcular — o responsável
  // refina com a % de alocação dele quando já estiver escolhido, mas não é
  // pré-requisito (assume 100% até lá).
  if(dataIniEl && turnoEl && estimativaEl && dataFimEl && dataIniEl.value){
    const projetoEl = document.getElementById('fSubProjeto') || document.getElementById('fSubProjetoFixo');
    const projetoId = projetoEl ? projetoEl.value : null;
    const horas = Math.max(4, parseInt(estimativaEl.value,10)||4);
    const estimativaTurnos = horas / 4;
    const pct = (projetoId && respEl && respEl.value) ? alocacaoDoProfissionalNoProjeto(respEl.value, projetoId) : 100;
    const fimCalculado = calcularFimComAlocacao(dataIniEl.value, turnoEl.value, estimativaTurnos, pct);
    if(fimCalculado) dataFimEl.value = fimCalculado;
  }
  atualizarCapacidadeSubtarefa();
}

/* Mostra, em tempo real, se o profissional selecionado tem capacidade (8h/dia
   = 2 turnos) para absorver esta subtarefa no período planejado, considerando
   o que ele já tem comprometido com outras subtarefas nesse mesmo período. */
function atualizarCapacidadeSubtarefa(){
  const el = document.getElementById('fSubCapacidadeInfo');
  if(!el) return;
  const respSel = document.getElementById('fSubResp');
  const dataIniEl = document.getElementById('fSubDataInicio');
  const dataFimEl = document.getElementById('fSubDataFim');
  const estimativaEl = document.getElementById('fSubEstimativa');
  const idAtualEl = document.getElementById('fSubId');
  if(!respSel || !dataIniEl || !dataFimEl || !estimativaEl){ el.innerHTML=''; return; }

  const profId = respSel.value;
  const dataIni = dataIniEl.value;
  const dataFim = dataFimEl.value;
  const estimativa = Math.max(1, parseInt(estimativaEl.value,10)||4) / 4;
  const excluirId = idAtualEl && idAtualEl.disabled ? idAtualEl.value : null;

  if(!profId || !dataIni || !dataFim){ el.innerHTML = ''; return; }

  const prof = getProf(profId);
  const { capacidadeTotal, comprometido, disponivel, cabe } = calcularCapacidade(profId, dataIni, dataFim, estimativa, excluirId);
  const cor = cabe ? 'var(--green)' : 'var(--red)';
  const bg = cabe ? '#EAF6EC' : '#FBEAE9';
  el.innerHTML = `<div class="text-[11px] rounded-lg px-3 py-2 mb-2" style="background:${bg}; color:${cor}; border:1px solid ${cor}55;">
    ${cabe
      ? `✓ ${prof ? prof.nome : 'Profissional'} tem capacidade: ${disponivel} de ${capacidadeTotal} turno(s) livres nesse período (${comprometido} já comprometido(s)).`
      : `⚠ ${prof ? prof.nome : 'Profissional'} está sem capacidade suficiente: só ${Math.max(0,disponivel)} de ${capacidadeTotal} turno(s) livres nesse período (${comprometido} já comprometido(s)), mas esta subtarefa precisa de ${estimativa}.`}
  </div>`;
}

function salvarSubtarefa(historiaId, id){
  if(!podeGerenciarHistoriaSubtarefa()){ toast('Você não tem permissão pra criar/editar subtarefas.', 'red'); return; }
  if(!historiaId){
    const histSel = document.getElementById('fSubHistoria');
    historiaId = histSel ? histSel.value : null;
  }
  if(!historiaId){ toast('Selecione a história desta subtarefa.', 'red'); return; }
  const hist = getHistoria(historiaId);
  if(!hist){ toast('História inválida.', 'red'); return; }
  const idCampo = id || document.getElementById('fSubId').value.trim();
  const titulo = document.getElementById('fSubTitulo').value.trim();
  const descricao = document.getElementById('fSubDescricao').value.trim();
  const tipo = document.getElementById('fSubTipo').value;
  const estimativa = Math.max(1, parseInt(document.getElementById('fSubEstimativa').value,10)||4) / 4;
  const resp = document.getElementById('fSubResp').value;
  const ordem = parseInt(document.getElementById('fSubOrdem').value,10)||1;
  const data_inicio_planejada = document.getElementById('fSubDataInicio').value || null;
  const data_fim_planejada = document.getElementById('fSubDataFim').value || null;
  const turnoInicioEl = document.getElementById('fSubTurnoInicio');
  const turno_inicio_planejado = turnoInicioEl ? turnoInicioEl.value : 'manha';

  if(!idCampo){ toast('Informe o ID da subtarefa.', 'red'); return; }
  if(!titulo){ toast('Informe o título da subtarefa.', 'red'); return; }
  if(!id && getSubtarefa(idCampo)){ toast('Já existe uma subtarefa com esse ID.', 'red'); return; }
  if(!resp){ toast('Selecione um responsável da equipe do projeto.', 'red'); return; }
  if(data_inicio_planejada && data_fim_planejada && data_fim_planejada < data_inicio_planejada){ toast('A data fim planejada não pode ser antes da data início.', 'red'); return; }

  // trava dura: duas atividades do MESMO profissional não podem começar no
  // mesmo dia e período (M ou T) — diferente do aviso de capacidade abaixo
  // (que é sobre o período todo e pode ser ignorado), essa aqui bloqueia
  // sempre, porque é um choque direto de agenda no exato turno de início.
  if(data_inicio_planejada && resp){
    const conflito = DB.subtarefas.find(s=>
      s.id !== id &&
      s.responsavel_id === resp &&
      s.status !== 'concluida' &&
      s.data_inicio_planejada === data_inicio_planejada &&
      (s.turno_inicio_planejado || 'manha') === turno_inicio_planejado
    );
    if(conflito){
      const prof = getProf(resp);
      toast(`${prof ? prof.nome : 'Esse profissional'} já tem a subtarefa ${conflito.id} começando nesse mesmo dia e período (${labelTurno(turno_inicio_planejado)}). Ajuste a data/período antes de salvar.`, 'red');
      return;
    }
  }

  if(data_inicio_planejada && data_fim_planejada){
    const { capacidadeTotal, comprometido, disponivel, cabe } = calcularCapacidade(resp, data_inicio_planejada, data_fim_planejada, estimativa, id);
    if(!cabe){
      const prof = getProf(resp);
      const prosseguir = confirm(`Atenção: ${prof ? prof.nome : 'este profissional'} já tem ${comprometido} turno(s) comprometido(s) nesse período (${capacidadeTotal} turno(s) úteis no total, sobram ${Math.max(0,disponivel)}). Esta subtarefa precisa de ${estimativa} turno(s) e ultrapassa a capacidade dele(a). Salvar mesmo assim?`);
      if(!prosseguir) return;
    }
  }

  if(id){
    const s = getSubtarefa(id);
    // se a data fim planejada está sendo adiada (empurrada pra frente), guarda a
    // primeira data prometida como referência — assim dá pra replanejar sem perder
    // a visão de que aquilo atrasou (usado no Gantt da aba Projetos).
    if(s.data_fim_planejada && data_fim_planejada && data_fim_planejada > s.data_fim_planejada && !s.data_fim_original){
      s.data_fim_original = s.data_fim_planejada;
    }
    s.titulo=titulo; s.descricao=descricao; s.tipo=tipo; s.estimativa_turnos=estimativa; s.responsavel_id=resp; s.ordem_fila=ordem;
    s.data_inicio_planejada=data_inicio_planejada; s.data_fim_planejada=data_fim_planejada; s.turno_inicio_planejado=turno_inicio_planejado;
  } else {
    DB.subtarefas.push({ id:idCampo, historia_id:historiaId, titulo, descricao, estimativa_turnos:estimativa, tipo,
      responsavel_id:resp, depende_de_ids:[], ordem_fila:ordem, status:'aguardando',
      data_inicio_planejada, data_fim_planejada, data_fim_original:null, turno_inicio_planejado,
      projeto_id:hist.projeto_id, sprint_id:hist.sprint_id, inicio_turnoIdx:null, fim_turnoIdx:null });
  }
  recalcularCronograma();
  closeModal();
  render();
  render();
  toast('Subtarefa salva.', 'green');
}

function excluirSubtarefa(id){
  if(!podeGerenciarHistoriaSubtarefa()){ toast('Você não tem permissão pra excluir subtarefas.', 'red'); return; }
  if(!confirm('Excluir esta subtarefa?')) return;
  DB.subtarefas.forEach(s=>{ s.depende_de_ids = s.depende_de_ids.filter(d=>d!==id); });
  DB.subtarefas = DB.subtarefas.filter(s=>s.id!==id);
  DB.grade = DB.grade.filter(g=>g.tarefa_id!==id);
  recalcularCronograma();
  render();
  render();
  toast('Subtarefa excluída.', 'ink');
}

/* =========================================================================
   MODO APRESENTAÇÃO (Lego em tela cheia pra projetor)
   Não recalcula nada — só esconde header/toolbar/rodapé e deixa a Grade
   ocupar a tela inteira, exatamente com o filtro (projeto/sprint/visualização)
   que já estava aplicado no momento em que o botão foi clicado. Tenta entrar
   em fullscreen de verdade; se o navegador/ambiente bloquear (ex: iframe sem
   permissão), o modo visual continua funcionando do mesmo jeito.
   ========================================================================= */
let MODO_APRESENTACAO_GRADE = false;

function ativarModoApresentacao(){
  if(currentTab !== 'grade') return;
  MODO_APRESENTACAO_GRADE = true;
  document.body.classList.add('modo-apresentacao');
  if(document.documentElement.requestFullscreen){
    document.documentElement.requestFullscreen().catch(()=>{ /* segue sem fullscreen nativo */ });
  }
  // espera o navegador aplicar o esconde-tudo do CSS (e o fullscreen, se
  // rolou) antes de medir o espaço disponível de verdade.
  requestAnimationFrame(()=> requestAnimationFrame(ajustarEscalaApresentacao));
}

function sairModoApresentacao(){
  if(!MODO_APRESENTACAO_GRADE) return;
  MODO_APRESENTACAO_GRADE = false;
  document.body.classList.remove('modo-apresentacao');
  if(document.fullscreenElement && document.exitFullscreen){
    document.exitFullscreen().catch(()=>{});
  }
  const wrap = document.getElementById('gradeApresentacaoWrap');
  if(wrap) wrap.style.transform = '';
}

/* Escala o mesmo conteúdo já renderizado (com o filtro que já estava
   aplicado) pra ocupar a tela toda — tipo slide de apresentação se ajustando
   ao tamanho da tela. Não recalcula nem refiltra nada, só mede o espaço
   disponível (sem header/toolbar/rodapé) e aplica um transform:scale que
   cabe tanto na largura quanto na altura. */
function ajustarEscalaApresentacao(){
  if(!MODO_APRESENTACAO_GRADE) return;
  const wrap = document.getElementById('gradeApresentacaoWrap');
  const outer = document.getElementById('gradeApresentacaoOuter');
  if(!wrap || !outer) return;
  wrap.style.transform = 'none'; // zera antes de medir o tamanho natural
  const naturalW = wrap.scrollWidth;
  const naturalH = wrap.scrollHeight;
  const availW = outer.clientWidth;
  const availH = outer.clientHeight;
  if(!naturalW || !naturalH || !availW || !availH) return;
  const escala = Math.min(availW / naturalW, availH / naturalH);
  wrap.style.transformOrigin = 'top left';
  wrap.style.transform = `scale(${escala})`;
}

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && MODO_APRESENTACAO_GRADE) sairModoApresentacao();
});
// cobre o caso do usuário sair do fullscreen nativo por outro caminho
// (tecla do próprio navegador, etc.) — mantém o estado do app sincronizado.
// Ao ENTRAR em fullscreen (async, pode mudar o tamanho da tela depois do
// clique), reajusta a escala pro tamanho definitivo.
document.addEventListener('fullscreenchange', function(){
  if(!document.fullscreenElement && MODO_APRESENTACAO_GRADE){ sairModoApresentacao(); return; }
  if(document.fullscreenElement && MODO_APRESENTACAO_GRADE){
    requestAnimationFrame(()=> requestAnimationFrame(ajustarEscalaApresentacao));
  }
});
window.addEventListener('resize', function(){
  if(MODO_APRESENTACAO_GRADE) ajustarEscalaApresentacao();
});

/* =========================================================================
   TABS / BOOT
   ========================================================================= */
function setTab(tab){
  // Trava de acesso: sem identidade selecionada (USUARIO_ATUAL), essas 5
  // telas nem deviam estar clicáveis (o botão já fica escondido — ver
  // render()), mas qualquer chamada direta (abrirListaProjetos() etc.) cai
  // de volta pro Início em vez de renderizar a tela restrita.
  if(!USUARIO_ATUAL && tab !== 'inicio') tab = 'inicio';
  // Cadastro e Perfis são exclusivos de Administrador — mesma trava, mesmo
  // motivo: o botão já fica escondido, isso é só a rede de segurança pra
  // navegação direta.
  if(tab === 'cadastro' && !podeAcessarCadastro()) tab = 'inicio';
  if(tab === 'perfis' && !podeAcessarPerfis()) tab = 'inicio';
  currentTab = tab;
  document.getElementById('viewInicio').classList.toggle('hidden', tab!=='inicio');
  document.getElementById('viewInicio').classList.toggle('flex', tab==='inicio');
  document.getElementById('viewGrade').classList.toggle('hidden', tab!=='grade');
  document.getElementById('viewGrade').classList.toggle('flex', tab==='grade');
  document.getElementById('viewClientes').classList.toggle('hidden', tab!=='clientes');
  document.getElementById('viewCadastro').classList.toggle('hidden', tab!=='cadastro');
  document.getElementById('viewMinhaArea').classList.toggle('hidden', tab!=='minhaarea');
  document.getElementById('viewMinhaArea').classList.toggle('flex', tab==='minhaarea');
  document.getElementById('viewProjetosArea').classList.toggle('hidden', tab!=='projetosarea');
  document.getElementById('viewProjetosArea').classList.toggle('flex', tab==='projetosarea');
  document.getElementById('viewPerfis').classList.toggle('hidden', tab!=='perfis');
  document.getElementById('viewPerfis').classList.toggle('flex', tab==='perfis');

  document.getElementById('tabBtnInicio').classList.toggle('active', tab==='inicio');
  document.getElementById('tabBtnGrade').classList.toggle('active', tab==='grade');
  document.getElementById('tabBtnMinhaArea').classList.toggle('active', tab==='minhaarea');
  document.getElementById('tabBtnProjetosArea').classList.toggle('active', tab==='projetosarea');
  document.getElementById('tabBtnClientes').classList.toggle('active', tab==='clientes');
  document.getElementById('tabBtnCadastro').classList.toggle('active', tab==='cadastro');
  document.getElementById('tabBtnPerfis').classList.toggle('active', tab==='perfis');

  document.getElementById('gradeToolbar').classList.toggle('hidden', tab!=='grade');
  document.getElementById('gradeOnlyControls').classList.toggle('hidden', tab!=='grade');
  render();
  if(tab === 'grade') scrollGradeParaHoje();
}

function render(){
  const resumo = document.getElementById('sprintSummary');
  if(resumo){
    resumo.textContent = `${DIAS.length} dias úteis · ${TURN_SLOTS.length} turnos · ${DB.sprints.length} sprint(s) cadastrada(s)`;
    resumo.title = 'Turno = período de 4h (manhã ou tarde). Cada dia útil tem 2 turnos, então o total de turnos é o dobro dos dias úteis.';
    resumo.classList.add('cursor-help');
  }

  const navPosLogin = document.getElementById('navPosLogin');
  if(navPosLogin) navPosLogin.classList.toggle('hidden', !USUARIO_ATUAL);
  const navAdminOnly = document.getElementById('navAdminOnly');
  if(navAdminOnly) navAdminOnly.classList.toggle('hidden', !podeAcessarCadastro());

  const legend = document.getElementById('projetoLegend');
  if(legend){
    const estados = ['atrasada','concluida','em_desenvolvimento','aguardando'];
    legend.innerHTML = `<span class="text-[10px] text-[var(--ink-faint)] mono uppercase">Status:</span>` +
      estados.map(v=>`<span class="flex items-center gap-1.5 text-[11px] text-[var(--ink-dim)]">
        <span style="width:8px; height:8px; border-radius:50%; background:${statusVisualCor(v)}; box-shadow:0 0 0 1px rgba(0,0,0,.25); display:inline-block;"></span>${statusVisualLabel(v)}
      </span>`).join('');
  }

  if(currentTab==='inicio') renderInicio();
  else if(currentTab==='grade') renderGrade();
  else if(currentTab==='clientes') renderClientes();
  else if(currentTab==='cadastro') renderCadastro();
  else if(currentTab==='minhaarea') renderMinhaArea();
  else if(currentTab==='projetosarea') renderProjetosArea();
  else if(currentTab==='perfis') renderPerfis();
}

/* =========================================================================
   RENDER — MINHA ÁREA: espaço do desenvolvedor para acompanhar e atualizar
   suas próprias subtarefas (status + comentários), sem poder alterar as
   datas planejadas — isso é decisão de planejamento, não de execução.
   ========================================================================= */
/* Identidade da sessão — compartilhada entre a tela Início (dashboard
   pessoal) e a Minha Área. Selecionar/trocar usuário em qualquer uma das
   duas reflete na outra, porque render() redesenha a aba que estiver ativa
   no momento (não força troca de aba). */
function selecionarUsuarioArea(profId){
  // É o login de verdade — muda quem está autenticado E de quem é a visão
  // mostrada. Pra só TROCAR a visão sem sair da conta (o "ver como" do
  // administrador), use confirmarVerComo(), não esta função.
  USUARIO_ATUAL = profId || null;
  USUARIO_LOGADO_REAL = profId || null;
  MINHA_AREA_PROJETO_FILTRO = 'all';
  MINHA_AREA_SPRINT_FILTRO = 'all';
  render();
}

/* Login real (e-mail + senha) — a Início é o único lugar que pede
   credenciais; as outras 5 telas ficam escondidas do header até logar (ver

   protótipo sem backend; nunca trate isso como autenticação de produção. */
function htmlLoginForm(){
  return `
    <div class="h-full flex items-center justify-center">
      <div class="leany-card bg-[var(--panel)] border border-[var(--line)] rounded-xl p-6 max-w-sm w-full">

function subtarefasDaMinhaArea(profId){
  let subs = DB.subtarefas.filter(s=> s.responsavel_id === profId);
  if(MINHA_AREA_PROJETO_FILTRO !== 'all'){
    subs = subs.filter(s=> s.projeto_id === MINHA_AREA_PROJETO_FILTRO);
    // sprint só é filtrável depois de escolher o projeto (ver renderMinhaArea).
    if(MINHA_AREA_SPRINT_FILTRO !== 'all') subs = subs.filter(s=> s.sprint_id === MINHA_AREA_SPRINT_FILTRO);
  }
  // ordena: em andamento primeiro, depois aguardando, depois concluída; dentro
  // de cada grupo, pela ordem na fila.
  const peso = { em_desenvolvimento:0, code_review:1, em_teste:1, aguardando:2, concluida:3 };
  return subs.sort((a,b)=> (peso[a.status]??2) - (peso[b.status]??2) || a.ordem_fila - b.ordem_fila);
}

/* `opts.skipConfirm` — usado pelo Kanban (drag-and-drop e setas ‹ ›), onde o
   próprio gesto de mover já é a confirmação; o diálogo de confirm() só faz
   sentido nos botões de status da visão em Lista. */
function atualizarStatusSubtarefaArea(subId, novoStatus, opts){
  opts = opts || {};
  const sub = getSubtarefa(subId);
  if(!sub) return;
  if(sub.status === novoStatus) return; // já está nesse status, clique não faz nada
  if(!opts.skipConfirm){
    const confirmado = confirm(`Mudar o status de ${subId} de "${statusLabel(sub.status)}" para "${statusLabel(novoStatus)}"?`);
    if(!confirmado) return;
  }
  sub.status = novoStatus;
  sub.status_atualizado_em = TURN_SLOTS[CURRENT_IDX] ? TURN_SLOTS[CURRENT_IDX].data.toISOString().slice(0,10) : null;
  const slotAtual = DB.grade.find(g=> g.turnoIdx === CURRENT_IDX && g.tarefa_id === subId);
  // Data real (sysdate, não o CURRENT_IDX simulado) de quando o trabalho de
  // verdade começou e de quando o desenvolvimento em si terminou — separado
  // do "Data início/fim planejada" (que é o planejamento) e do
  // inicio_turnoIdx/fim_turnoIdx (que é a simulação de turnos). "Início real"
  // só é gravado uma vez (a primeira vez que entra em desenvolvimento);
  // "término real" é atualizado toda vez que chega em Code Review — se
  // voltar pra desenvolvimento e chegar em Code Review de novo, reflete a
  // conclusão mais recente.
  if(novoStatus === 'em_desenvolvimento' && !sub.data_inicio_real){
    sub.data_inicio_real = isoLocal(new Date());
  }
  if(novoStatus === 'code_review'){
    sub.data_termino_real = isoLocal(new Date());
  }
  if(novoStatus === 'concluida'){
    if(sub.inicio_turnoIdx === null || sub.inicio_turnoIdx === undefined) sub.inicio_turnoIdx = CURRENT_IDX;
    sub.fim_turnoIdx = CURRENT_IDX;
    if(slotAtual) slotAtual.status_turno = 'Concluido';
  } else if(novoStatus !== 'aguardando'){
    // em_desenvolvimento, code_review, em_teste — todos contam como trabalho ativo
    if(sub.inicio_turnoIdx === null || sub.inicio_turnoIdx === undefined) sub.inicio_turnoIdx = CURRENT_IDX;
    if(slotAtual && slotAtual.status_turno !== 'Bloqueado') slotAtual.status_turno = 'Em_Andamento';
  }
  recalcularCronograma();
  render();
}

/* Drag-and-drop nativo do Kanban — dataTransfer carrega o id da subtarefa;
   guardamos também numa variável global como fallback (alguns navegadores
   perdem o dataTransfer se o drop for cancelado/reiniciado). */
let KANBAN_DRAG_SUB_ID = null;
function onKanbanDragStart(e, subId){
  KANBAN_DRAG_SUB_ID = subId;
  if(e.dataTransfer){ e.dataTransfer.setData('text/plain', subId); e.dataTransfer.effectAllowed = 'move'; }
}
function onKanbanDrop(e, novoStatus){
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const subId = (e.dataTransfer && e.dataTransfer.getData('text/plain')) || KANBAN_DRAG_SUB_ID;
  KANBAN_DRAG_SUB_ID = null;
  if(!subId) return;
  atualizarStatusSubtarefaArea(subId, novoStatus, {skipConfirm:true});
}

          <input type="text" id="fWorklogDesc_${sub.id}" placeholder="O que foi feito? (opcional)" class="flex-1 min-w-[140px] bg-[var(--panel-2)] border border-[var(--line)] rounded-md text-xs px-3 py-2">
          <button onclick="adicionarWorklog('${sub.id}')" class="bg-[var(--orange)] text-[var(--bg)] rounded-md px-3 py-2 text-xs font-bold">Apontar</button>
        </div>` : `<p class="text-[11px] text-[var(--ink-faint)] italic mt-2">Só dá pra apontar horas depois que a subtarefa for movida pra "Concluída".</p>`}
      </div>
      <div class="mt-3 border-t border-[var(--line)] pt-3">
        <div class="text-[10px] text-[var(--ink-faint)] mono uppercase mb-2">Comentários ${comentarios.length ? `(${comentarios.length})` : ''}</div>
        ${comentarios.map(c=>{
          const autor = getProf(c.autor_id);
          let quando = '';
          try { quando = fmtData(new Date(c.data)); } catch(e) { quando = ''; }
          return `<div class="text-[12px] bg-[var(--panel-2)] rounded-lg px-3 py-2 mb-1.5">
            <span class="font-semibold">${autor ? autor.nome : 'Alguém'}</span>

        <div class="flex items-center gap-2 mt-2">
          <input type="text" id="fComentario_${sub.id}" placeholder="Escrever um comentário..." class="flex-1 bg-[var(--panel-2)] border border-[var(--line)] rounded-md text-xs px-3 py-2" onkeydown="if(event.key==='Enter'){adicionarComentarioSubtarefa('${sub.id}')}">
          <button onclick="adicionarComentarioSubtarefa('${sub.id}')" class="bg-[var(--orange)] text-[var(--bg)] rounded-md px-3 py-2 text-xs font-bold">Comentar</button>
        </div>
      </div>
    </div>`;
  }).join('');

  const vazioMsg = `<div class="text-sm text-[var(--ink-faint)] italic py-8 text-center">${MINHA_AREA_PROJETO_FILTRO==='all' ? 'Nenhuma subtarefa sua no momento.' : 'Nenhuma subtarefa sua neste filtro.'}</div>`;
  const conteudo = MINHA_AREA_VIEW === 'kanban'
    ? (subs.length ? renderKanbanMinhaArea(subs) : vazioMsg)
    : (cards || vazioMsg);

  el.innerHTML = `
    <div class="p-5 w-full mx-auto" style="max-width:${MINHA_AREA_VIEW==='kanban' ? '1400px' : '48rem'}">
      <div class="flex items-center justify-between mb-1">
        <div class="flex items-center gap-3">
          <div>
            <h2 class="text-sm font-bold uppercase tracking-wide">Minha Área — ${prof.nome}</h2>
            <p class="text-[11px] text-[var(--ink-faint)]">${prof.tecnologia_principal || ''}</p>
          </div>
          <button onclick="abrirAnotacoesModal('${USUARIO_ATUAL}')" class="flex items-center gap-1.5 text-[11px] font-semibold px-2.5 py-1.5 rounded-md border border-[var(--line)] text-[var(--ink-dim)] hover:border-[var(--ink-faint)] hover:bg-[var(--panel-2)] shrink-0">📓 Anotações${qtdAnotacoes ? ` <span class="mono">(${qtdAnotacoes})</span>` : ''}</button>
        </div>
        <button onclick="trocarUsuarioArea()" class="text-[11px] text-[var(--ink-faint)] hover:text-[var(--ink)] underline shrink-0">Trocar usuário</button>

        <div class="flex items-center border border-[var(--line)] rounded-md overflow-hidden">
          <button onclick="setMinhaAreaView('kanban')" class="tab-btn ${MINHA_AREA_VIEW==='kanban'?'active':''} px-3 py-1.5 text-[11px] font-semibold mono">🗂 KANBAN</button>
          <button onclick="setMinhaAreaView('lista')" class="tab-btn ${MINHA_AREA_VIEW==='lista'?'active':''} px-3 py-1.5 text-[11px] font-semibold mono">📋 LISTA</button>
        </div>
        <select onchange="setMinhaAreaProjetoFiltro(this.value)" class="bg-[var(--panel-2)] border border-[var(--line)] rounded-md text-xs font-medium px-2 py-1.5 text-[var(--ink-dim)] mono">
          <option value="all" ${MINHA_AREA_PROJETO_FILTRO==='all'?'selected':''}>Todos os projetos</option>
          ${projOptionsMinhaArea}
        </select>
        ${MINHA_AREA_PROJETO_FILTRO!=='all' ? `<select onchange="setMinhaAreaSprintFiltro(this.value)" class="bg-[var(--panel-2)] border border-[var(--line)] rounded-md text-xs font-medium px-2 py-1.5 text-[var(--ink-dim)] mono">
          <option value="all" ${MINHA_AREA_SPRINT_FILTRO==='all'?'selected':''}>Todas as sprints</option>
          ${sprintOptions}
        </select>` : ''}
        <span class="text-[11px] text-[var(--ink-faint)] mono ml-auto">${subs.length} subtarefa${subs.length===1?'':'s'}</span>
      </div>
      ${conteudo}
    </div>`;
}

/* =========================================================================
   KANBAN — Minha Área. Colunas fixas = SUBTAREFA_STATUS_ORDEM (Aguardando →
   Desenvolvimento → Code Review → Em teste → Concluída). Mover um card muda
   sub.status via atualizarStatusSubtarefaArea, tanto por arrastar-e-soltar
   quanto pelas setas ‹ › (fallback pra touch/teclado). Pausa é ortogonal ao
   fluxo — o card fica na coluna do status atual, só com um selo visual.
   ========================================================================= */
function renderKanbanMinhaArea(subs){
  const porStatus = {};
  SUBTAREFA_STATUS_ORDEM.forEach(st=> porStatus[st] = []);
  subs.forEach(s=> (porStatus[s.status] || porStatus.aguardando).push(s));

  const colunas = SUBTAREFA_STATUS_ORDEM.map(status=>{
    const itens = porStatus[status];
    const cardsHtml = itens.map(sub=> renderKanbanCard(sub)).join('');
    return `<div class="kanban-col"
        ondragover="event.preventDefault(); event.currentTarget.classList.add('drag-over');"
        ondragleave="event.currentTarget.classList.remove('drag-over');"
        ondrop="onKanbanDrop(event,'${status}')">
      <div class="kanban-col-header"><span>${statusLabel(status)}</span><span class="kanban-col-count">${itens.length}</span></div>
      <div class="kanban-col-body">${cardsHtml || `<div class="kanban-empty">Nada aqui</div>`}</div>
    </div>`;
  }).join('');

  return `<div class="kanban-board">${colunas}</div>`;
}

function renderKanbanCard(sub){
  const hist = getHistoria(sub.historia_id);
  const proj = getProjeto(sub.projeto_id);
  const idx = SUBTAREFA_STATUS_ORDEM.indexOf(sub.status);
  const podeVoltar = idx > 0;
  const podeAvancar = idx >= 0 && idx < SUBTAREFA_STATUS_ORDEM.length - 1;
  const realizado = horasApontadas(sub.id);
  const estimado = horasEstimadas(sub);
  return `<div class="kanban-card ${sub.pausada?'is-paused':''}" draggable="true"
      ondragstart="onKanbanDragStart(event,'${sub.id}')"
      style="border-left:3px solid ${proj?proj.cor_hex:'transparent'}">
    <div class="flex items-center justify-between gap-1">
      <span class="text-[11px] font-bold mono" style="color:${corDaSubtarefa(sub)}">${sub.id}</span>
    </div>
    <div class="text-[12px] font-semibold mt-1 leading-snug">${sub.titulo}</div>
    <div class="text-[10px] text-[var(--ink-faint)] mt-1 truncate">${hist ? hist.id : '—'} · ${nomeProjeto(sub.projeto_id)}</div>
    ${sub.descricao ? `<div class="text-[10px] text-[var(--ink-dim)] mt-1 line-clamp-2" title="${sub.descricao.replace(/"/g,'&quot;')}">${sub.descricao}</div>` : ''}
    <div class="flex items-center justify-between mt-2">
      <span class="text-[10px] mono" style="color:${realizado > estimado ? 'var(--red)' : 'var(--ink-dim)'}" title="Horas realizadas / estimadas">${realizado}h / ${estimado}h</span>
      ${sub.impedimento ? `<span class="text-[9px]" title="Impedimento aberto">🚧</span>` : ''}
    </div>
    ${sub.pausada ? `<div class="text-[9px] font-bold mono uppercase px-1.5 py-0.5 rounded mt-1.5 inline-block" style="background:var(--amber)22; color:var(--amber)">⏸ Pausada</div>` : ''}
    <div class="flex items-center justify-between mt-2 pt-2 border-t border-[var(--line)]">
      <button class="kanban-nav-btn" ${!podeVoltar?'disabled':''} title="Voltar etapa" onclick="atualizarStatusSubtarefaArea('${sub.id}','${podeVoltar?SUBTAREFA_STATUS_ORDEM[idx-1]:''}',{skipConfirm:true})">‹</button>
      <button class="text-[10px] font-semibold" style="color:${sub.pausada?'var(--green)':'var(--amber)'}" onclick="${sub.pausada?`retomarSubtarefa('${sub.id}')`:`abrirPausarForm('${sub.id}')`}">${sub.pausada?'▶ Retomar':'⏸ Pausar'}</button>
      <button class="kanban-nav-btn" ${!podeAvancar?'disabled':''} title="Avançar etapa" onclick="atualizarStatusSubtarefaArea('${sub.id}','${podeAvancar?SUBTAREFA_STATUS_ORDEM[idx+1]:''}',{skipConfirm:true})">›</button>
    </div>
  </div>`;
}

/* =========================================================================
   RENDER — ÁREA DE PROJETOS: Gantt por FASES do projeto (etapas de alto
   nível, texto livre, cadastradas à mão — não vêm de história/subtarefa).
   Cada fase guarda a data planejada ORIGINAL (nunca muda depois de criada) e
   a data ATUAL (vigente); todo replanejamento fica registrado num log —
   pode acontecer mais de uma vez, e o histórico completo fica visível.
   ========================================================================= */
let PROJETOS_AREA_PROJETO = null;
let BACKLOG_AREA_EXPANDIDAS = new Set();
// Lista de histórias de cada sprint no Backlog — recolhida por padrão (igual
// ao card de história individual); só entra no Set quando o usuário expande.
let BACKLOG_SPRINTS_EXPANDIDAS = new Set();

function diffDias(a, b){
  return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00')) / 86400000);
}

/* Navegação da área de Projetos, em dois níveis:
   1) Lista de Projetos (PROJETOS_TAB==='projetos', sem projeto aberto) — só a
      listagem geral, agrupada por status, sem barra de sub-abas.
   2) Página exclusiva de UM projeto (qualquer outro valor de PROJETOS_TAB) —
      abre ao clicar no nome do projeto na lista; mostra um cabeçalho fixo
      (nome, cliente, status, botões Equipe/Editar) e uma barra de sub-abas
      (Sprints/Backlog/Histórias/Status/Wiki) sempre travada nesse projeto —
      as 5 telas por baixo continuam sendo as mesmas de sempre, só que agora
      sempre recebem o projeto já escolhido, sem seletor próprio. */
let PROJETOS_TAB = 'projetos';
function setProjetosTab(t){ PROJETOS_TAB = t; render(); }
function abrirListaProjetos(){
  PROJETOS_TAB = 'projetos';
  PROJETOS_AREA_PROJETO = null;
  setTab('projetosarea');
}
function abrirProjetoDetalhe(projetoId, aba){
  PROJETOS_AREA_PROJETO = projetoId;
  PROJETOS_TAB = aba || 'sprints';
  HISTORIAS_TAB_FILTRO_PROJETO = projetoId; HISTORIAS_TAB_FILTRO_SPRINT = 'all';
  setTab('projetosarea');
}

  const el = document.getElementById('viewProjetosArea');

  const proj = getProjeto(PROJETOS_AREA_PROJETO);
  const abas = [

  const nav = abas.map(([k,label])=>`
    <button onclick="setProjetosTab('${k}')" class="tab-btn ${PROJETOS_TAB===k?'active':''} px-3 py-1.5 rounded-md text-xs font-semibold mono">${label.toUpperCase()}</button>
  `).join('');

  el.innerHTML = `
    <div class="p-5 max-w-6xl w-full mx-auto">
      <button onclick="abrirListaProjetos()" class="text-[11px] text-[var(--ink-faint)] hover:text-[var(--ink)] font-semibold mb-3">← Voltar pra Lista de Projetos</button>
      <div class="flex items-start justify-between mb-4 flex-wrap gap-3 pb-4 border-b border-[var(--line)]">
        <div>
          <div class="flex items-center gap-2 flex-wrap">
            <span class="w-3 h-3 rounded-full shrink-0" style="background:${proj.cor_hex}"></span>
            <h2 class="text-lg font-bold">${proj.nome}</h2>
            <span class="text-[9px] font-bold uppercase px-1.5 py-0.5 rounded shrink-0" style="background:${statusProjetoCor(proj.status)}22; color:${statusProjetoCor(proj.status)}">${statusProjetoLabel(proj.status)}</span>
          </div>
          <div class="text-[11px] text-[var(--ink-faint)] mt-0.5">${nomeCliente(proj.cliente_id)}</div>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          ${ehAdministrador() ? `<button onclick="openEquipeModal('${proj.id}')" class="icon-btn">Equipe</button>
