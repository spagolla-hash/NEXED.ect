        </div>
      </div>
      <div class="flex items-center gap-2 mb-4 flex-wrap">${nav}</div>
      ${body}
    </div>`;
}

function renderConteudoFases(projetoId){
  const fases = fasesDoProjeto(projetoId);
  const hojeStr = TURN_SLOTS[CURRENT_IDX] ? TURN_SLOTS[CURRENT_IDX].data.toISOString().slice(0,10) : null;

  let ganttHtml;
  if(fases.length){
    let minData = fases.reduce((m,f)=>{
      const ini = f.data_inicio_planejada < f.data_inicio_atual ? f.data_inicio_planejada : f.data_inicio_atual;
      return !m || ini < m ? ini : m;
    }, null);
    let maxData = fases.reduce((m,f)=>{
      const fim = f.data_fim_planejada > f.data_fim_atual ? f.data_fim_planejada : f.data_fim_atual;
      return !m || fim > m ? fim : m;
    }, null);
    if(hojeStr && hojeStr < minData) minData = hojeStr;
    if(hojeStr && hojeStr > maxData) maxData = hojeStr;

    const pxPerDay = 20;
    const totalDias = diffDias(minData, maxData) + 1;
    const totalWidth = Math.max(400, totalDias * pxPerDay);
    const alturaHeader = 32, alturaLinha = 56;
    const alturaTotal = alturaHeader + fases.length * alturaLinha;

    const ticks = [];
    let cursor = new Date(minData+'T00:00:00');
    const fimLoop = new Date(maxData+'T00:00:00');
    while(cursor <= fimLoop){ ticks.push(new Date(cursor)); cursor.setDate(cursor.getDate()+7); }
    const headerTicks = ticks.map(d=>{
      const left = diffDias(minData, d.toISOString().slice(0,10)) * pxPerDay;
      return `<div class="absolute top-0 bottom-0 border-l border-[var(--line)]" style="left:${left}px;"><span class="text-[9px] text-[var(--ink-faint)] mono pl-1">${fmtData(d)}</span></div>`;
    }).join('');

    const barTop = 18, barHeight = 20;
    const rows = fases.map((f,i)=>{
      const replanejada = f.data_inicio_atual !== f.data_inicio_planejada || f.data_fim_atual !== f.data_fim_planejada;
      const leftAtual = diffDias(minData, f.data_inicio_atual) * pxPerDay;
      const widthAtual = Math.max((diffDias(f.data_inicio_atual, f.data_fim_atual)+1) * pxPerDay, 18);
      const cor = f.cor || corPadraoFase(f.projeto_id);
      const corAtraso = f.cor_atraso || COR_ATRASO_PADRAO;
      let segmentsHtml = '';
      let atrasoLabel = '';
      let unionLeft = leftAtual, unionWidth = widthAtual;
      if(replanejada){
        // A janela do plano original (data_inicio/fim_planejada) sempre aparece inteira na
        // cor de atraso. O que sobra da janela atual (antes ou depois da janela original) some
        // exibido na cor da própria fase — assim dá pra ver exatamente até onde ia o plano
        // original (vermelho) e o quanto passou disso na data vigente (cor da fase).
        const leftOriginal = diffDias(minData, f.data_inicio_planejada) * pxPerDay;
        const widthOriginal = Math.max((diffDias(f.data_inicio_planejada, f.data_fim_planejada)+1) * pxPerDay, 18);
        const origStart = leftOriginal, origEnd = leftOriginal + widthOriginal;
        const atualStart = leftAtual, atualEnd = leftAtual + widthAtual;
        unionLeft = Math.min(origStart, atualStart);
        unionWidth = Math.max(origEnd, atualEnd) - unionLeft;
        const segs = [];
        const antesFim = Math.min(origStart, atualEnd);
        if(atualStart < antesFim) segs.push({left:atualStart, width:antesFim-atualStart, cor});
        segs.push({left:origStart, width:origEnd-origStart, cor:corAtraso,
          titulo:`Plano original: ${fmtData(new Date(f.data_inicio_planejada+'T00:00:00'))} → ${fmtData(new Date(f.data_fim_planejada+'T00:00:00'))}`});
        const depoisInicio = Math.max(origEnd, atualStart);
        if(atualEnd > depoisInicio) segs.push({left:depoisInicio, width:atualEnd-depoisInicio, cor});
        segmentsHtml = segs.map(s=>`<div class="absolute rounded-md" style="left:${s.left}px; width:${s.width}px; top:${barTop}px; height:${barHeight}px; background:${s.cor};" ${s.titulo?`title="${s.titulo}"`:''}></div>`).join('');
        const diasAtraso = diffDias(f.data_fim_planejada, f.data_fim_atual);
        atrasoLabel = `<span class="text-[8px] font-bold mono ml-1.5" style="color:${corAtraso}; white-space:nowrap;">${diasAtraso>0?'+':''}${diasAtraso}d</span>`;
      } else {
        segmentsHtml = `<div class="absolute rounded-md" style="left:${leftAtual}px; width:${widthAtual}px; top:${barTop}px; height:${barHeight}px; background:${cor};"></div>`;
      }
      return `<div class="absolute border-b border-[var(--line)]" style="left:0; right:0; top:${alturaHeader + i*alturaLinha}px; height:${alturaLinha}px;">
        ${segmentsHtml}
        <div class="absolute cursor-pointer flex items-center gap-1 px-2" style="left:${unionLeft}px; width:${unionWidth}px; top:${barTop}px; height:${barHeight}px;" onclick="abrirFaseDetalhe('${f.id}')" title="${f.nome} (${statusFaseLabel(f.status)})${replanejada ? ' · replanejada '+f.replanejamentos.length+'x' : ''}">
          <span class="text-[10px] font-bold text-white truncate" style="text-shadow:0 1px 2px rgba(0,0,0,.5);">${f.nome}</span>
          ${f.status==='concluida' ? `<span class="ml-auto shrink-0 flex items-center justify-center rounded-full" style="width:13px; height:13px; background:#fff;" title="Concluída"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>` : ''}
        </div>
        <span class="absolute text-[9px] mono" style="left:${unionLeft + unionWidth + 6}px; top:${barTop + 4}px; white-space:nowrap; color:var(--ink-dim);">${fmtData(new Date(f.data_inicio_atual+'T00:00:00'))}→${fmtData(new Date(f.data_fim_atual+'T00:00:00'))}${atrasoLabel}</span>
      </div>`;
    }).join('');

    const hojeLeft = hojeStr ? diffDias(minData, hojeStr) * pxPerDay : null;
    const hojeMarker = hojeLeft!==null ? `<div class="absolute border-l-2 border-[var(--orange)] z-10" style="left:${hojeLeft}px; top:0; height:${alturaTotal}px;" title="Hoje"></div>` : '';

    ganttHtml = `
      <div class="flex border border-[var(--line)] rounded-xl overflow-hidden">
        <div class="w-64 shrink-0 border-r border-[var(--line)] bg-[var(--panel)]">
          <div class="border-b border-[var(--line)] flex items-center px-3 text-[10px] font-bold uppercase text-[var(--ink-faint)] mono" style="height:${alturaHeader}px;">Fase</div>
          ${fases.map(f=>{
            const replanejada = f.data_inicio_atual !== f.data_inicio_planejada || f.data_fim_atual !== f.data_fim_planejada;
            const corAtrasoRow = f.cor_atraso || COR_ATRASO_PADRAO;
            const datasHtml = replanejada
              ? `<div class="text-[9px] mono leading-tight pl-5 mt-0.5">
                  <span style="color:var(--ink-faint); text-decoration:line-through;">${fmtData(new Date(f.data_inicio_planejada+'T00:00:00'))}→${fmtData(new Date(f.data_fim_planejada+'T00:00:00'))}</span>
                  <span style="color:${corAtrasoRow}; font-weight:700;"> → ${fmtData(new Date(f.data_inicio_atual+'T00:00:00'))}→${fmtData(new Date(f.data_fim_atual+'T00:00:00'))}</span>
                </div>`
              : `<div class="text-[9px] mono leading-tight pl-5 mt-0.5 text-[var(--ink-faint)]">${fmtData(new Date(f.data_inicio_atual+'T00:00:00'))}→${fmtData(new Date(f.data_fim_atual+'T00:00:00'))}</div>`;
            return `<div class="flex flex-col justify-center px-3 border-b border-[var(--line)]" style="height:${alturaLinha}px;">
              <div class="flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full shrink-0" style="background:${statusFaseCor(f.status)}" title="Status: ${statusFaseLabel(f.status)}"></span>
                <button onclick="abrirFaseForm('${projetoId}','${f.id}')" class="text-[var(--ink-faint)] hover:text-[var(--ink)] text-xs shrink-0" title="Editar fase">✎</button>
                <span class="text-xs font-semibold truncate flex-1" title="${f.nome}">${f.nome}</span>
                ${replanejada ? `<span class="text-[9px] font-bold shrink-0" style="color:${corAtrasoRow}" title="Replanejada ${f.replanejamentos.length}x">${f.replanejamentos.length}x</span>` : ''}
              </div>
              ${datasHtml}
            </div>`;
          }).join('')}
        </div>
        <div class="flex-1 overflow-auto scrollbox">
          <div class="relative" style="width:${totalWidth}px; height:${alturaTotal}px;">
            <div class="absolute top-0 left-0 right-0 border-b border-[var(--line)] relative" style="height:${alturaHeader}px;">${headerTicks}</div>
            ${rows}
            ${hojeMarker}
          </div>
        </div>
      </div>`;
  } else {
    ganttHtml = `<div class="text-sm text-[var(--ink-faint)] italic py-8 text-center border border-[var(--line)] rounded-xl">Nenhuma fase cadastrada pra este projeto ainda.</div>`;
  }

    return `
      <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
        <div>
          <h2 class="text-sm font-bold uppercase tracking-wide">Cronograma do Projeto</h2>
          <p class="text-[11px] text-[var(--ink-faint)]">Cor da barra = escolhida por você em cada fase; pontinho ao lado do nome = status; quando a fase já foi replanejada, o plano original aparece atrás da barra atual, na mesma linha.</p>
        </div>
        ${podeEditarStatusProjeto() ? `<button onclick="abrirFaseForm('${projetoId}', null)" class="bg-[var(--orange)] text-[var(--bg)] px-3 py-2 rounded-md text-xs font-bold">+ Nova fase</button>` : ''}
      </div>
      <div class="flex items-center gap-4 mb-3 text-[11px] flex-wrap">
        <span class="text-[10px] font-bold uppercase text-[var(--ink-faint)] mono">Status (pontinho):</span>
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full" style="background:var(--ink-dim)"></span>Planejada</span>
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full" style="background:var(--blue-deep)"></span>Em andamento</span>
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full" style="background:var(--green)"></span>Concluída</span>
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full" style="background:var(--red)"></span>Atrasada</span>
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full" style="background:var(--amber)"></span>Bloqueada</span>
        <span class="flex items-center gap-1.5"><span style="display:inline-block; width:14px; height:10px; border-radius:2px; background:var(--ink-faint);"></span>Plano original (mesma linha, cor definida por fase — aparece nos trechos que não coincidem com a data atual)</span>
        <span class="flex items-center gap-1.5"><span style="display:inline-block; width:0; border-left:2px solid var(--orange); height:11px;"></span>Hoje</span>
      </div>
      ${ganttHtml}
      <p class="text-[11px] text-[var(--ink-faint)] mt-3">Clique numa barra (ou no ✎ do rótulo) pra ver detalhes, mudar status ou replanejar as datas de uma fase. Pra mudar as cores da fase, use ✎ e depois "Salvar".</p>
      ${renderReport3pSecao(projetoId)}`;
}

/* Report 3Ps (Progressos/Problemas/Planejamento): 3 caixas de texto lado a lado +
   data, abaixo do gráfico de fases. O histórico fica agrupado por data, e cada
   data abre/fecha independente das outras (igual ao Backlog por sprint). */
function renderReport3pSecao(projetoId){
  const hojeStr = TURN_SLOTS[CURRENT_IDX] ? TURN_SLOTS[CURRENT_IDX].data.toISOString().slice(0,10) : '';
  const reports = reportsDoProjeto(projetoId);
  const datasVistas = [];
  reports.forEach(r=>{ if(!datasVistas.includes(r.data)) datasVistas.push(r.data); });

  const camposReport = (r)=> `<div class="grid grid-cols-3 gap-3">
      <div><div class="text-[9px] font-bold uppercase text-[var(--ink-faint)] mono mb-1">Progressos</div><div class="text-xs whitespace-pre-wrap">${r.progressos || `<span class="text-[var(--ink-faint)] italic">—</span>`}</div></div>
      <div><div class="text-[9px] font-bold uppercase text-[var(--ink-faint)] mono mb-1">Problemas</div><div class="text-xs whitespace-pre-wrap">${r.problemas || `<span class="text-[var(--ink-faint)] italic">—</span>`}</div></div>
      <div><div class="text-[9px] font-bold uppercase text-[var(--ink-faint)] mono mb-1">Planejamento</div><div class="text-xs whitespace-pre-wrap">${r.planejamento || `<span class="text-[var(--ink-faint)] italic">—</span>`}</div></div>
    </div>`;

  const historicoHtml = datasVistas.length ? datasVistas.map(data=>{
    const itens = reports.filter(r=>r.data===data);
    const chave = `${projetoId}::${data}`;
    const expandido = REPORT3P_DATAS_EXPANDIDAS.has(chave);
    return `<div class="border border-[var(--line)] rounded-lg mb-2 overflow-hidden">
      <button onclick="toggleReport3pData('${chave}')" class="w-full flex items-center gap-2 px-3 py-2 text-left hover:bg-[var(--panel-2)]">
        <span class="text-[var(--ink-faint)] text-xs shrink-0">${expandido?'▾':'▸'}</span>
        <span class="text-xs font-bold mono">${fmtData(new Date(data+'T00:00:00'))}</span>
        <span class="text-[10px] text-[var(--ink-faint)] mono">${itens.length} report${itens.length===1?'':'s'}</span>
      </button>
      ${expandido ? itens.map(r=>`<div class="px-3 pb-3 pt-2 border-t border-[var(--line)]">
          ${camposReport(r)}
          <button onclick="excluirReport3p('${r.id}')" class="text-[10px] text-[var(--red)] font-semibold mt-2">Excluir este report</button>
        </div>`).join('<div class="border-t border-dashed border-[var(--line)]"></div>') : ''}
    </div>`;
  }).join('') : `<p class="text-[12px] text-[var(--ink-faint)] italic">Nenhum report ainda.</p>`;

  return `
    <div class="mt-6 pt-5 border-t-2 border-[var(--line)]">
      <h2 class="text-sm font-bold uppercase tracking-wide mb-1">Report 3Ps</h2>
      <p class="text-[11px] text-[var(--ink-faint)] mb-3">Progressos, Problemas e Planejamento — um snapshot por data, pra acompanhar a evolução do projeto ao longo do tempo.</p>
      <div class="field max-w-[180px]"><label>Data do report</label><input type="date" id="fReportData" value="${hojeStr}"></div>
      <div class="grid grid-cols-3 gap-3 mt-2">
        <div class="field"><label>Progressos</label><textarea id="fReportProgressos" rows="4" placeholder="O que avançou desde o último report..."></textarea></div>
        <div class="field"><label>Problemas</label><textarea id="fReportProblemas" rows="4" placeholder="Bloqueios, riscos, pendências..."></textarea></div>
        <div class="field"><label>Planejamento</label><textarea id="fReportPlanejamento" rows="4" placeholder="Próximos passos até o próximo report..."></textarea></div>
      </div>
      <button onclick="salvarReport3p('${projetoId}')" class="bg-[var(--orange)] text-[var(--bg)] px-4 py-2 rounded-md text-xs font-bold mt-3">Salvar report</button>

      <h3 class="text-xs font-bold uppercase tracking-wide text-[var(--ink-dim)] mt-6 mb-2">Histórico ${reports.length ? `<span class="text-[var(--ink-faint)] font-normal normal-case">(${reports.length})</span>` : ''}</h3>
      ${historicoHtml}
    </div>`;
}

/* Form de criação/edição básica da fase: nome (texto livre) e status.
   Quando é uma fase NOVA, também pede a data início/fim planejada — que vira
   o plano original E a data atual ao mesmo tempo. Fases já existentes não
   têm as datas editáveis aqui (isso é replanejamento, uma ação separada e
   registrada). */
function abrirFaseForm(projetoId, faseId){
  if(!podeEditarStatusProjeto()){ toast('Você só pode visualizar o Status deste projeto.', 'red'); return; }
  const fase = faseId ? getFase(faseId) : null;
  const proj = getProjeto(projetoId);
  openFormModal(`
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-sm font-bold">${fase ? 'Editar fase' : 'Nova fase'} <span class="text-[var(--ink-faint)] font-normal">— ${proj.nome}</span></h3>
      <button onclick="closeModal()" class="text-[var(--ink-faint)] hover:text-[var(--ink)] text-lg leading-none">✕</button>
    </div>
    <div class="field"><label>Nome da fase</label><input type="text" id="fFaseNome" value="${fase?fase.nome:''}" placeholder="Ex: Descoberta, Desenvolvimento, Homologação..."></div>
    ${!fase ? `
    <div class="grid grid-cols-2 gap-3">
      <div class="field"><label>Data início planejada</label><input type="date" id="fFaseInicio"></div>
      <div class="field"><label>Data fim planejada</label><input type="date" id="fFaseFim"></div>
    </div>
    <p class="text-[10px] text-[var(--ink-faint)] -mt-2 mb-2">Essa é a data prometida — fica guardada como referência. Depois de criada, pra mudar a data use "Replanejar" (mantém o histórico).</p>
    ` : ''}
    <div class="field"><label>Status</label><select id="fFaseStatus">
      ${['planejada','em_andamento','concluida','atrasada','bloqueada'].map(s=>`<option value="${s}" ${fase && fase.status===s?'selected':''}>${statusFaseLabel(s)}</option>`).join('')}
    </select></div>
    <div class="grid grid-cols-2 gap-3">
      <div class="field"><label>Cor da barra (Gantt)</label><input type="color" id="fFaseCor" value="${fase ? fase.cor : corPadraoFase(projetoId)}"></div>
      <div class="field"><label>Cor do plano original / atraso</label><input type="color" id="fFaseCorAtraso" value="${fase ? fase.cor_atraso : COR_ATRASO_PADRAO}"></div>
    </div>
    <p class="text-[10px] text-[var(--ink-faint)] -mt-2 mb-2">A primeira cor é a barra da fase no cronograma. A segunda é usada só quando a fase é replanejada — pra desenhar a barra tracejada do plano original e o rótulo de dias de atraso.</p>
    <button onclick="salvarFase('${projetoId}', ${fase?`'${fase.id}'`:'null'})" class="w-full bg-[var(--orange)] text-[var(--bg)] rounded-lg py-2 text-sm font-bold mt-2">Salvar</button>
    ${fase ? `<button onclick="excluirFase('${fase.id}')" class="w-full text-[var(--red)] text-xs font-semibold mt-2 py-1">Excluir fase</button>` : ''}
    ${fase ? `<button onclick="closeModal(); abrirReplanejamentoFase('${fase.id}')" class="w-full border border-[var(--line)] rounded-lg py-2 text-sm font-bold mt-2">Replanejar datas →</button>` : ''}
  `);
}

function salvarFase(projetoId, faseId){
  if(!podeEditarStatusProjeto()){ toast('Você só pode visualizar o Status deste projeto.', 'red'); return; }
  const nome = document.getElementById('fFaseNome').value.trim();
  const status = document.getElementById('fFaseStatus').value;
  const cor = document.getElementById('fFaseCor').value;
  const cor_atraso = document.getElementById('fFaseCorAtraso').value;
  if(!nome){ toast('Informe o nome da fase.', 'red'); return; }
  if(faseId){
    const fase = getFase(faseId);
    fase.nome = nome; fase.status = status; fase.cor = cor; fase.cor_atraso = cor_atraso;
  } else {
    const inicio = document.getElementById('fFaseInicio').value;
    const fim = document.getElementById('fFaseFim').value;
    if(!inicio || !fim){ toast('Informe as datas de início e fim planejadas.', 'red'); return; }
    if(fim < inicio){ toast('A data fim não pode ser antes da data início.', 'red'); return; }
    const ordem = fasesDoProjeto(projetoId).length + 1;
    DB.fases.push({ id: genId('fase'), projeto_id: projetoId, nome, ordem, status, cor, cor_atraso,
      data_inicio_planejada: inicio, data_fim_planejada: fim,
      data_inicio_atual: inicio, data_fim_atual: fim, replanejamentos: [] });
  }
  closeModal();
  renderProjetosArea();
}

function excluirFase(faseId){
  if(!podeEditarStatusProjeto()){ toast('Você só pode visualizar o Status deste projeto.', 'red'); return; }
  if(!confirm('Excluir esta fase? O histórico de replanejamentos dela também será perdido.')) return;
  DB.fases = DB.fases.filter(f=>f.id!==faseId);
  closeModal();
  renderProjetosArea();
}

/* Report 3Ps: 3 caixas de texto lado a lado (Progressos/Problemas/Planejamento) +
   data, salvos no histórico do projeto. O histórico abre/fecha só por data, uma
   entrada de cada vez em cada grupo — igual ao padrão do Backlog por sprint. */
function salvarReport3p(projetoId){
  const data = document.getElementById('fReportData').value;
  const progressos = document.getElementById('fReportProgressos').value.trim();
  const problemas = document.getElementById('fReportProblemas').value.trim();
  const planejamento = document.getElementById('fReportPlanejamento').value.trim();
  if(!data){ toast('Informe a data do report.', 'red'); return; }
  if(!progressos && !problemas && !planejamento){ toast('Preencha ao menos um dos 3 campos.', 'red'); return; }
  DB.reports3p.push({
    id: genId('report3p'), projeto_id: projetoId, data, progressos, problemas, planejamento,
    criado_em: TURN_SLOTS[CURRENT_IDX] ? TURN_SLOTS[CURRENT_IDX].data.toISOString() : new Date().toISOString(),
  });
  REPORT3P_DATAS_EXPANDIDAS.add(`${projetoId}::${data}`);
  toast('Report salvo no histórico.', 'green');
  renderProjetosArea();
}
function excluirReport3p(reportId){
  if(!confirm('Excluir este report do histórico?')) return;
  DB.reports3p = DB.reports3p.filter(r=>r.id!==reportId);
  renderProjetosArea();
}
function toggleReport3pData(chave){
  if(REPORT3P_DATAS_EXPANDIDAS.has(chave)) REPORT3P_DATAS_EXPANDIDAS.delete(chave);
  else REPORT3P_DATAS_EXPANDIDAS.add(chave);
  renderProjetosArea();
}

/* Wiki do projeto: comentário livre com data + autor, mais uma busca que filtra
   o histórico por qualquer trecho de texto (comentário, autor ou data formatada).
   O autor vem sozinho de USUARIO_ATUAL (mesma identidade da Início/Minha Área)
   quando alguém já "entrou"; sem ninguém logado, cai num seletor manual — a
   Wiki não fica bloqueada só por isso, já que esta área (Projetos) nunca exigiu
   login pra ser usada. */
function renderConteudoWiki(projetoId){
  PROJETOS_AREA_PROJETO = projetoId;
  if(!DB.projetos.length){
    return `<div class="text-sm text-[var(--ink-faint)] italic">Cadastre um projeto primeiro na aba Projetos, aqui do lado.</div>`;
  }
  const hojeStr = TURN_SLOTS[CURRENT_IDX] ? TURN_SLOTS[CURRENT_IDX].data.toISOString().slice(0,10) : '';

  const autorLogado = USUARIO_ATUAL ? getProf(USUARIO_ATUAL) : null;
  const autorOptions = DB.profissionais.filter(p=> p.id!=='p-na' && p.id!=='p-admin')
    .map(p=>`<option value="${p.id}">${p.nome}</option>`).join('');
  const campoAutorHtml = autorLogado
    ? `<div class="field"><label>Autor</label><div class="text-xs font-semibold py-1.5">${autorLogado.nome} <span class="text-[var(--ink-faint)] font-normal">(logado na Início/Minha Área)</span></div><input type="hidden" id="fWikiAutor" value="${autorLogado.id}"></div>`
    : `<div class="field"><label>Autor</label><select id="fWikiAutor"><option value="">Selecione quem está comentando...</option>${autorOptions}</select></div>`;

  // Relacionar (opcional) — cascata Sprint → História → Subtarefa, todas
  // filtradas pelo projeto desta página. Só existe pra dar contexto ao
  // comentário; nenhuma das três é obrigatória.
  const sprintOptionsWiki = `<option value="">Não relacionado</option><option value="backlog">📋 Backlog (sem sprint)</option>` +
    sprintsDoProjeto(projetoId).map(s=>`<option value="${s.id}">${s.nome}</option>`).join('');
  const historiaOptionsWiki = `<option value="">Não relacionado</option>` +
    DB.historias.filter(h=>h.projeto_id===projetoId).map(h=>`<option value="${h.id}">${h.id} — ${h.titulo}</option>`).join('');

  const termo = WIKI_BUSCA.trim().toLowerCase();
  const todosDoProjeto = wikiDoProjeto(projetoId);
  const itens = termo
    ? todosDoProjeto.filter(w=>{
        const autor = getProf(w.autor_id);
        const hist = w.historia_id ? getHistoria(w.historia_id) : null;
        const sub = w.subtarefa_id ? getSubtarefa(w.subtarefa_id) : null;
        const alvo = `${w.titulo||''} ${w.texto} ${autor ? autor.nome : ''} ${fmtData(new Date(w.data+'T00:00:00'))} ${hist?hist.id+' '+hist.titulo:''} ${sub?sub.id+' '+sub.titulo:''}`.toLowerCase();
        return alvo.includes(termo);
      })
    : todosDoProjeto;

  const listaHtml = itens.length ? itens.map(w=>{
    const autor = getProf(w.autor_id);
    const hist = w.historia_id ? getHistoria(w.historia_id) : null;
    const sub = w.subtarefa_id ? getSubtarefa(w.subtarefa_id) : null;
    const vinculoHtml = sub
      ? `<span class="text-[10px] mono px-1.5 py-0.5 rounded" style="background:var(--ink-dim)15; color:var(--ink-dim)" title="Subtarefa relacionada">🔗 ${sub.id}</span>`
      : hist
      ? `<span class="text-[10px] mono px-1.5 py-0.5 rounded" style="background:var(--ink-dim)15; color:var(--ink-dim)" title="História relacionada">🔗 ${hist.id}</span>`
      : '';
    return `<div class="border border-[var(--line)] rounded-lg p-3 mb-2">
      <div class="flex items-center justify-between gap-2 mb-1.5">
        <div class="flex items-center gap-2 flex-wrap">
          <span class="text-xs font-bold mono">${fmtData(new Date(w.data+'T00:00:00'))}</span>
          <span class="text-[11px] text-[var(--ink-faint)]">${autor ? autor.nome : 'Alguém'}</span>
          ${vinculoHtml}
        </div>
        <button onclick="excluirWiki('${w.id}')" class="text-[var(--ink-faint)] hover:text-[var(--red)] text-xs shrink-0" title="Excluir comentário">✕</button>
      </div>
      ${w.titulo ? `<div class="text-[13px] font-bold mb-1">${w.titulo}</div>` : ''}
      <div class="text-[13px] text-[var(--ink-dim)] whitespace-pre-wrap">${formatarTextoWiki(w.texto)}</div>
    </div>`;
  }).join('') : `<p class="text-[12px] text-[var(--ink-faint)] italic">${termo ? 'Nenhum comentário encontrado pra essa busca.' : 'Nenhum comentário ainda.'}</p>`;

  return `
    <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
      <div>
        <h2 class="text-sm font-bold uppercase tracking-wide">Wiki do Projeto</h2>
        <p class="text-[11px] text-[var(--ink-faint)]">Anotações e comentários livres do projeto, com data e autor — um histórico de conhecimento pesquisável.</p>
      </div>
      <button onclick="gerarRelatorioPhaseOut('${projetoId}')" class="bg-[var(--graphite)] text-white px-3 py-2 rounded-md text-xs font-bold whitespace-nowrap" title="Gera um documento com todo o histórico da Wiki, pronto pra apresentar a negócio/executivos">📄 Relatório Phase-out</button>
    </div>
    <div class="border border-[var(--line)] rounded-xl p-4 mb-5" style="background:var(--orange-l2)">
      <div class="grid grid-cols-2 gap-3">
        <div class="field"><label>Data</label><input type="date" id="fWikiData" value="${hojeStr}"></div>
        ${campoAutorHtml}
      </div>
      <div class="grid grid-cols-3 gap-3">
        <div class="field"><label>Sprint (opcional)</label><select id="fWikiSprint" onchange="atualizarHistoriaOptionsWiki()">${sprintOptionsWiki}</select></div>
        <div class="field"><label>História (opcional)</label><select id="fWikiHistoria" onchange="atualizarSubtarefaOptionsWiki()">${historiaOptionsWiki}</select></div>
        <div class="field"><label>Subtarefa (opcional)</label><select id="fWikiSubtarefa"><option value="">Não relacionado</option></select></div>
      </div>
      <p class="text-[10px] text-[var(--ink-faint)] -mt-2 mb-2">Relacione o comentário a uma sprint/história/subtarefa específica, se fizer sentido — totalmente opcional, e cada seleção filtra a próxima.</p>
      <div class="field"><label>Título</label><input type="text" id="fWikiTitulo" placeholder="Ex: Mudança de escopo, Decisão de arquitetura, Bug crítico..."></div>
      <div class="field">
        <label>Comentário</label>
        <div class="flex items-center gap-1 mb-1.5">
          <button type="button" onclick="aplicarFormatoWiki('negrito')" class="icon-btn" style="font-weight:800" title="Negrito">N</button>
          <button type="button" onclick="aplicarFormatoWiki('italico')" class="icon-btn" style="font-style:italic" title="Itálico">I</button>
          <button type="button" onclick="aplicarFormatoWiki('sublinhado')" class="icon-btn" style="text-decoration:underline" title="Sublinhado">S</button>
        </div>
        <textarea id="fWikiTexto" rows="4" placeholder="Escreva aqui a anotação, decisão, aprendizado ou qualquer informação que valha guardar sobre o projeto..."></textarea>
        <p class="text-[10px] text-[var(--ink-faint)] mt-1">Selecione um trecho e clique em N/I/S — ou digite direto: **negrito**, *itálico*, _sublinhado_.</p>
      </div>
      <button onclick="salvarWiki('${projetoId}')" class="bg-[var(--orange)] text-[var(--bg)] px-4 py-2 rounded-md text-xs font-bold mt-1">Salvar comentário</button>
    </div>
    <div class="field max-w-sm mb-3"><label>Buscar nos comentários</label><input type="text" id="fWikiBusca" value="${WIKI_BUSCA}" oninput="setWikiBusca(this.value)" placeholder="Buscar por texto, autor ou data..."></div>
    <h3 class="text-xs font-bold uppercase tracking-wide text-[var(--ink-dim)] mb-2">Histórico ${todosDoProjeto.length ? `<span class="text-[var(--ink-faint)] font-normal normal-case">(${itens.length} de ${todosDoProjeto.length})</span>` : ''}</h3>
    ${listaHtml}`;
}
function setWikiBusca(v){
  WIKI_BUSCA = v;
  renderProjetosArea();
  // o re-render recria o <input> do zero — sem isso, o foco volta pro campo
  // mas o cursor cai no início, e cada tecla nova aparece ANTES do que já
  // tinha sido digitado (texto de trás pra frente).
  const el = document.getElementById('fWikiBusca');
  if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}
function salvarWiki(projetoId){
  const data = document.getElementById('fWikiData').value;
  const autorEl = document.getElementById('fWikiAutor');
  const autorId = autorEl ? autorEl.value : '';
  const sprintEl = document.getElementById('fWikiSprint');
  const sprintValue = sprintEl ? sprintEl.value : '';
  const sprint_id = sprintValue && sprintValue !== 'backlog' ? sprintValue : null;
  const historia_id = document.getElementById('fWikiHistoria').value || null;
  const subtarefa_id = document.getElementById('fWikiSubtarefa').value || null;
  const titulo = document.getElementById('fWikiTitulo').value.trim();
  const texto = document.getElementById('fWikiTexto').value.trim();
  if(!data){ toast('Informe a data do comentário.', 'red'); return; }
  if(!autorId){ toast('Selecione quem está comentando.', 'red'); return; }
  if(!titulo){ toast('Informe um título pro comentário.', 'red'); return; }
  if(!texto){ toast('Escreva o comentário antes de salvar.', 'red'); return; }
  DB.wiki.push({
    id: genId('wiki'), projeto_id: projetoId, data, autor_id: autorId, titulo, texto,
    sprint_id, historia_id, subtarefa_id,
    criado_em: TURN_SLOTS[CURRENT_IDX] ? TURN_SLOTS[CURRENT_IDX].data.toISOString() : new Date().toISOString(),
  });
  toast('Comentário salvo na Wiki.', 'green');
  renderProjetosArea();
}
function excluirWiki(id){
  if(!confirm('Excluir este comentário da Wiki?')) return;
  DB.wiki = DB.wiki.filter(w=>w.id!==id);
  renderProjetosArea();
}

/* Infere a "área" de um comentário pelo cargo de quem escreveu — não existe
   campo de categoria na Wiki, então isso é o que permite o relatório agrupar
   por Negócio & Design / Backend / Frontend / QA sem pedir nada extra na hora
   de comentar. */
function categoriaAutorWiki(prof){
  const t = (prof && prof.tecnologia_principal || '').toLowerCase();
  if(t.includes('backend')) return 'Backend';
  if(t.includes('frontend')) return 'Frontend';
  if(t.includes('qa')) return 'QA';
  if(t.includes('produto') || t.includes('ux') || t.includes('design')) return 'Negócio & Design';
  return 'Outros';
}
const COR_CATEGORIA_WIKI = { 'Negócio & Design':'#C9471D', 'Backend':'#0F4984', 'Frontend':'#2F5D50', 'QA':'#68707A', 'Outros':'#3A414A' };

/* Relatório de Phase-out: pega TODOS os comentários da Wiki do projeto (não
   filtra pela busca ativa na tela) e monta um documento HTML autocontido,
   numa aba nova, pronto pra impressão/PDF — pensado pra ser apresentado a
   negócio/executivos, não pra navegação dentro do app. */
function gerarRelatorioPhaseOut(projetoId){
  const proj = getProjeto(projetoId);
  if(!proj){ toast('Selecione um projeto primeiro.', 'red'); return; }
  // wikiDoProjeto já devolve do mais recente pro mais antigo (mesma ordem da
  // Wiki); Início/Fim do período são calculados à parte, independente da
  // ordem de exibição.
  const itens = wikiDoProjeto(projetoId);
  if(!itens.length){ toast('Este projeto ainda não tem nenhum comentário na Wiki pra gerar relatório.', 'amber'); return; }

  const cliente = nomeCliente(proj.cliente_id);
  const dataInicio = fmtDataComAno(new Date(itens.reduce((min,w)=> w.data < min ? w.data : min, itens[0].data)+'T00:00:00'));
  const dataFim = fmtDataComAno(new Date(itens.reduce((max,w)=> w.data > max ? w.data : max, itens[0].data)+'T00:00:00'));
  const hojeFmt = fmtDataComAno(new Date());

  const timelineHtml = itens.map(w=>{
    const autor = getProf(w.autor_id);
    const cat = categoriaAutorWiki(autor);
    return `
    <div class="item">
      <div class="item-marker" style="background:${COR_CATEGORIA_WIKI[cat]||'#3A414A'}"></div>
      <div class="item-body">
        <div class="item-head">
          <span class="item-data">${fmtDataComAno(new Date(w.data+'T00:00:00'))}</span>
          <span class="item-tag" style="background:${COR_CATEGORIA_WIKI[cat]||'#3A414A'}22; color:${COR_CATEGORIA_WIKI[cat]||'#3A414A'}">${cat}</span>
          <span class="item-autor">${autor ? autor.nome : 'Alguém'}${autor && autor.tecnologia_principal ? ' · '+autor.tecnologia_principal : ''}</span>
        </div>
        ${w.titulo ? `<div class="item-titulo">${w.titulo}</div>` : ''}
        <div class="item-texto">${formatarTextoWiki(w.texto)}</div>
      </div>
    </div>`;
  }).join('');

  const html = `<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Relatório de Phase-out — ${proj.nome}</title>
<style>
  :root{ --graphite:#1F2329; --orange:#F05A28; --ink-dim:#555; --line:#E4E4E7; }
  *{ box-sizing:border-box; }
  body{ font-family:-apple-system,Segoe UI,Arial,sans-serif; color:var(--graphite); margin:0; background:#fff; }
  .mono{ font-family:'Courier New',monospace; }
  .toolbar{ position:sticky; top:0; background:#fff; border-bottom:1px solid var(--line); padding:12px 40px; display:flex; justify-content:flex-end; gap:8px; }
  .toolbar button{ background:var(--orange); color:#fff; border:none; padding:8px 16px; border-radius:6px; font-size:13px; font-weight:700; cursor:pointer; }
  .toolbar button.secondary{ background:#fff; color:var(--graphite); border:1px solid var(--line); }
  .doc{ max-width:820px; margin:0 auto; padding:40px; }
  .doc-header{ border-bottom:3px solid var(--graphite); padding-bottom:20px; margin-bottom:24px; }
  .doc-header .kicker{ font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:var(--orange); font-weight:800; margin-bottom:6px; }
  .doc-header h1{ font-size:26px; margin:0 0 6px; }
  .doc-header .sub{ font-size:13px; color:var(--ink-dim); }
  .meta-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin:24px 0 32px; }
  .meta-grid div{ border-left:3px solid var(--line); padding-left:10px; }
  .meta-grid .label{ font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:#888; font-weight:700; }
  .meta-grid .value{ font-size:14px; font-weight:700; margin-top:2px; }
  h2.section{ font-size:14px; text-transform:uppercase; letter-spacing:.5px; border-bottom:1px solid var(--line); padding-bottom:8px; margin:36px 0 16px; }
  .item{ display:flex; gap:12px; margin-bottom:18px; page-break-inside:avoid; }
  .item-marker{ width:8px; height:8px; border-radius:50%; margin-top:6px; flex-shrink:0; }
  .item-head{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:3px; }
  .item-data{ font-family:'Courier New',monospace; font-size:12px; font-weight:800; }
  .item-tag{ font-size:9px; font-weight:800; text-transform:uppercase; padding:2px 8px; border-radius:10px; }
  .item-autor{ font-size:11px; color:var(--ink-dim); }
  .item-titulo{ font-size:14px; font-weight:800; margin-bottom:3px; }
  .item-texto{ font-size:13px; line-height:1.55; }
  .doc-footer{ margin-top:48px; padding-top:16px; border-top:1px solid var(--line); font-size:11px; color:#999; }
  @media print{ .toolbar{ display:none; } .doc{ padding:0; max-width:none; } }
</style></head>
<body>
  <div class="toolbar">
    <button class="secondary" onclick="window.close()">Fechar</button>
    <button onclick="window.print()">Imprimir / Salvar PDF</button>
  </div>
  <div class="doc">
    <div class="doc-header">
      <div class="kicker">Relatório de Phase-out</div>
      <h1>${proj.nome}${cliente!=='—' ? ' — '+cliente : ''}</h1>
      <div class="sub">Consolidação de todo o histórico registrado na Wiki do projeto, para apresentação a áreas de negócio e executivos.</div>
    </div>
    <div class="meta-grid">
      <div><div class="label">Cliente</div><div class="value">${cliente}</div></div>
      <div><div class="label">Status</div><div class="value">${statusProjetoLabel(proj.status)}</div></div>
      <div><div class="label">Período coberto</div><div class="value">${dataInicio} → ${dataFim}</div></div>
      <div><div class="label">Registros no histórico</div><div class="value">${itens.length}</div></div>
    </div>

    <h2 class="section">Linha do tempo completa</h2>
    ${timelineHtml}

    <div class="doc-footer">Documento gerado automaticamente a partir da Wiki do projeto "${proj.nome}" em ${hojeFmt}. Fonte: LWP73 SetProject.</div>
  </div>
</body></html>`;

  const janela = window.open('', '_blank');
  if(!janela){ toast('O navegador bloqueou a abertura da aba do relatório — permita pop-ups pra este site.', 'red'); return; }
  janela.document.open();
  janela.document.write(html);
  janela.document.close();
}

/* Detalhe da fase: mostra plano original x atual, status, e o log completo
   de replanejamentos (pode ter mais de um). */

  const fase = getFase(faseId);

  const logHtml = fase.replanejamentos.length ? fase.replanejamentos.map(r=>`
    <div class="text-[11px] bg-[var(--panel-2)] rounded-lg px-3 py-2 mb-1.5">
      <span class="text-[var(--ink-faint)] mono">${fmtData(new Date(r.data_registro+'T00:00:00'))}</span> —
      ${fmtData(new Date(r.inicio_anterior+'T00:00:00'))}→${fmtData(new Date(r.fim_anterior+'T00:00:00'))}
      <span class="text-[var(--ink-faint)]">virou</span>
      ${fmtData(new Date(r.novo_inicio+'T00:00:00'))}→${fmtData(new Date(r.novo_fim+'T00:00:00'))}
      ${r.motivo ? `<div class="text-[var(--ink-dim)] mt-1">${r.motivo}</div>` : ''}
    </div>`).join('') : `<p class="text-[11px] text-[var(--ink-faint)] italic">Nenhum replanejamento ainda.</p>`;

    <div class="flex items-center justify-between mb-4">
      <h3 class="text-sm font-bold">${fase.nome}</h3>
      <button onclick="closeModal()" class="text-[var(--ink-faint)] hover:text-[var(--ink)] text-lg leading-none">✕</button>
    </div>
    <div class="flex items-center gap-3 mb-3">
      <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full" style="background:${statusFaseCor(fase.status)}"></span><span class="text-xs font-semibold">${statusFaseLabel(fase.status)}</span></span>
      <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded" style="background:${fase.cor || corPadraoFase(fase.projeto_id)}"></span><span class="text-[10px] text-[var(--ink-faint)] mono">cor da barra</span></span>
    </div>
    <div class="field"><label>Plano original</label><div class="text-xs mono py-1 text-[var(--ink-dim)]">${fmtData(new Date(fase.data_inicio_planejada+'T00:00:00'))} → ${fmtData(new Date(fase.data_fim_planejada+'T00:00:00'))}</div></div>
    <div class="field"><label>Data atual (vigente)</label><div class="text-xs mono py-1 font-bold" style="color:${fase.data_inicio_atual!==fase.data_inicio_planejada || fase.data_fim_atual!==fase.data_fim_planejada ? (fase.cor_atraso || COR_ATRASO_PADRAO) : 'var(--ink-dim)'}">${fmtData(new Date(fase.data_inicio_atual+'T00:00:00'))} → ${fmtData(new Date(fase.data_fim_atual+'T00:00:00'))}</div></div>
    <div class="field">
      <label>Histórico de replanejamentos (${fase.replanejamentos.length})</label>
      ${logHtml}
    </div>
    <div class="flex gap-2 mt-3">
      <button onclick="closeModal(); abrirFaseForm('${fase.projeto_id}','${fase.id}')" class="flex-1 border border-[var(--line)] rounded-lg py-2 text-xs font-bold">Editar nome/status</button>
      <button onclick="closeModal(); abrirReplanejamentoFase('${fase.id}')" class="flex-1 bg-[var(--orange)] text-[var(--bg)] rounded-lg py-2 text-xs font-bold">Replanejar datas</button>
    </div>
  `);
}

/* Replanejamento: define uma NOVA data início/fim vigente. O plano original
   nunca é alterado — cada replanejamento só adiciona uma entrada no log,
   preservando o histórico completo mesmo que aconteça várias vezes. */
function abrirReplanejamentoFase(faseId){
  if(!podeEditarStatusProjeto()){ toast('Você só pode visualizar o Status deste projeto.', 'red'); return; }
  const fase = getFase(faseId);
  if(!fase) return;
  openFormModal(`
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-sm font-bold">Replanejar — ${fase.nome}</h3>
      <button onclick="closeModal()" class="text-[var(--ink-faint)] hover:text-[var(--ink)] text-lg leading-none">✕</button>
    </div>
    <p class="text-[11px] text-[var(--ink-faint)] mb-3">Data vigente atual: <strong>${fmtData(new Date(fase.data_inicio_atual+'T00:00:00'))} → ${fmtData(new Date(fase.data_fim_atual+'T00:00:00'))}</strong> (plano original: ${fmtData(new Date(fase.data_inicio_planejada+'T00:00:00'))} → ${fmtData(new Date(fase.data_fim_planejada+'T00:00:00'))}). Isso fica registrado no histórico — pode replanejar quantas vezes precisar.</p>
    <div class="grid grid-cols-2 gap-3">
      <div class="field"><label>Nova data início</label><input type="date" id="fReplanFaseInicio" value="${fase.data_inicio_atual}"></div>
      <div class="field"><label>Nova data fim</label><input type="date" id="fReplanFaseFim" value="${fase.data_fim_atual}"></div>
    </div>
    <div class="field"><label>Motivo (opcional)</label><input type="text" id="fReplanFaseMotivo" placeholder="Ex: aguardando aprovação do cliente"></div>
    <button onclick="salvarReplanejamentoFase('${fase.id}')" class="w-full bg-[var(--orange)] text-[var(--bg)] rounded-lg py-2 text-sm font-bold mt-2">Confirmar replanejamento</button>
  `);
}

function salvarReplanejamentoFase(faseId){
  if(!podeEditarStatusProjeto()){ toast('Você só pode visualizar o Status deste projeto.', 'red'); return; }
  const fase = getFase(faseId);
  if(!fase) return;
  const novoInicio = document.getElementById('fReplanFaseInicio').value;
  const novoFim = document.getElementById('fReplanFaseFim').value;
  const motivo = document.getElementById('fReplanFaseMotivo').value.trim();
  if(!novoInicio || !novoFim){ toast('Informe as duas datas.', 'red'); return; }
  if(novoFim < novoInicio){ toast('A data fim não pode ser antes da data início.', 'red'); return; }
  if(novoInicio === fase.data_inicio_atual && novoFim === fase.data_fim_atual){ closeModal(); return; }
  fase.replanejamentos.push({
    data_registro: TURN_SLOTS[CURRENT_IDX] ? TURN_SLOTS[CURRENT_IDX].data.toISOString().slice(0,10) : new Date().toISOString().slice(0,10),
    inicio_anterior: fase.data_inicio_atual, fim_anterior: fase.data_fim_atual,
    novo_inicio: novoInicio, novo_fim: novoFim, motivo: motivo || null,
  });
  fase.data_inicio_atual = novoInicio;
  fase.data_fim_atual = novoFim;
  closeModal();
  renderProjetosArea();
}

/* =========================================================================
   RENDER — BACKLOG: todas as histórias/subtarefas organizadas por sprint,
   com uma seção separada pro backlog do produto (histórias sem sprint).
   Estilo board de backlog (tipo Jira) — pensado pra planning/refinamento.
   ========================================================================= */
function toggleBacklogHistoria(id){
  if(BACKLOG_AREA_EXPANDIDAS.has(id)) BACKLOG_AREA_EXPANDIDAS.delete(id);
  else BACKLOG_AREA_EXPANDIDAS.add(id);
  render();
}
function toggleBacklogSprint(sprintId){
  if(BACKLOG_SPRINTS_EXPANDIDAS.has(sprintId)) BACKLOG_SPRINTS_EXPANDIDAS.delete(sprintId);
  else BACKLOG_SPRINTS_EXPANDIDAS.add(sprintId);
  render();
}

function renderCardHistoriaBacklog(h){
  const subs = subtarefasDaHistoria(h.id);
  const statusV = statusVisualHistoria(h.id);
  const expanded = BACKLOG_AREA_EXPANDIDAS.has(h.id);
  const estimativaH = horasEstimadasHistoria(h.id);
  const realizadoH = horasApontadasHistoria(h.id);
  const inicioCalc = dataInicioHistoria(h.id);
  const fimCalc = dataFimHistoria(h.id);
  const periodoTxt = inicioCalc || fimCalc
    ? `${inicioCalc ? fmtData(new Date(inicioCalc+'T00:00:00')) : '?'} → ${fimCalc ? fmtData(new Date(fimCalc+'T00:00:00')) : '?'}`
    : '';
  // O detalhe de subtarefa (quando expandida) é sempre o mesmo componente
  // usado em qualquer lugar do app que precisa listar subtarefas de uma
  // história — não existe mais uma versão "resumida" separada só pro Backlog.
  return `<div class="border border-[var(--line)] rounded-lg mb-2 overflow-hidden">
    <div class="w-full flex items-center gap-2 px-3 py-2 hover:bg-[var(--panel-2)] flex-wrap">
      <button onclick="toggleBacklogHistoria('${h.id}')" class="flex items-center gap-2 flex-1 min-w-0 text-left">
        <span class="text-[var(--ink-faint)] text-xs shrink-0">${expanded?'▾':'▸'}</span>
        <span class="w-2 h-2 rounded-full shrink-0" style="background:${h.cor_hex}"></span>
        <span class="text-xs font-bold mono shrink-0" style="color:${h.cor_hex}">${h.id}</span>
        <span class="text-sm truncate">${h.titulo}</span>
      </button>
      ${periodoTxt ? `<span class="text-[10px] text-[var(--ink-faint)] mono shrink-0">${periodoTxt}</span>` : ''}
      <span class="text-[10px] text-[var(--ink-faint)] mono shrink-0">${subs.length} subtarefa${subs.length===1?'':'s'} · ${estimativaH}h${realizadoH ? ` <span style="color:${realizadoH > estimativaH ? 'var(--red)' : 'var(--ink-faint)'}">(${realizadoH}h feito)</span>` : ''}</span>
      <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${statusVisualCor(statusV)}" title="${statusVisualLabel(statusV)}"></span>
      ${podeGerenciarHistoriaSubtarefa() ? `
      ${!h.sprint_id ? `<button onclick="abrirMoverParaSprint('${h.id}')" class="text-[10px] font-bold px-2 py-1 rounded-md bg-[var(--orange)] text-[var(--bg)] shrink-0">📅 Planning →</button>` : ''}
      <button onclick="openHistoriaForm('${h.id}')" class="icon-btn shrink-0">Editar</button>
      <button onclick="excluirHistoria('${h.id}')" class="icon-btn danger shrink-0">Excluir</button>` : ''}
    </div>
    ${h.sprint_id && !subs.length && podeGerenciarHistoriaSubtarefa() ? `<div class="px-3 py-2 border-t border-[var(--line)] bg-[#FBF8E8] text-[11px] text-[var(--ink-dim)] flex items-center justify-between gap-2">
      <span>Já está na sprint, mas ainda sem subtarefas cadastradas.</span>
      <button onclick="openSubtarefaForm('${h.id}', null)" class="text-[10px] font-bold px-2 py-1 rounded-md bg-[var(--orange)] text-[var(--bg)] shrink-0">+ Cadastrar subtarefas</button>
    </div>` : ''}
    ${expanded ? `<div class="border-t border-[var(--line)]">${renderSubtarefasInline(h)}</div>` : ''}
  </div>`;
}

/* Planning: o momento real em que uma história elegível sai do backlog e
   entra numa sprint. Ao confirmar, já leva direto pro cadastro das
   subtarefas dessa história — é nesse momento que elas normalmente são
   detalhadas, não antes. */
function abrirMoverParaSprint(historiaId){
  if(!podeGerenciarHistoriaSubtarefa()){ toast('Você não tem permissão pra planejar histórias.', 'red'); return; }
  const hist = getHistoria(historiaId);
  if(!hist) return;
  const sprints = sprintsDoProjeto(hist.projeto_id);
  if(!sprints.length){ toast('Cadastre uma sprint para este projeto antes.', 'red'); return; }
  const emAndamento = sprints.find(s=>s.status==='em_andamento');
  const padrao = emAndamento ? emAndamento.id : sprints[0].id;
  const options = sprints.map(s=>`<option value="${s.id}" ${s.id===padrao?'selected':''}>${s.nome}${s.status==='em_andamento'?' — sprint atual':''}</option>`).join('');
  openFormModal(`
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-sm font-bold">Planning — ${hist.id}</h3>
      <button onclick="closeModal()" class="text-[var(--ink-faint)] hover:text-[var(--ink)] text-lg leading-none">✕</button>
    </div>
    <p class="text-[11px] text-[var(--ink-faint)] mb-3">"${hist.titulo}" sai do backlog e entra na sprint escolhida. Depois de confirmar, você já cai direto no cadastro das subtarefas dela.</p>
    <div class="field"><label>Sprint</label><select id="fMoverSprint">${options}</select></div>
    <button onclick="confirmarMoverParaSprint('${historiaId}')" class="w-full bg-[var(--orange)] text-[var(--bg)] rounded-lg py-2 text-sm font-bold mt-2">Mover e cadastrar subtarefas →</button>
  `);
}
function confirmarMoverParaSprint(historiaId){
  const hist = getHistoria(historiaId);
  if(!hist) return;
  const sprintId = document.getElementById('fMoverSprint').value;
  hist.sprint_id = sprintId;
  subtarefasDaHistoria(historiaId).forEach(s=>{ s.sprint_id = sprintId; });
  BACKLOG_AREA_EXPANDIDAS.add(historiaId);
  BACKLOG_SPRINTS_EXPANDIDAS.add(sprintId);
  recalcularCronograma();
  closeModal();
  openSubtarefaForm(historiaId, null);
}

/* Sprints do projeto — cada uma expande pra ver as histórias (que por sua
   vez expandem pra ver as subtarefas, via renderCardHistoriaBacklog). Antes
   isso vivia em 3 abas separadas (Sprints, Backlog, Histórias), cada uma
   repetindo pedaços do mesmo comportamento de expandir/recolher; agora é
   tudo aqui — a gestão da sprint em si (reordenar/editar/excluir) fica no
   cabeçalho de cada uma, e o Backlog do Produto (histórias sem sprint) fica
   junto, embaixo. */
function renderConteudoSprints(projetoId){
  if(!DB.projetos.length){
    return `<div class="text-sm text-[var(--ink-faint)] italic">Cadastre um projeto primeiro (aba Projetos).</div>`;
  }
  const sprintsDoProjeto_ = DB.sprints.filter(sp=> sp.projeto_id===projetoId);
  const sprintSections = sprintsDoProjeto_.map((sp,i)=>{
    const historiasDaSprint = DB.historias.filter(h=>h.sprint_id===sp.id);
    const ehAtual = sp.status === 'em_andamento';
    const sprintExpandida = BACKLOG_SPRINTS_EXPANDIDAS.has(sp.id);
    return `<div class="mb-4 ${ehAtual ? 'border-l-4 pl-3' : ''}" style="${ehAtual ? 'border-color:var(--blue-deep);' : ''}">
      <div class="flex items-center justify-between gap-2 px-1 mb-2 flex-wrap">
        <button onclick="toggleBacklogSprint('${sp.id}')" class="flex items-center gap-2 min-w-0 flex-1 text-left hover:opacity-75">
          <span class="text-[var(--ink-faint)] text-xs shrink-0">${sprintExpandida?'▾':'▸'}</span>
          <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:${statusSprintCor(sp.status)};" class="shrink-0"></span>
          <span class="text-sm font-bold truncate">${i+1}. ${sp.nome}</span>
          ${ehAtual ? `<span class="text-[9px] font-bold uppercase px-1.5 py-0.5 rounded shrink-0" style="background:var(--blue-deep); color:#fff;">Sprint atual</span>` : ''}
          <span class="text-[10px] text-[var(--ink-faint)] mono shrink-0">${statusSprintLabel(sp.status)} · ${sp.duracao_semanas} semana(s)</span>
        </button>
        <span class="text-[11px] text-[var(--ink-faint)] mono shrink-0">${historiasDaSprint.length} história${historiasDaSprint.length===1?'':'s'}</span>
        <div class="flex items-center gap-1 shrink-0">
          ${podeGerenciarSprint() ? `
          <button class="icon-btn" ${i===0?'disabled style="opacity:.3"':''} onclick="moverSprint('${sp.id}', -1)" title="Mover pra cima">↑</button>
          <button class="icon-btn" ${i===sprintsDoProjeto_.length-1?'disabled style="opacity:.3"':''} onclick="moverSprint('${sp.id}', 1)" title="Mover pra baixo">↓</button>
          <button class="icon-btn" onclick="openSprintForm('${sp.id}')">Editar</button>
          <button class="icon-btn danger" onclick="excluirSprint('${sp.id}')">Excluir</button>` : ''}
        </div>
      </div>
      ${sprintExpandida ? `
      ${sp.objetivo ? `<div class="text-[11px] text-[var(--ink-dim)] italic mb-2 px-1">🎯 ${sp.objetivo}</div>` : ''}
      ${historiasDaSprint.length ? historiasDaSprint.map(renderCardHistoriaBacklog).join('') : `<div class="text-[12px] text-[var(--ink-faint)] italic px-1 py-2">Nenhuma história planejada pra esta sprint ainda.</div>`}
      ` : ''}
    </div>`;
  }).join('');

  const historiasBacklog = DB.historias.filter(h=> !h.sprint_id && h.projeto_id===projetoId);
  const backlogSection = `<div class="mt-2">
    <div class="flex items-center justify-between gap-2 px-1 mb-2 pt-3 border-t-2 border-dashed border-[var(--line)]">
      <div class="flex items-center gap-2">
        <span class="text-sm font-bold">📋 Backlog do Produto</span>
        <span class="text-[10px] text-[var(--ink-faint)] mono">histórias não planejadas em nenhuma sprint</span>
      </div>
      <span class="text-[11px] text-[var(--ink-faint)] mono">${historiasBacklog.length} história${historiasBacklog.length===1?'':'s'}</span>
    </div>
    ${historiasBacklog.length ? historiasBacklog.map(renderCardHistoriaBacklog).join('') : `<div class="text-[12px] text-[var(--ink-faint)] italic px-1 py-2">Nada no backlog agora — tudo já está planejado em alguma sprint. 🎉</div>`}
  </div>`;

  return `
    <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
      <p class="text-[11px] text-[var(--ink-faint)] max-w-md">Cada sprint vem recolhida por padrão — clique no nome pra ver as histórias, e em cada história pra ver as subtarefas. O backlog do produto fica separado, embaixo.</p>
      <div class="flex items-center gap-2 shrink-0">
        ${podeGerenciarSprint() ? `<button onclick="openSprintForm(null, '${projetoId}')" class="bg-[var(--orange)] text-[var(--bg)] px-3 py-2 rounded-md text-xs font-bold">+ Nova sprint</button>` : ''}
        ${podeGerenciarHistoriaSubtarefa() ? `<button onclick="openHistoriaForm(null)" class="bg-[var(--orange)] text-[var(--bg)] px-3 py-2 rounded-md text-xs font-bold">+ Nova história</button>` : ''}
      </div>
    </div>
    ${sprintSections || `<div class="text-sm text-[var(--ink-faint)] italic py-4">Nenhuma sprint cadastrada pra este projeto ainda.</div>`}
    ${backlogSection}`;
}

document.addEventListener('click', (e)=>{
  if(e.target.id === 'modal') closeModal();
});

// boot
HISTORIA_COLOR_SEQ = DB.historias.length;
initFiltroSelects();
construirCalendario();
// "Hoje" no calendário simulado = a data real de hoje (17/07/2026), já que o
// calendário agora começa em 22/06 (data real da PP2 Sprint 1) em vez de uma
// data arbitrária. Isso faz a Grade mostrar o histórico real nos dias certos
// e o trabalho restante a partir de hoje — não tudo comprimido num só turno.
(function posicionarHoje(){
  const hoje = new Date('2026-07-17T00:00:00');
  const slot = TURN_SLOTS.find(s=> s.data.toDateString()===hoje.toDateString() && s.turno==='manha');
  CURRENT_IDX = slot ? slot.idx : 0;
})();
seedHistoricoReal();
recalcularCronograma();
render();
// Auto-login automático com as credenciais do Spagolla
setTimeout(() => {
  tentarLoginArea();
}, 300);
</script>
