<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LWP73 SetProject — Consultoria & Gestão de Projetos</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Paleta LWP73 Tech — Consultoria & Gestão de Projetos */
    --bg: #FFFFFF;
    --panel: #FFFFFF;
    --panel-2: #F5F6F7;      /* Mist */
    --line: rgba(29,62,74,.08);
    --ink: #1D3E4A;          /* Navy LWP73 */
    --ink-dim: #3A5564;      /* Navy 70% */
    --ink-faint: #6B7F8C;    /* Navy 50% */
    --graphite: #1D3E4A;
    --orange: #1AB856;       /* Verde LWP73 — acento principal (CTA/foco) */
    --orange-deep: #138842;
    /* Escala L2→L5 da apresentação institucional (fundo continua branco — a
       base grafite (L1) do material é só o "chão" visual do gráfico deles,
       não vira cor de fundo aqui). L4/L5 já batiam com --orange/--orange-deep
       (mantidos); L2/L3 são os tons claros novos, pra selo/destaque suave em
       vez do truque de opacidade (ex: var(--orange)22). */
    --orange-l2: #D4F1E0;
    --orange-l3: #A0E5C9;
    --orange-l4: var(--orange);
    --orange-l5: var(--orange-deep);
    --blue-deep: #1D3E4A;
    --blue-mid: #35679A;
    --blue-mist: #D4F1E0;
    --green-deep: #138842;
    --green-mid: #1AB856;
    --green-mist: #D4F1E0;
    --red: #B3261E;          /* crítico/atrasado — uso pontual, mesmo espírito do laranja */
    --amber: var(--orange-deep);
    --green: var(--green-deep);
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
    --display: 'Manrope', sans-serif;
  }
  *{box-sizing:border-box;}
  body{background:var(--bg); color:var(--ink); font-family:var(--sans);}
  .mono{font-family:var(--mono);}
  h1, .tab-btn, .icon-btn, button{ font-family: var(--display); }
  ::-webkit-scrollbar{height:10px; width:10px;}
  ::-webkit-scrollbar-track{background:var(--panel-2);}
  ::-webkit-scrollbar-thumb{background:#C7CBD1; border-radius:6px;}
  ::-webkit-scrollbar-thumb:hover{background:#AEB4BC;}

  .cell{ position:relative; border-radius:6px; overflow:hidden; cursor:default; transition: transform .15s ease, box-shadow .15s ease; }
  .cell.clickable{cursor:pointer;}
  .cell.clickable:hover{transform: translateY(-1px); box-shadow: 0 0 0 1px rgba(31,35,41,.25);}
  .cell.empty{background: repeating-linear-gradient(45deg, #FFFFFF, #FFFFFF 8px, #F5F6F7 8px, #F5F6F7 16px); border:1px solid var(--line);}
  .cell.planejado::after{content:''; position:absolute; inset:0; background: rgba(255,255,255,.55);}
  .cell.bloqueado{background-image: repeating-linear-gradient(135deg, rgba(31,35,41,.10) 0 6px, rgba(31,35,41,.03) 6px 12px);}
  .cell.bloqueado::before{content:'⛔'; position:absolute; top:2px; right:3px; font-size:9px; opacity:.7;}
  .cell.andamento{box-shadow: 0 0 0 2px var(--blue-deep) inset, 0 0 10px rgba(15,73,132,.20);}
  .cell.now-marker{box-shadow: 0 0 0 2px var(--orange) inset;}

  .tab-btn{ transition: all .15s ease; font-weight:700; }
  .tab-btn.active{ background:var(--orange); color:#fff; }
  .tab-btn:not(.active){ color:var(--ink-dim); }
  .tab-btn:not(.active):hover{ color:var(--ink); background:var(--panel-2); }

  .scrollbox{scrollbar-width: thin;}
  .modal-backdrop{ background: rgba(17,20,24,.45); backdrop-filter: blur(2px); }
  .toast{ animation: slideIn .25s ease-out; }
  @keyframes slideIn{ from{ transform: translateX(24px); opacity:0;} to{ transform:translateX(0); opacity:1;} }

  .field label{ display:block; font-size:10px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-faint); font-family:var(--mono); margin-bottom:4px; }
  .field input[type=text], .field input[type=number], .field input[type=date], .field select, .field input[type=color], .field textarea{
    width:100%; background:#fff; border:1px solid rgba(31,35,41,.16); border-radius:8px; padding:7px 9px;
    color:var(--ink); font-size:13px; font-family:var(--sans); outline:none; resize:vertical;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--blue-mid); }
  .field{ margin-bottom:12px; }
  .chip-check{ display:flex; align-items:center; gap:6px; font-size:12px; padding:4px 0; }

  .cad-table{ width:100%; border-collapse:collapse; font-size:12px; }
  .cad-table th{ text-align:left; padding:8px 10px; color:var(--ink-faint); font-family:var(--mono); font-size:10px; text-transform:uppercase; border-bottom:1px solid var(--line); }
  .cad-table td{ padding:8px 10px; border-bottom:1px solid var(--line); }
  .cad-table tr:hover td{ background:var(--panel-2); }
  .icon-btn{ padding:3px 8px; border-radius:6px; font-size:11px; font-weight:600; border:1px solid rgba(31,35,41,.16); color:var(--ink-dim); background:transparent; }
  .icon-btn:hover{ color:var(--ink); border-color:var(--ink-faint); background:var(--panel-2); }
  .icon-btn.danger:hover{ color:var(--red); border-color:var(--red); background:rgba(179,38,30,.06); }

  .leany-card{ border:1px solid rgba(31,35,41,.08); box-shadow: 0 12px 32px rgba(17,20,24,.06); border-radius:16px; }

  /* KANBAN — Minha Área. 5 colunas fixas (fluxo Aguardando → Desenvolvimento →
     Code Review → Em teste → Concluída), com scroll horizontal em telas
     estreitas e drag-and-drop nativo entre colunas. */
  .kanban-board{ display:flex; gap:12px; align-items:flex-start; overflow-x:auto; padding-bottom:6px; }
  .kanban-col{ flex:1 1 0; min-width:220px; background:var(--panel-2); border:1px solid var(--line); border-radius:14px; padding:10px; display:flex; flex-direction:column; max-height:calc(100vh - 340px); min-height:160px; }
  .kanban-col-header{ display:flex; align-items:center; justify-content:space-between; font-family:var(--mono); font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.02em; color:var(--ink-dim); padding:2px 4px 8px; }
  .kanban-col-count{ background:var(--line); color:var(--ink-dim); border-radius:10px; padding:1px 7px; font-size:10px; }
  .kanban-col-body{ display:flex; flex-direction:column; gap:8px; overflow-y:auto; flex:1; }
  .kanban-col.drag-over{ background:rgba(240,90,40,.08); border-color:var(--orange); }
  .kanban-empty{ font-size:11px; color:var(--ink-faint); font-style:italic; text-align:center; padding:14px 4px; }
  .kanban-card{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px; cursor:grab; box-shadow:0 2px 6px rgba(17,20,24,.05); }
  .kanban-card:hover{ border-color:var(--ink-faint); }
  .kanban-card:active{ cursor:grabbing; }
  .kanban-card.is-paused{ opacity:.7; border-style:dashed; }
  .kanban-nav-btn{ width:22px; height:22px; border-radius:6px; border:1px solid var(--line); background:transparent; color:var(--ink-dim); font-weight:700; line-height:1; }
  .kanban-nav-btn:hover:not(:disabled){ border-color:var(--ink-faint); color:var(--ink); background:var(--panel-2); }
  .kanban-nav-btn:disabled{ opacity:.3; cursor:default; }

  /* MODO APRESENTAÇÃO — só a Lego, tela cheia pra projetor. Some com
     todo o resto do "chrome" do app; a grade em si continua sendo renderizada
     pelas mesmas funções de sempre (respeita o filtro já aplicado). */
  body.modo-apresentacao header,
  body.modo-apresentacao #gradeToolbar,
  body.modo-apresentacao footer{ display:none !important; }
  .apresentacao-exit-hint{ display:none; }
  body.modo-apresentacao .apresentacao-exit-hint{
    display:flex; position:fixed; top:14px; right:16px; z-index:60;
    align-items:center; gap:8px; background:rgba(17,20,24,.85); color:#fff;
    font-family:var(--mono); font-size:11px; padding:6px 12px; border-radius:20px;
    cursor:pointer; box-shadow:0 4px 16px rgba(0,0,0,.25);
  }
  body.modo-apresentacao .apresentacao-exit-hint:hover{ background:rgba(17,20,24,.95); }
</style>
</head>
<body class="h-screen overflow-hidden">

<div id="app" class="h-screen flex flex-col overflow-hidden">

  <!-- HEADER -->
  <header class="border-b border-[var(--line)] bg-[var(--panel)] px-5 py-3 flex items-center justify-between gap-4 flex-wrap">
    <div class="flex items-center gap-4">
      <img src="LWP73_TECH.png" alt="NEXED.ect" style="height:70px; width:auto;">
      <span class="w-px h-16 bg-[var(--line)]"></span>
      <div>
        <h1 class="text-2xl font-bold tracking-tight leading-none">NEXED.ect</h1>
        <p class="text-[11px] text-[var(--ink-faint)] mono leading-none mt-1">Cronograma Inteligente</p>
      </div>
    </div>

    <div class="flex items-center gap-1">
      <button onclick="setTab('inicio')" id="tabBtnInicio" class="tab-btn active px-3 py-1.5 rounded-md text-xs font-semibold mono">INÍCIO</button>
      <!-- Só aparece depois de "Entrar" (USUARIO_ATUAL definido) — sem saber
           quem está usando, essas 5 telas não fazem sentido (a própria Minha
           Área/Início já pedem a identidade por dentro; isso só evita expor
           o botão antes da hora). Visibilidade controlada em render(). -->
      <div id="navPosLogin" class="hidden flex items-center gap-1">
        <span class="w-px h-4 bg-[var(--line)] mx-1.5"></span>
        <button onclick="setTab('grade')" id="tabBtnGrade" class="tab-btn px-3 py-1.5 rounded-md text-xs font-semibold mono">LEGO</button>
        <button onclick="abrirListaProjetos()" id="tabBtnProjetosArea" class="tab-btn px-3 py-1.5 rounded-md text-xs font-semibold mono">PROJETOS</button>
        <span class="w-px h-4 bg-[var(--line)] mx-1.5"></span>
        <button onclick="setTab('minhaarea')" id="tabBtnMinhaArea" class="tab-btn px-3 py-1.5 rounded-md text-xs font-semibold mono">MINHA ÁREA</button>
        <span class="w-px h-4 bg-[var(--line)] mx-1.5"></span>
        <button onclick="setTab('clientes')" id="tabBtnClientes" class="tab-btn px-3 py-1.5 rounded-md text-xs font-semibold mono">CLIENTES</button>
        <!-- Cadastro e Perfis são exclusivos de Administrador — visibilidade
             controlada em render() via podeAcessarCadastro()/podeAcessarPerfis(). -->
        <div id="navAdminOnly" class="hidden flex items-center gap-1">
          <button onclick="setTab('cadastro')" id="tabBtnCadastro" class="tab-btn px-3 py-1.5 rounded-md text-xs font-semibold mono">CADASTRO</button>
          <span class="w-px h-4 bg-[var(--line)] mx-1.5"></span>
          <button onclick="setTab('perfis')" id="tabBtnPerfis" class="tab-btn px-3 py-1.5 rounded-md text-xs font-semibold mono">PERFIS</button>
        </div>
      </div>
    </div>

  </header>

  <!-- TOOLBAR: método de visualização + filtros -->
  <div id="gradeToolbar" class="border-b border-[var(--line)] bg-[#F5F6F7] px-5 py-2 flex items-center gap-5 flex-wrap hidden">
    <div id="gradeOnlyControls" class="flex items-center gap-2">
      <span class="text-[13px] text-[var(--ink-faint)] hover:text-[var(--ink)] cursor-help select-none" title="Cada dia útil é dividido em 2 turnos de 4h: M = manhã, T = tarde. É assim que o trabalho de cada profissional é alocado dia a dia — passe o mouse em qualquer M ou T pra ver de novo.">ⓘ turno = M/T</span>
      <button onclick="ativarModoApresentacao()" class="icon-btn" title="Tela cheia pra projetor — mostra só a grade com o filtro atual. ESC pra sair.">🖥 Apresentar</button>
    </div>

    <div class="flex items-center gap-2">
      <span class="text-[10px] text-[var(--ink-faint)] mono uppercase">Filtrar projeto</span>
      <select id="projetoFilter" onchange="setProjectFilter(this.value)" class="bg-[var(--panel-2)] border border-[var(--line)] rounded-md text-xs font-medium px-2 py-1 text-[var(--ink-dim)] mono focus:outline-none focus:border-[var(--ink-faint)]"></select>
    </div>

    <div class="flex items-center gap-2">
      <span class="text-[10px] text-[var(--ink-faint)] mono uppercase">Filtrar sprint</span>
      <select id="sprintFilter" onchange="setSprintFilter(this.value)" class="bg-[var(--panel-2)] border border-[var(--line)] rounded-md text-xs font-medium px-2 py-1 text-[var(--ink-dim)] mono focus:outline-none focus:border-[var(--ink-faint)]"></select>
    </div>

    <div id="projetoLegend" class="flex items-center gap-3 flex-wrap"></div>

    <span class="ml-auto text-[10px] text-[var(--ink-faint)] mono" id="sprintSummary"></span>
  </div>

  <!-- ALERT LOG STRIP -->
  <div id="alertStrip" class="hidden border-b border-[var(--line)] bg-[#F5F6F7] px-5 py-2 text-xs mono flex items-center gap-2 overflow-x-auto"></div>

  <!-- MAIN -->
  <main class="flex-1 overflow-hidden relative">
    <section id="viewGrade" class="h-full hidden flex-col"></section>
    <section id="viewClientes" class="h-full hidden flex-col overflow-auto"></section>
    <section id="viewCadastro" class="h-full hidden flex-col overflow-auto"></section>
    <section id="viewMinhaArea" class="h-full hidden flex-col overflow-auto"></section>
    <section id="viewInicio" class="h-full flex flex-col overflow-auto"></section>
    <section id="viewProjetosArea" class="h-full hidden flex-col overflow-auto"></section>
    <section id="viewPerfis" class="h-full hidden flex-col overflow-auto"></section>
  </main>


</div>

<!-- MODO APRESENTAÇÃO: dica/botão de saída, só visível com body.modo-apresentacao -->
<div class="apresentacao-exit-hint" onclick="sairModoApresentacao()">
  <span>ESC pra sair</span>
  <span>✕</span>
</div>

<!-- MODAL -->
<div id="modal" class="hidden fixed inset-0 modal-backdrop z-50 flex items-center justify-center p-4">
  <div id="modalPanel" class="leany-card bg-[var(--panel)] w-full max-w-sm p-5 max-h-[85vh] overflow-auto">
    <div id="modalBody"></div>
  </div>
</div>

<script>
/* =========================================================================
   PASSO 1 — DATA SCHEMA (simulação de banco de dados em memória)

   Hierarquia: Projeto -> (equipe de Profissionais) e -> Histórias -> Subtarefas.
   A Subtarefa é a unidade atômica agendável pelo motor (o que a Grade aloca
   turno a turno). A História é um agrupador: sua duração é sempre a soma das
   estimativas das subtarefas, e seu status é derivado do status delas.
   ========================================================================= */
const DB = {
  profissionais: [],
  clientes: [],   // {id, nome, contato}
  projetos: [],   // {id, nome, cliente_id, equipe:[{profissional_id, perfil}]}
  sprints: [],
  historias: [],  // agrupador: {id, titulo, projeto_id, sprint_id}
  subtarefas: [], // unidade agendável: {id, historia_id, titulo, cor_hex, estimativa_turnos,
                  //  tipo, responsavel_id, depende_de_ids, ordem_fila, status,
                  //  projeto_id, sprint_id, inicio_turnoIdx, fim_turnoIdx}
  grade: [],      // {turnoIdx, data, turno, profissional_id, tarefa_id (=subtarefa.id), status_turno}
  feriados: [],   // {id, data:'YYYY-MM-DD', nome}
  reports3p: [],  // report 3Ps por projeto: {id, projeto_id, data, progressos, problemas, planejamento, criado_em}
  wiki: []        // comentários da Wiki do projeto: {id, projeto_id, data, autor_id, texto, criado_em}
};

let ID_COUNTER = 1000;
function genId(prefix){ return prefix + (ID_COUNTER++); }

const TURNOS_POR_DIA = ['manha','tarde'];
let SPRINT_START = new Date('2026-06-22T00:00:00'); // segunda-feira — início real da PP2 Sprint 1 no Jira

function gerarDiasUteis(inicio, qtd){
  const dias = [];
  let d = new Date(inicio);
  while(dias.length < qtd){
    const dow = d.getDay();
    if(dow !== 0 && dow !== 6){ dias.push(new Date(d)); }
    d.setDate(d.getDate()+1);
  }
  return dias;
}

let DIAS = [];
let TURN_SLOTS = [];
// sprintId -> lista de dias úteis (Date) que pertencem a essa sprint no
// calendário. Sprints com Data início (real) cadastrada geram seus próprios
// dias a partir dela (usando Data fim se tiver, senão a Duração como
// fallback); sprints sem data real continuam no modelo sequencial de sempre,
// encadeadas a partir de SPRINT_START — isso preserva o comportamento
// existente pra quem não tem data real informada (ex: PP2), enquanto deixa
// qualquer sprint "ancorar" no board real dela (ex: SAN). Os dois conjuntos
// de dias úteis são unidos (sem duplicar data) pra formar DIAS/TURN_SLOTS —
// dá pra ter sprints de projetos diferentes com datas sobrepostas, já que
// elas rodam em paralelo na vida real.
let SPRINT_DIAS = new Map();

function construirCalendario(){
  SPRINT_DIAS = new Map();
  const datasSet = new Set();
  const todasAsDatas = [];
  function registrar(sp, dias){
    SPRINT_DIAS.set(sp.id, dias);
    dias.forEach(dia=>{
      const chave = dia.toDateString();
      if(!datasSet.has(chave)){ datasSet.add(chave); todasAsDatas.push(dia); }
    });
  }

  DB.sprints.filter(sp=> sp.data_inicio_real).forEach(sp=>{
    const inicio = new Date(sp.data_inicio_real+'T00:00:00');
    let dias;
    if(sp.data_fim_real){
      const fim = new Date(sp.data_fim_real+'T00:00:00');
      dias = [];
      let d = new Date(inicio);
      while(d <= fim){
        const dow = d.getDay();
        if(dow !== 0 && dow !== 6) dias.push(new Date(d));
        d.setDate(d.getDate()+1);
      }
    } else {
      dias = gerarDiasUteis(inicio, sp.duracao_semanas * 5);
    }
    registrar(sp, dias);
  });

  let cursor = new Date(SPRINT_START);
  DB.sprints.filter(sp=> !sp.data_inicio_real).forEach(sp=>{
    const dias = gerarDiasUteis(cursor, sp.duracao_semanas * 5);
    registrar(sp, dias);
    if(dias.length){ cursor = new Date(dias[dias.length-1]); cursor.setDate(cursor.getDate()+1); }
  });

  todasAsDatas.sort((a,b)=> a - b);
  DIAS = todasAsDatas;
  TURN_SLOTS = [];
  DIAS.forEach(dia=> TURNOS_POR_DIA.forEach(t=> TURN_SLOTS.push({ idx: TURN_SLOTS.length, data:new Date(dia), turno:t })));
}

/* Sprint "dona" de uma data. Se projetoId for informado, só considera as
   sprints daquele projeto (evita ambiguidade quando duas sprints de projetos
   diferentes caem na mesma data real); sem projetoId, cai no filtro de
   projeto já ativo na tela (PROJECT_FILTER), se houver algum. */
function sprintIdForDate(date, projetoId){
  const pid = projetoId || (typeof PROJECT_FILTER !== 'undefined' && PROJECT_FILTER !== 'all' ? PROJECT_FILTER : null);
  const chave = date.toDateString();
  for(const [sid, dias] of SPRINT_DIAS){
    if(pid){
      const sp = getSprint(sid);
      if(!sp || sp.projeto_id !== pid) continue;
    }
    if(dias.some(d=> d.toDateString() === chave)) return sid;
  }
  return null;
}

/* Datas em que alguma subtarefa de uma das sprints em idsSprintSet foi REALMENTE
   alocada em DB.grade — independe do "bloco nominal" que o calendário
   sequencial deu pra sprint (que é só decorativo: o motor agenda a partir de
   CURRENT_IDX pra frente, sem respeitar bloco de sprint nenhum). Sem isso, um
   filtro por sprint podia esconder trabalho que já está de fato agendado. */
function diasComAlocacaoReal(idsSprintSet){
  const datas = new Set();
  DB.grade.forEach(g=>{
    if(!g.tarefa_id) return;
    const sub = getSubtarefa(g.tarefa_id);
    if(sub && sub.sprint_id && idsSprintSet.has(sub.sprint_id)) datas.add(g.data.toDateString());
  });
  return DIAS.filter(d=> datas.has(d.toDateString()));
}
function uniaoDiasOrdenada(...listas){
  const vistos = new Set();
  const combinado = [];
  listas.forEach(lista=> lista.forEach(d=>{
    const k = d.toDateString();
    if(vistos.has(k)) return;
    vistos.add(k);
    combinado.push(d);
  }));
  return combinado.sort((a,b)=> a - b);
}

function diasVisiveis(){
  if(SPRINT_FILTER !== 'all'){
    const nominal = SPRINT_DIAS.get(SPRINT_FILTER) || [];
    return uniaoDiasOrdenada(nominal, diasComAlocacaoReal(new Set([SPRINT_FILTER])));
  }
  if(PROJECT_FILTER !== 'all'){
    const idsDoProjeto = new Set(sprintsDoProjeto(PROJECT_FILTER).map(s=> s.id));
    const nominal = [];
    idsDoProjeto.forEach(sid=> nominal.push(...(SPRINT_DIAS.get(sid) || [])));
    return uniaoDiasOrdenada(nominal, diasComAlocacaoReal(idsDoProjeto));
  }
  return DIAS;
}

function fmtData(d){ return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'}); }
function fmtDataComAno(d){ return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit', year:'numeric'}); }
function fmtDiaSemana(d){ return d.toLocaleDateString('pt-BR', {weekday:'short'}).replace('.','').toUpperCase(); }

/* Data local (sem conversão de fuso, diferente de toISOString) no formato
   YYYY-MM-DD — mesmo formato que os inputs type=date devolvem. Usada pra
   comparar um objeto Date do calendário com as datas cadastradas em
   DB.feriados. */
function isoLocal(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
/* Feriado cadastrado nessa data (aceita Date ou string YYYY-MM-DD), ou
   undefined se o dia é útil normal. Um feriado continua aparecendo como
   coluna na Lego (diferente de fim de semana, que nem entra no
   calendário) — só fica marcado em cinza e o motor não aloca ninguém nele. */
function getFeriado(dataOuStr){
  const iso = typeof dataOuStr === 'string' ? dataOuStr : isoLocal(dataOuStr);
  return DB.feriados.find(f=> f.data === iso);
}

/* "Hoje" pra fins de exibição (bandeirinha/marcador na Grade) é sempre a
   data real do sistema (sysdate) — independente do CURRENT_IDX, que é só o
   ponteiro da simulação de avanço de turno e não necessariamente bate com o
   dia real de hoje. */
function isHojeReal(dia){
  const hoje = new Date();
  return dia.getFullYear() === hoje.getFullYear() && dia.getMonth() === hoje.getMonth() && dia.getDate() === hoje.getDate();
}

/* Anda N turnos (manhã/tarde, pulando fim de semana) a partir de uma data +
   período de início, e devolve a data (YYYY-MM-DD) onde cai o turno final.
   Usada tanto pra calcular a Data fim planejada de uma subtarefa quanto pra
   avaliar a trava de sprint respeitando o período exato (M ou T). */
function avancarTurnosDeData(dataInicioStr, turnoInicio, qtdTurnos){
  let d = new Date(dataInicioStr + 'T00:00:00');
  while(d.getDay()===0 || d.getDay()===6) d.setDate(d.getDate()+1); // começa num dia útil
  let turno = turnoInicio === 'tarde' ? 'tarde' : 'manha';
  let restantes = Math.max(1, qtdTurnos) - 1;
  while(restantes > 0){
    if(turno === 'manha'){
      turno = 'tarde';
    } else {
      turno = 'manha';
      do { d.setDate(d.getDate()+1); } while(d.getDay()===0 || d.getDay()===6);
    }
    restantes--;
  }
  return isoLocal(d);
}

/* Data fim planejada calculada a partir do início + estimativa (turnos "de
   trabalho puro") + % de alocação do responsável NESSE projeto. Um
   profissional 50% alocado só dedica ~1 turno de cada 2 a esse projeto, então
   uma estimativa de 2 turnos leva o dobro do tempo de calendário pra
   terminar. 100% de alocação = sem diferença (1 turno de trabalho = 1 turno
   de calendário). */
function calcularFimComAlocacao(dataInicioStr, turnoInicio, estimativaTurnos, alocacaoPct){
  if(!dataInicioStr || !estimativaTurnos) return null;
  const pct = alocacaoPct > 0 ? alocacaoPct : 100;
  const turnosDeCalendario = Math.ceil(estimativaTurnos * 100 / pct);
  return avancarTurnosDeData(dataInicioStr, turnoInicio, turnosDeCalendario);
}

function getSubtarefa(id){ return DB.subtarefas.find(s=>s.id===id); }

/* Cor de uma subtarefa = SEMPRE a cor da história-mãe (cada história tem uma
   cor própria e única no timeline; as subtarefas dela herdam essa cor). */
function corDaSubtarefa(sub){
  if(!sub) return '#CCCCCC';
  const hist = getHistoria(sub.historia_id);
  return hist && hist.cor_hex ? hist.cor_hex : '#CCCCCC';
}

/* Gera cores únicas e pastéis para histórias usando distribuição por ângulo
   dourado (137.508°) — garante boa separação visual e nunca repete, mesmo
   conforme novas histórias vão sendo cadastradas. */
function hslToHex(h, s, l){
  s/=100; l/=100;
  const k = n => (n + h/30) % 12;
  const a = s * Math.min(l, 1-l);
  const f = n => l - a*Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n), 1)));
  const toHex = x => Math.round(255*x).toString(16).padStart(2,'0');
  return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
}
let HISTORIA_COLOR_SEQ = 0; // avança a cada história nova criada
function gerarCorHistoria(){
  const hue = (HISTORIA_COLOR_SEQ * 137.508) % 360;
  HISTORIA_COLOR_SEQ++;
  return hslToHex(hue, 50, 78);
}

/* Verifica se uma subtarefa está atrasada (mesma lógica usada no Daily View),
   independente do filtro de projeto/sprint ativo na UI. */
function subtarefaAtrasada(sub){
  if(!sub || sub.status === 'concluida') return false;
  const consumidos = turnosConsumidos(sub.id);
  const overshoot = consumidos - sub.estimativa_turnos;
  const temBloqueioPassado = DB.grade.some(g=> g.tarefa_id===sub.id && g.turnoIdx < CURRENT_IDX && g.status_turno==='Bloqueado');
  return overshoot > 0 || temBloqueioPassado;
}

/* Turnos que uma subtarefa COM data_inicio_planejada cadastrada deveria
   ocupar segundo o PLANO — calculado de forma pura a partir dela mesma
   (início + turno de início + estimativa), pulando fim de semana e feriado
   igual ao motor dinâmico ao consumir turnos, mas sem depender da fila de
   outros profissionais nem do progresso real. Essa posição nunca se move —
   é o que fixa o card da Grade Geral no dia planejado mesmo quando a
   subtarefa é pausada/atrasa (ver GRADE_PLANO_POR_CELULA). Subtarefa sem
   data cadastrada retorna vazio — continua 100% posicionada pelo motor
   dinâmico (DB.grade), como sempre foi. */
function turnosDoPlano(sub){
  if(!sub || !sub.data_inicio_planejada || typeof TURN_SLOTS === 'undefined') return [];
  const turnoIni = sub.turno_inicio_planejado === 'tarde' ? 'tarde' : 'manha';
  let idx = TURN_SLOTS.findIndex(s => isoLocal(s.data) === sub.data_inicio_planejada && s.turno === turnoIni);
  if(idx === -1) return [];
  const slots = [];
  let restantes = Math.max(1, sub.estimativa_turnos || 1);
  while(restantes > 0 && idx < TURN_SLOTS.length){
    const slot = TURN_SLOTS[idx];
    if(!getFeriado(slot.data)){ slots.push({ idx, data: slot.data, turno: slot.turno }); restantes--; }
    idx++;
  }
  return slots;
}

/* Compara o fim do PLANO fixo de uma subtarefa contra o progresso real, pra
   decidir o badge de atraso da Grade Geral (modo "plano fixo"). Cobre os 3
   casos que importam: pausada agora, ainda aberta e já passou do fim
   planejado, ou concluída depois do fim planejado. Retorna null quando está
   dentro do prazo (ou sem data cadastrada — nada a comparar). */
function atrasoSubtarefaPlanejada(sub){
  const plano = turnosDoPlano(sub);
  if(!plano.length) return null;
  const fimPlano = plano[plano.length - 1];
  if(sub.pausada) return { motivo:'pausada', diasAtraso:null };
  if(sub.status === 'concluida'){
    if(!sub.data_termino_real) return null;
    const diasAtraso = diffDias(isoLocal(fimPlano.data), sub.data_termino_real);
    return diasAtraso > 0 ? { motivo:'concluida_atrasada', diasAtraso } : null;
  }
  const hojeSlot = TURN_SLOTS[CURRENT_IDX];
  if(hojeSlot && hojeSlot.data > fimPlano.data){
    return { motivo:'em_aberto_atrasada', diasAtraso: diffDias(isoLocal(fimPlano.data), isoLocal(hojeSlot.data)) };
  }
  return null;
}

/* Datas de início/fim planejadas de uma história são calculadas a partir das
   subtarefas (não cadastradas diretamente na história): início = a menor
   data de início planejada entre as subtarefas; fim = a maior data de fim
   planejada entre elas. Histórias sem nenhuma subtarefa com data cadastrada
   caem no fallback do fim da sprint (comportamento anterior, mantido para
   compatibilidade). */
function fimDaSprint(sprintId){
  const dias = SPRINT_DIAS.get(sprintId);
  return dias && dias.length ? dias[dias.length-1] : null;
}
function inicioDaSprint(sprintId){
  const dias = SPRINT_DIAS.get(sprintId);
  return dias && dias.length ? dias[0] : null;
}
/* "dd/mm–dd/mm" pro cabeçalho/filtro da Lego — em frente ao nome da
   sprint, pra dar o período sem precisar abrir o cadastro dela. */
function periodoSprintTxt(sprintId){
  const ini = inicioDaSprint(sprintId);
  const fim = fimDaSprint(sprintId);
  if(!ini || !fim) return '';
  return `${fmtData(ini)}–${fmtData(fim)}`;
}
function dataInicioHistoria(historiaId){
  const subs = subtarefasDaHistoria(historiaId).filter(s=> s.data_inicio_planejada);
  if(!subs.length) return null;
  return subs.reduce((min,s)=> !min || s.data_inicio_planejada < min ? s.data_inicio_planejada : min, null);
}
function dataFimHistoria(historiaId){
  const subs = subtarefasDaHistoria(historiaId).filter(s=> s.data_fim_planejada);
  if(!subs.length) return null;
  return subs.reduce((max,s)=> !max || s.data_fim_planejada > max ? s.data_fim_planejada : max, null);
}
/* Data fim ORIGINAL da história — a primeira data prometida, antes de qualquer
   replanejamento. Usa data_fim_original quando existe (subtarefa já foi
   adiada ao menos uma vez), senão cai na data_fim_planejada atual mesmo
   (nunca foi adiada). Serve pra manter visível que algo atrasou mesmo depois
   da data ter sido empurrada pra frente. */
function dataFimOriginalHistoria(historiaId){
  const subs = subtarefasDaHistoria(historiaId).filter(s=> s.data_fim_original || s.data_fim_planejada);
  if(!subs.length) return null;
  return subs.reduce((max,s)=>{
    const v = s.data_fim_original || s.data_fim_planejada;
    return !max || v > max ? v : max;
  }, null);
}
function dataLimiteHistoria(historiaId){
  const h = getHistoria(historiaId);
  if(!h) return null;
  const fimSubs = dataFimHistoria(historiaId);
  if(fimSubs) return new Date(fimSubs+'T00:00:00');
  if(h.data_limite) return new Date(h.data_limite+'T00:00:00'); // compatibilidade com histórias antigas
  return fimDaSprint(h.sprint_id); // fallback final, quando nenhuma subtarefa tem data cadastrada
}

/* Status visual da história para o círculo de indicação:
   'atrasada' (vermelho) tem prioridade sobre os demais — dispara quando a
   história não está concluída e hoje já alcançou (ou passou) a data fim
   planejada (calculada a partir das subtarefas), ou quando alguma subtarefa
   individualmente estourou o prazo/ficou bloqueada.
   Senão usa o status derivado normal (concluida/em_desenvolvimento/aguardando). */
function statusVisualHistoria(historiaId){
  const status = statusHistoria(historiaId);
  if(status !== 'concluida'){
    const limite = dataLimiteHistoria(historiaId);
    const hojeSlot = TURN_SLOTS[CURRENT_IDX];
    if(limite && hojeSlot && hojeSlot.data >= limite) return 'atrasada';
  }
  const subs = subtarefasDaHistoria(historiaId);
  // subtarefaAtrasada cobre quem não tem data planejada fixa (estourou turno
  // enquanto ainda ativa); atrasoSubtarefaPlanejada cobre quem TEM data fixa
  // e diverge do plano — pausada, concluída depois do previsto, ou ainda
  // aberta e já passou do prazo. Sem os dois juntos, uma história inteira
  // concluída com atraso (ex: pausa que empurrou o fim) some do radar aqui
  // mesmo aparecendo com o badge de atraso no quadro LEGO — os dois lugares
  // têm que concordar.
  if(subs.some(s=> subtarefaAtrasada(s) || !!atrasoSubtarefaPlanejada(s))) return 'atrasada';
  return status;
}
function statusVisualCor(v){
  if(v === 'atrasada') return 'var(--red)';
  if(v === 'concluida') return 'var(--green)';
  if(v === 'em_desenvolvimento') return 'var(--blue-deep)';
  return 'var(--ink-dim)'; // planejada/aguardando — cinza escuro
}
function statusVisualLabel(v){
  if(v === 'atrasada') return 'Atrasada';
  if(v === 'concluida') return 'Concluída';
  if(v === 'em_desenvolvimento') return 'Em andamento';
  return 'Planejada';
}

/* Resumo de histórias de um projeto pros 4 baldes do dashboard pessoal
   (Início): Concluída / Atrasada / Planejada (numa sprint) / Sem plano ainda
   (backlog, nenhuma sprint). Cada história cai em exatamente um balde —
   status visual manda pras duas primeiras; só quando não é nenhuma das duas
   é que ter sprint (ou não) decide entre as outras duas. */
function resumoHistoriasProjeto(projetoId){
  const historias = DB.historias.filter(h=> h.projeto_id===projetoId);
  const resumo = { concluidas:0, atrasadas:0, planejadas:0, semPlano:0, total: historias.length };
  historias.forEach(h=>{
    const v = statusVisualHistoria(h.id);
    if(v === 'concluida') resumo.concluidas++;
    else if(v === 'atrasada') resumo.atrasadas++;
    else if(h.sprint_id) resumo.planejadas++;
    else resumo.semPlano++;
  });
  return resumo;
}

/* % do prazo já decorrido de uma subtarefa em andamento (hoje real vs a
   janela Data início → Data fim planejada) — dá noção de urgência sem
   precisar abrir a subtarefa. null quando falta alguma das duas datas. */
function calcPercentualDecorrido(sub){
  if(!sub.data_inicio_planejada || !sub.data_fim_planejada) return null;
  const ini = new Date(sub.data_inicio_planejada+'T00:00:00');
  const fim = new Date(sub.data_fim_planejada+'T00:00:00');
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const totalMs = fim - ini;
  if(totalMs <= 0) return hoje >= fim ? 100 : 0;
  const pct = Math.round(((hoje - ini) / totalMs) * 100);
  return Math.max(0, Math.min(100, pct));
}

/* Wiki do projeto: comentários livres, mais recente primeiro. A busca (texto,
   nome do autor ou data) filtra a lista sem esconder o form de novo comentário. */
function wikiDoProjeto(projetoId){
  return DB.wiki.filter(w=>w.projeto_id===projetoId).sort((a,b)=> b.data.localeCompare(a.data) || b.criado_em.localeCompare(a.criado_em));
}
/* Formatação leve no comentário da Wiki: guarda como texto puro com marcadores
   estilo markdown (**negrito**, *itálico*, _sublinhado_) — nada de HTML no
   dado, então continua simples de buscar/exportar. Só na hora de exibir (lista
   e relatório de phase-out) que vira <strong>/<em>/<u>, sempre escapando o
   texto primeiro pra nenhum "<" ou "&" digitado vazar como HTML de verdade. */
function escapeHtmlWiki(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function formatarTextoWiki(texto){
  let s = escapeHtmlWiki(texto);
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
  s = s.replace(/_(.+?)_/g, '<u>$1</u>');
  return s;
}
/* Aplica o marcador no trecho selecionado da textarea (ou insere um
   placeholder "texto" se nada estiver selecionado) e devolve o foco/seleção
   pro usuário poder seguir digitando ou trocar o placeholder. */
function aplicarFormatoWiki(tipo){
  const el = document.getElementById('fWikiTexto');
  if(!el) return;
  const marcadores = { negrito:'**', italico:'*', sublinhado:'_' };
  const m = marcadores[tipo];
  if(!m) return;
  const ini = el.selectionStart, fim = el.selectionEnd;
  const selecionado = el.value.slice(ini, fim) || 'texto';
  el.value = el.value.slice(0, ini) + m + selecionado + m + el.value.slice(fim);
  el.focus();
  el.setSelectionRange(ini + m.length, ini + m.length + selecionado.length);
}
/* Cascata Sprint → História → Subtarefa do form de novo comentário da Wiki —
   mesmo espírito das cascatas já usadas no form de subtarefa "solta". */
function historiasParaWiki(projetoId, sprintValue){
  const todas = DB.historias.filter(h=>h.projeto_id===projetoId);
  if(sprintValue === 'backlog') return todas.filter(h=>!h.sprint_id);
  if(sprintValue) return todas.filter(h=>h.sprint_id===sprintValue);
  return todas;
}
function atualizarHistoriaOptionsWiki(){

  const histSel = document.getElementById('fWikiHistoria');
  if(!sprintEl || !histSel) return;
  const historias = historiasParaWiki(PROJETOS_AREA_PROJETO, sprintEl.value);
  histSel.innerHTML = `<option value="">Não relacionado</option>` + historias.map(h=>`<option value="${h.id}">${h.id} — ${h.titulo}</option>`).join('');
  atualizarSubtarefaOptionsWiki();
}
function atualizarSubtarefaOptionsWiki(){
  const histSel = document.getElementById('fWikiHistoria');
  const subSel = document.getElementById('fWikiSubtarefa');
  if(!histSel || !subSel) return;
  const subs = histSel.value ? subtarefasDaHistoria(histSel.value) : [];
  subSel.innerHTML = `<option value="">Não relacionado</option>` + subs.map(s=>`<option value="${s.id}">${s.id} — ${s.titulo}</option>`).join('');
}

   pessoal da tela Início e nos filtros da Minha Área. */
function projetosDoProfissional(profId){
  return DB.projetos.filter(pj => pj.equipe.some(m=>m.profissional_id===profId));
}
function nomeSprint(id){ if(!id) return 'Backlog'; const s=getSprint(id); return s ? s.nome : '—'; }
/* Nome da sprint sem repetir o nome/sigla do projeto (ex: "PP2 Sprint 1" →
   "Sprint 1") — usado em tabelas que já têm uma coluna "Projeto" separada,
   pra não duplicar a informação. */
function nomeSprintCurto(id){
  if(!id) return 'Backlog';
  const s = getSprint(id);
  if(!s) return '—';
  const proj = getProjeto(s.projeto_id);
  if(proj){
    const prefixos = [proj.sigla, proj.nome].filter(Boolean);
    for(const pfx of prefixos){
      if(pfx && s.nome.startsWith(pfx + ' ')) return s.nome.slice(pfx.length + 1);
    }
  }
  return s.nome;
}

function historiasDoProjeto(projetoId){ return DB.historias.filter(h=>h.projeto_id===projetoId); }
function subtarefasDoProjeto(projetoId){ return DB.subtarefas.filter(s=>s.projeto_id===projetoId); }

function estimativaProjeto(projetoId){
  return subtarefasDoProjeto(projetoId).reduce((acc,s)=> acc + s.estimativa_turnos, 0);
}

/* Status do projeto = derivado do status de todas as suas histórias, mesma
   lógica de agregação usada em statusHistoria (aguardando/em_desenvolvimento/concluida). */
function statusProjeto(projetoId){
  const historias = historiasDoProjeto(projetoId);
  if(!historias.length) return 'aguardando';
  const statuses = historias.map(h=> statusHistoria(h.id));
  if(statuses.every(s=> s === 'concluida')) return 'concluida';
  if(statuses.some(s=> s === 'em_desenvolvimento' || s === 'concluida')) return 'em_desenvolvimento';
  return 'aguardando';
}

function progressoProjeto(projetoId){
  const subs = subtarefasDoProjeto(projetoId);
  const total = subs.reduce((a,s)=> a + s.estimativa_turnos, 0);
  if(!total) return 0;
  const feito = subs.filter(s=> s.status==='concluida').reduce((a,s)=> a + s.estimativa_turnos, 0);
  return Math.round(feito/total*100);
}

function subtarefasDaHistoria(historiaId){ return DB.subtarefas.filter(s=>s.historia_id===historiaId); }

/* Duração da história = SEMPRE a soma das estimativas de suas subtarefas. */
function estimativaHistoria(historiaId){
  return subtarefasDaHistoria(historiaId).reduce((acc,s)=> acc + s.estimativa_turnos, 0);
}
/* Horas estimadas/realizadas da história = soma das horas (não turnos) de
   cada subtarefa — realizadas vêm do apontamento (worklog) feito na Minha
   Área, igual ao cálculo já existente por subtarefa. */
function horasEstimadasHistoria(historiaId){
  return subtarefasDaHistoria(historiaId).reduce((acc,s)=> acc + horasEstimadas(s), 0);
}
function horasApontadasHistoria(historiaId){
  return subtarefasDaHistoria(historiaId).reduce((acc,s)=> acc + horasApontadas(s.id), 0);
}

/* Status da história = derivado das subtarefas:
   - 'concluida' se todas as subtarefas estiverem concluídas (e houver ao menos 1)
   - 'em_desenvolvimento' se alguma subtarefa já foi iniciada ou concluída
   - 'aguardando' caso nenhuma subtarefa tenha sido iniciada ainda */
function statusHistoria(historiaId){
  const subs = subtarefasDaHistoria(historiaId);
  if(!subs.length) return 'aguardando';
  if(subs.every(s=> s.status === 'concluida')) return 'concluida';
  if(subs.some(s=> s.status !== 'aguardando')) return 'em_desenvolvimento';
  return 'aguardando';
}

/* Status da subtarefa — fluxo Kanban real de desenvolvimento: Aguardando →
   Desenvolvimento → Code Review → Em teste → Concluída. Só 'aguardando' e
   'concluida' têm tratamento especial pra fins de história/grade; os três do
   meio contam todos como trabalho ativo. Pausa é um estado à parte (flag
   `pausada`, não um status desta lista) — ver pausarSubtarefa/retomarSubtarefa. */
const SUBTAREFA_STATUS_ORDEM = ['aguardando','em_desenvolvimento','code_review','em_teste','concluida'];
function statusLabel(status){
  return { aguardando:'Aguardando', em_desenvolvimento:'Desenvolvimento', code_review:'Code Review', em_teste:'Em teste', concluida:'Concluída' }[status] || 'Aguardando';
}
function statusColor(status){
  return { aguardando:'var(--ink-faint)', em_desenvolvimento:'var(--amber)', code_review:'var(--blue-mid)', em_teste:'var(--blue-deep)', concluida:'var(--green)' }[status] || 'var(--ink-faint)';
}

function subtarefaConcluida(id){ const s=getSubtarefa(id); return s && s.status === 'concluida'; }

/* Impedimento manual — diferente do bloqueio automático por dependência não
   concluída (esse já existe e é detectado sozinho pelo motor). Este aqui é o
   impedimento clássico de daily: "travei em algo e preciso de ajuda". Guarda
   motivo, quem devia resolver, desde quando está aberto, e mantém um
   histórico de todo impedimento já resolvido (não só o mais recente). */
function abrirImpedimentoForm(subId){
  const sub = getSubtarefa(subId);
  if(!sub) return;
  const respOptions = DB.profissionais.filter(p=>p.id!=='p-na').map(p=>`<option value="${p.id}">${p.nome}</option>`).join('');
  openFormModal(`
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-sm font-bold">Reportar impedimento — ${sub.id}</h3>
      <button onclick="closeModal()" class="text-[var(--ink-faint)] hover:text-[var(--ink)] text-lg leading-none">✕</button>
    </div>
    <div class="field"><label>O que está travando?</label><textarea id="fImpedMotivo" rows="3" placeholder="Ex: aguardando acesso ao ambiente de homologação"></textarea></div>
    <div class="field"><label>Quem pode resolver? (opcional)</label><select id="fImpedResp"><option value="">Ainda não sei</option>${respOptions}</select></div>
    <button onclick="salvarImpedimento('${subId}')" class="w-full bg-[var(--amber)] text-white rounded-lg py-2 text-sm font-bold mt-2">Reportar impedimento</button>
  `);
}
function salvarImpedimento(subId){
  const sub = getSubtarefa(subId);
  if(!sub) return;
  const motivo = document.getElementById('fImpedMotivo').value.trim();
  const responsavel_resolucao_id = document.getElementById('fImpedResp').value || null;
  if(!motivo){ toast('Descreva o que está travando.', 'red'); return; }
  sub.impedimento = {
    motivo, responsavel_resolucao_id,
    aberto_por_id: USUARIO_ATUAL,
    aberto_em: TURN_SLOTS[CURRENT_IDX] ? TURN_SLOTS[CURRENT_IDX].data.toISOString().slice(0,10) : new Date().toISOString().slice(0,10),
  };
  closeModal();
  render();
}
function abrirResolucaoImpedimentoForm(subId){
  const sub = getSubtarefa(subId);
  if(!sub || !sub.impedimento) return;
  openFormModal(`
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-sm font-bold">Resolver impedimento — ${sub.id}</h3>
      <button onclick="closeModal()" class="text-[var(--ink-faint)] hover:text-[var(--ink)] text-lg leading-none">✕</button>
    </div>
    <p class="text-[11px] text-[var(--ink-faint)] mb-3">Motivo original: "${sub.impedimento.motivo}"</p>
    <div class="field"><label>Como foi resolvido?</label><textarea id="fImpedResolucao" rows="3" placeholder="Ex: acesso liberado pelo time de infra"></textarea></div>
    <button onclick="salvarResolucaoImpedimento('${subId}')" class="w-full bg-[var(--orange)] text-[var(--bg)] rounded-lg py-2 text-sm font-bold mt-2">Marcar como resolvido</button>
  `);
}
function salvarResolucaoImpedimento(subId){
  const sub = getSubtarefa(subId);
  if(!sub || !sub.impedimento) return;
  const como_resolvido = document.getElementById('fImpedResolucao').value.trim();
  if(!sub.historico_impedimentos) sub.historico_impedimentos = [];
  sub.historico_impedimentos.push({
    ...sub.impedimento, como_resolvido: como_resolvido || null,
    resolvido_em: TURN_SLOTS[CURRENT_IDX] ? TURN_SLOTS[CURRENT_IDX].data.toISOString().slice(0,10) : new Date().toISOString().slice(0,10),
  });
  sub.impedimento = null;
  closeModal();
  render();
}
function diasAbertoImpedimento(sub){
  if(!sub.impedimento || !TURN_SLOTS[CURRENT_IDX]) return 0;
  return Math.max(0, diffDias(sub.impedimento.aberto_em, TURN_SLOTS[CURRENT_IDX].data.toISOString().slice(0,10)));
}

/* Pausa manual — diferente de impedimento (que é "travei, preciso de ajuda").
   Pausa é "preciso tirar isso da frente agora por repriorização de projeto",
   decisão de quem está executando ou de quem prioriza. Enquanto pausada, a
   subtarefa some da fila do motor de agendamento (recalcularCronograma) mas
   mantém seu status de fluxo (Desenvolvimento, Code Review etc.) intacto —
   ao retomar, ela volta a competir por turno de onde parou. */
function abrirPausarForm(subId){
  const sub = getSubtarefa(subId);
  if(!sub) return;
  openFormModal(`
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-sm font-bold">Pausar subtarefa — ${sub.id}</h3>
      <button onclick="closeModal()" class="text-[var(--ink-faint)] hover:text-[var(--ink)] text-lg leading-none">✕</button>
    </div>
    <p class="text-[11px] text-[var(--ink-faint)] mb-3">Ela sai da fila de agendamento da Lego até você retomar — use em caso de repriorização do projeto.</p>
    <div class="field"><label>Motivo (opcional)</label><textarea id="fPausaMotivo" rows="3" placeholder="Ex: projeto repriorizado, aguardando nova definição"></textarea></div>
    <button onclick="pausarSubtarefa('${subId}')" class="w-full bg-[var(--amber)] text-white rounded-lg py-2 text-sm font-bold mt-2">Pausar subtarefa</button>
  `);
}
function pausarSubtarefa(subId){
  const sub = getSubtarefa(subId);
  if(!sub) return;
  const motivoEl = document.getElementById('fPausaMotivo');
  sub.pausada = true;
  sub.pausada_motivo = motivoEl ? (motivoEl.value.trim() || null) : null;
  sub.pausada_em = TURN_SLOTS[CURRENT_IDX] ? TURN_SLOTS[CURRENT_IDX].data.toISOString().slice(0,10) : new Date().toISOString().slice(0,10);
  closeModal();
  recalcularCronograma();
  render();
  toast(`${subId} pausada.`, 'ink');
}
function retomarSubtarefa(subId){
  const sub = getSubtarefa(subId);
  if(!sub) return;
  sub.pausada = false;
  sub.pausada_motivo = null;
  recalcularCronograma();
  render();
  toast(`${subId} retomada.`, 'green');
}

function turnosConsumidos(subtarefaId){
  return DB.grade.filter(g => g.tarefa_id === subtarefaId &&
    (g.status_turno === 'Concluido' || g.status_turno === 'Em_Andamento')).length;
}

/* Apontamento de horas (worklog) — nível 6.3. Cada subtarefa acumula um log
   de entradas {autor_id, data, horas, descricao}. A estimativa da subtarefa
   é em turnos (blocos de 4h); aqui convertemos pra horas pra comparar com o
   que foi de fato apontado. */
function horasEstimadas(sub){ return sub.estimativa_turnos * 4; }
function horasApontadas(subId){
  const sub = getSubtarefa(subId);
  if(!sub || !sub.worklogs) return 0;
  return sub.worklogs.reduce((acc,w)=> acc + w.horas, 0);
}
function horasRestantes(subId){
  const sub = getSubtarefa(subId);
  if(!sub) return 0;
  return Math.max(0, horasEstimadas(sub) - horasApontadas(subId));
}
function adicionarWorklog(subId){
  const sub = getSubtarefa(subId);
  if(!sub) return;
  if(sub.status !== 'concluida'){ toast('Só é possível apontar horas depois que a subtarefa for concluída.', 'red'); return; }
  const campoData = document.getElementById('fWorklogData_' + subId);
  const campoHoras = document.getElementById('fWorklogHoras_' + subId);
  const campoDesc = document.getElementById('fWorklogDesc_' + subId);
  const data = campoData.value;
  const horas = parseFloat(campoHoras.value);
  const descricao = campoDesc.value.trim();
  if(!data){ toast('Informe a data do apontamento.', 'red'); return; }
  if(!horas || horas <= 0){ toast('Informe quantas horas foram trabalhadas.', 'red'); return; }
  if(!sub.worklogs) sub.worklogs = [];
  sub.worklogs.push({ id: genId('wl'), autor_id: USUARIO_ATUAL, data, horas, descricao: descricao || null });
  renderMinhaArea();
}
function excluirWorklog(subId, worklogId){
  const sub = getSubtarefa(subId);
  if(!sub || !sub.worklogs) return;
  sub.worklogs = sub.worklogs.filter(w=>w.id!==worklogId);
  renderMinhaArea();
}

function matchesProjectFilter(sub){ return PROJECT_FILTER === 'all' || sub.projeto_id === PROJECT_FILTER; }
function matchesSprintFilter(sub){ return SPRINT_FILTER === 'all' || sub.sprint_id === SPRINT_FILTER; }
function matchesFilters(sub){ return matchesProjectFilter(sub) && matchesSprintFilter(sub); }

function setProjectFilter(v){ PROJECT_FILTER = v; atualizarSprintFilterOptions(); render(); }
function setSprintFilter(v){ SPRINT_FILTER = v; BURNDOWN_ABERTO = false; render(); }

/* Sprints "do projeto" = sprints cujo projeto_id bate com o projeto (cada
   sprint pertence a um único projeto). Usado para restringir o dropdown de
   sprint ao escolher um projeto no filtro ou no formulário de história. */
function sprintsDoProjeto(projetoId){
  if(projetoId === 'all') return DB.sprints;
  return DB.sprints.filter(s=> s.projeto_id===projetoId);
}

function atualizarSprintFilterOptions(){
  const selS = document.getElementById('sprintFilter');
  if(!selS) return;
  // sem projeto escolhido, não dá pra filtrar por sprint específica — sprints
  // de projetos diferentes podem ter nome parecido/mesma data, então escolher
  // uma sem saber de qual projeto é confunde mais do que ajuda.
  if(PROJECT_FILTER === 'all'){
    SPRINT_FILTER = 'all';
    selS.innerHTML = `<option value="all">Escolha um projeto primeiro</option>`;
    selS.value = 'all';
    selS.disabled = true;
    return;
  }
  selS.disabled = false;
  const sprints = sprintsDoProjeto(PROJECT_FILTER);
  selS.innerHTML = `<option value="all">Todas as sprints</option>` +
    sprints.map(s=>`<option value="${s.id}">${nomeSprintCurto(s.id)}</option>`).join('');
  // se a sprint selecionada não pertence mais ao projeto filtrado, volta para "Todas as sprints"
  if(SPRINT_FILTER !== 'all' && !sprints.some(s=> s.id===SPRINT_FILTER)) SPRINT_FILTER = 'all';
  selS.value = SPRINT_FILTER;
}

function initFiltroSelects(){
  const selP = document.getElementById('projetoFilter');
  selP.innerHTML = `<option value="all">Todos os projetos</option>` +
    DB.projetos.map(p=>`<option value="${p.id}">${p.nome}</option>`).join('');
  selP.value = PROJECT_FILTER;

  atualizarSprintFilterOptions();
}

/* Reinicia a simulação (usado sempre que a lista/duração de sprints muda). */
function resetSimulacao(msg){
  CURRENT_IDX = 0;
  DB.grade = [];
  DB.subtarefas.forEach(s=>{ s.status = 'aguardando'; s.inicio_turnoIdx = null; s.fim_turnoIdx = null; });
  ALERTS = [];
  construirCalendario();
  recalcularCronograma();
  render();
  renderAlertStrip();
  if(msg) toast(msg, 'ink');
}

/* Distribui as conclusões reais pelos turnos correspondentes às datas reais,
   avançando manhã→tarde→dia seguinte quando o mesmo profissional tem mais de
   uma conclusão agrupada no mesmo dia (evita colisão no mesmo turno). */
function seedHistoricoReal(){
  const porProfissional = {};
  HISTORICO_CONCLUSOES_REAIS.forEach(([subId, dataIso])=>{
    const sub = getSubtarefa(subId);
    if(!sub) return;
    const resp = sub.responsavel_id;
    if(!porProfissional[resp]) porProfissional[resp] = [];
    porProfissional[resp].push({ sub, data: new Date(dataIso+'T00:00:00') });
  });

  Object.values(porProfissional).forEach(itens=>{
    itens.sort((a,b)=> a.data - b.data);
    itens.forEach(({sub, data})=>{
      const alvo = TURN_SLOTS.find(s=> s.data.toDateString()===data.toDateString() && s.turno==='manha');
      let idx = alvo ? alvo.idx : 0;
      while(idx < TURN_SLOTS.length && idx < CURRENT_IDX && DB.grade.some(g=> g.turnoIdx===idx && g.profissional_id===sub.responsavel_id)){
        idx++;
      }
      if(idx >= CURRENT_IDX || idx >= TURN_SLOTS.length) return; // não empurra histórico para o futuro simulado
      const slot = TURN_SLOTS[idx];
      DB.grade.push({ turnoIdx: idx, data: slot.data, turno: slot.turno, profissional_id: sub.responsavel_id, tarefa_id: sub.id, status_turno:'Concluido' });
      sub.inicio_turnoIdx = idx; sub.fim_turnoIdx = idx;
    });
  });
}

/* =========================================================================
   PASSO 2 — MOTOR DE CÁLCULO (recalcularCronograma / efeito cascata)
   Opera sobre SUBTAREFAS — a unidade atômica agendável.

   A cada turno livre de cada profissional, o motor escolhe a subtarefa
   elegível com a Data início planejada mais cedo; empate (ou ausência de
   data nas duas) desempata pela "Ordem na fila" cadastrada. Uma subtarefa só
   é elegível a partir da sua Data início planejada — antes disso o turno
   fica livre/vazio pra ela, mesmo que ela seja a próxima da fila (o motor
   pula pra próxima elegível). A duração ocupada é a "Estimativa (turnos)"
   cadastrada, ou seja, a quantidade de horas ÷ 4h por turno.

   Como isso roda de novo a cada avanço de turno e a cada
   criação/edição de subtarefa no Cadastro, a alocação futura é sempre
   replanejada na hora — é a "planning" se ajustando sozinha.
   ========================================================================= */
function recalcularCronograma(){
  DB.grade = DB.grade.filter(g => {
    if(g.turnoIdx <= CURRENT_IDX) return true;
    return !(g.status_turno === 'Planejado' || g.status_turno === 'Bloqueado');
  });

  // peso da sprint na fila: a sprint EM ANDAMENTO sempre vem primeiro; sprints
  // PLANEJADAS (futuras) entram na sequência logo depois — assim o motor
  // também projeta o trabalho já cadastrado nelas, em vez de só "sumir" até
  // a sprint virar ativa. Sprint concluída não entra (fica de fora da fila;
  // o que ficou pendente nela precisa ser realocado manualmente).
  function pesoStatusSprint(sprintId){
    const sprint = getSprint(sprintId);
    if(!sprint) return 99;
    if(sprint.status === 'em_andamento') return 0;
    if(sprint.status === 'planejada') return 1;
    return 99;
  }
  const ordemSprint = {};
  DB.sprints.forEach((s,i)=>{ ordemSprint[s.id] = i; });

  const filas = {};
  DB.profissionais.forEach(p=>{
    filas[p.id] = DB.subtarefas
      .filter(s => {
        if(s.responsavel_id !== p.id || s.status === 'concluida' || s.pausada || !s.sprint_id) return false;
        const sprint = getSprint(s.sprint_id);
        return sprint && (sprint.status === 'em_andamento' || sprint.status === 'planejada');
      })
      .sort((a,b)=> {
        const porSprint = pesoStatusSprint(a.sprint_id) - pesoStatusSprint(b.sprint_id)
          || (ordemSprint[a.sprint_id]??99) - (ordemSprint[b.sprint_id]??99);
        if(porSprint) return porSprint;
        // dentro da mesma sprint, a Data início planejada da própria subtarefa
        // manda — é ela que decide em qual turno o trabalho realmente cai (sem
        // data vai pro fim da fila). "Ordem na fila" só desempata quando a
        // data é igual ou quando nenhuma das duas tem data.
        const da = a.data_inicio_planejada, db = b.data_inicio_planejada;
        if(da && db && da !== db) return da < db ? -1 : 1;
        if(da && !db) return -1;
        if(!da && db) return 1;
        return a.ordem_fila - b.ordem_fila || a.id.localeCompare(b.id);
      });
  });

  // turnos que ainda faltam pra cada subtarefa — calculado uma vez pra todas,
  // a partir do que já foi de fato consumido (turnos passados/em andamento).
  const restante = {};
  DB.subtarefas.forEach(s=>{ restante[s.id] = Math.max(0, s.estimativa_turnos - turnosConsumidos(s.id)); });

  // Trava de início por (profissional, sprint) — não por item individual.
  // É a MENOR "Data início planejada" entre as subtarefas daquele profissional
  // naquela sprint que decide quando a sprint "libera" pra ele. Datas
  // importadas em lote costumam vir uma por dia (granularidade de história),
  // mas a capacidade real é de 2 turnos (8h) por dia — travando por item
  // individual sobra turno vazio esperando a data exata do próximo bater.
  // Travando só a entrada na sprint (pela data mais cedo dela) e liberando
  // geral depois, o motor preenche contínuo a partir da data real, sem buraco
  // e sem começar antes da hora.
  // compara (data,turno) — usado tanto pra achar o gate mais cedo quanto pra
  // testar se um turno da grade já chegou nele. Respeita o Período de início
  // (M/T) exato cadastrado na subtarefa, não só o dia.
  function momentoAntes(dataA, turnoA, dataB, turnoB){
    if(dataA.getTime() !== dataB.getTime()) return dataA < dataB;
    return turnoA === 'manha' && turnoB === 'tarde';
  }
  const gatePorProfSprint = {};
  DB.profissionais.forEach(p=>{
    filas[p.id].forEach(s=>{
      if(!s.data_inicio_planejada) return;
      const chave = p.id + '|' + s.sprint_id;
      const d = new Date(s.data_inicio_planejada + 'T00:00:00');
      const t = s.turno_inicio_planejado === 'tarde' ? 'tarde' : 'manha';
      const atual = gatePorProfSprint[chave];
      if(!atual || momentoAntes(d, t, atual.data, atual.turno)) gatePorProfSprint[chave] = { data: d, turno: t };
    });
  });

  for(let idx = CURRENT_IDX; idx < TURN_SLOTS.length; idx++){
    const slot = TURN_SLOTS[idx];
    // feriado cadastrado: o dia continua existindo como coluna na Grade
    // (ao contrário de fim de semana, que nem entra no calendário), mas
    // ninguém é alocado nele — o motor simplesmente pula pra frente. A
    // célula aparece cinza (ver renderCellGeneric).
    if(getFeriado(slot.data)) continue;

    DB.profissionais.forEach(p=>{
      const existente = DB.grade.find(g => g.turnoIdx === idx && g.profissional_id === p.id);
      if(existente) return;

      // dentre a fila (já ordenada por sprint > data início > ordem na
      // fila), pega a primeira com turno restante cuja SPRINT já "abriu"
      // pra esse profissional (ver gatePorProfSprint acima).
      const sub = filas[p.id].find(s => {
        if(restante[s.id] <= 0) return false;
        const gate = gatePorProfSprint[p.id + '|' + s.sprint_id];
        if(gate && momentoAntes(slot.data, slot.turno, gate.data, gate.turno)) return false;
        return true;
      });
      if(!sub) return; // fila desse profissional esgotada (ou sprint ainda não abriu) — fica vazio

      const depsOk = sub.depende_de_ids.every(depId => subtarefaConcluida(depId));

      if(depsOk){
        DB.grade.push({ turnoIdx: idx, data: slot.data, turno: slot.turno,
          profissional_id: p.id, tarefa_id: sub.id, status_turno:'Planejado' });
        restante[sub.id] = Math.max(0, restante[sub.id] - 1);
      } else {
        DB.grade.push({ turnoIdx: idx, data: slot.data, turno: slot.turno,
          profissional_id: p.id, tarefa_id: sub.id, status_turno:'Bloqueado' });
      }
    });
  }
}

/* =========================================================================
   AVANÇO DE TURNO + REGRAS DE ALERTA (Passo 4)
   ========================================================================= */
function avancarTurno(silent){
  const slotAtual = TURN_SLOTS[CURRENT_IDX];
  if(!slotAtual){ toast('Fim do horizonte simulado.', 'amber'); return false; }

  DB.grade.filter(g=> g.turnoIdx === CURRENT_IDX).forEach(g=>{
    if(g.status_turno === 'Planejado' || g.status_turno === 'Em_Andamento'){
      const sub = getSubtarefa(g.tarefa_id);
      const consumidos = turnosConsumidos(sub.id) + 1;
      if(g.status_turno === 'Em_Andamento' && consumidos > sub.estimativa_turnos && sub.status !== 'concluida'){
        disparaAlerta4_1(sub);
      }
      if(g.status_turno === 'Planejado'){ g.status_turno = 'Em_Andamento'; }
    }
  });

  if(CURRENT_IDX + 1 >= TURN_SLOTS.length){
    toast('Horizonte cadastrado de sprints chegou ao fim.', 'amber');
    return false;
  }
  CURRENT_IDX++;
  recalcularCronograma();
  if(!silent){
    render();
    toast('Turno avançado para ' + fmtData(TURN_SLOTS[CURRENT_IDX].data) + ' · ' + labelTurno(TURN_SLOTS[CURRENT_IDX].turno), 'ink');
  }
  return true;
}

function avancarVariosTurnos(){
  const input = document.getElementById('qtdTurnos');
  let qtd = parseInt(input.value, 10);
  if(isNaN(qtd) || qtd < 1) qtd = 1;
  let realizados = 0;
  for(let i=0; i<qtd; i++){
    const ok = avancarTurno(true);
    if(!ok) break;
    realizados++;
    checarEsquecimento(false);
  }
  render();
  if(realizados > 0){
    toast(`${realizados} turno(s) avançado(s) · verificações executadas em cada um.`, 'ink');
  }
}

function disparaAlerta4_1(sub){
  const dev = getProf(sub.responsavel_id).nome;
  const msg = `Atenção ${dev}, a subtarefa ${sub.id} estourou a estimativa planejada. Por favor, atualize o saldo de turnos necessários para que o motor reajuste o cronograma do time.`;
  pushAlert('estouro', msg);

  DB.subtarefas.forEach(outra=>{
    if(outra.responsavel_id !== sub.responsavel_id &&
       outra.depende_de_ids.includes(sub.id) &&
       outra.status !== 'concluida'){
      const devBloqueado = getProf(outra.responsavel_id).nome;
      const msg2 = `Aviso importante: A subtarefa ${sub.id} está pendente no seu painel. O desenvolvedor ${devBloqueado} está bloqueado no turno de hoje aguardando esta entrega.`;
      pushAlert('cascata', msg2);
    }
  });
}

function checarEsquecimento(mostrarToastSeVazio){
  let algum = false;
  DB.profissionais.forEach(p=>{
    const slot = DB.grade.find(g=> g.turnoIdx === CURRENT_IDX && g.profissional_id === p.id);
    if(slot && slot.status_turno === 'Planejado' && matchesFilters(getSubtarefa(slot.tarefa_id))){
      algum = true;
      const msg = `Olá ${p.nome}, identificamos que você ainda não iniciou a próxima atividade da sua fila na ferramenta para o turno atual. Lembre-se de dar "Play" para manter a visibilidade do time.`;
      pushAlert('esquecimento', msg);
    }
  });
  if(!algum && mostrarToastSeVazio) toast('Nenhuma pendência de início encontrada neste turno.', 'green');
  return algum;
}

function checarEstouroAtual(){
  let algum = false;
  DB.grade.filter(g=> g.turnoIdx <= CURRENT_IDX && g.status_turno === 'Em_Andamento').forEach(g=>{
    const sub = getSubtarefa(g.tarefa_id);
    if(!sub || sub.status === 'concluida' || !matchesFilters(sub)) return;
    const consumidos = turnosConsumidos(sub.id) + 1;
    if(consumidos > sub.estimativa_turnos){ algum = true; disparaAlerta4_1(sub); }
  });
  return algum;
}

function executarVerificacoes(){
  const a = checarEstouroAtual();
  const b = checarEsquecimento(false);
  if(!a && !b) toast('Verificações concluídas — nenhum desvio encontrado neste turno.', 'green');
  else toast('Verificações concluídas — veja os alertas gerados.', 'amber');
}

function pushAlert(tipo, msg){
  ALERTS.unshift({ tipo, msg, ts: Date.now() });
  ALERTS = ALERTS.slice(0, 12);
  renderAlertStrip();
}

/* =========================================================================
   AÇÕES DO USUÁRIO — ciclo de vida da subtarefa
   'aguardando' -> (1º profissional inicia) -> 'em_desenvolvimento' -> 'concluida'
   O status da história-mãe é sempre derivado (ver statusHistoria).
   ========================================================================= */
function iniciarAtividade(subtarefaId, profId){
  const slot = DB.grade.find(g=> g.turnoIdx === CURRENT_IDX && g.profissional_id === profId && g.tarefa_id === subtarefaId);
  if(slot){ slot.status_turno = 'Em_Andamento'; }
  const sub = getSubtarefa(subtarefaId);
  if(sub && sub.status === 'aguardando'){
    sub.status = 'em_desenvolvimento';
    sub.inicio_turnoIdx = CURRENT_IDX;
  }
  render();
}

function marcarConcluido(subtarefaId){
  const sub = getSubtarefa(subtarefaId);
  if(sub.inicio_turnoIdx === null || sub.inicio_turnoIdx === undefined){ sub.inicio_turnoIdx = CURRENT_IDX; }
  sub.status = 'concluida';
  sub.fim_turnoIdx = CURRENT_IDX;
  const slot = DB.grade.find(g=> g.turnoIdx === CURRENT_IDX && g.tarefa_id === subtarefaId);
  if(slot){ slot.status_turno = 'Concluido'; }
  recalcularCronograma();
  closeModal();
  render();
  toast(`${subtarefaId} marcada como concluída.`, 'green');
}

function adicionarTurnos(subtarefaId, qtd){
  const sub = getSubtarefa(subtarefaId);
  sub.estimativa_turnos += qtd;
  recalcularCronograma();
  closeModal();
  render();
  toast(`+${qtd} turno(s) adicionados a ${subtarefaId}.`, 'amber');
}

/* =========================================================================
   RENDER — PASSO 3.1: TELA A · LEGO
   ========================================================================= */
function labelTurno(t){ return t==='manha' ? 'Manhã' : 'Tarde'; }

function statusClasses(status, isNow){
  let c = 'cell ';
  if(status === 'Planejado') c += 'planejado clickable ';
  if(status === 'Em_Andamento') c += 'andamento clickable ';
  if(status === 'Concluido') c += 'concluido ';
  if(status === 'Bloqueado') c += 'bloqueado clickable ';
  if(isNow) c += 'now-marker ';
  return c;
}

function gradeDoDia(profId, dia, turnoTipo){
  const ts = TURN_SLOTS.find(s => s.data.toDateString() === dia.toDateString() && s.turno === turnoTipo);
  if(!ts) return { ts:null, g:null };
  return { ts, g: DB.grade.find(x=> x.turnoIdx === ts.idx && x.profissional_id === profId) };
}

function renderHeaderCols(colWidth, diasList){
  return diasList.map(dia=>{
    const isToday = isHojeReal(dia);
    const chave = dia.toDateString();
    const faixaBg = GRADE_FAIXA_POR_DATA.get(chave);
    const bordaGrossa = GRADE_FIM_SPRINT.has(chave) ? 'border-right:3px solid var(--ink-dim);' : '';
    const feriado = getFeriado(dia);
    const bg = feriado ? '#E9EAEC' : (isToday ? 'rgba(240,90,40,.12)' : (faixaBg || 'transparent'));
    // bandeirinha laranja só na coluna de hoje — sinaliza o dia atual de
    // forma bem mais visível do que só o fundo tintado.
    const bandeiraHoje = (isToday && !feriado)
      ? `<svg width="10" height="10" viewBox="0 0 24 24" style="margin-bottom:1px;" title="Hoje"><path d="M5 21V4c0-.6.4-1 1-1h13.2c.9 0 1.4 1 .8 1.7L16 10l4 5.3c.6.7.1 1.7-.8 1.7H6a1 1 0 0 0-1 1V21" fill="var(--orange)"/></svg>`
      : '';
    return `<div class="flex flex-col items-center justify-center border-r border-[var(--line)] shrink-0" style="width:${colWidth}px; background:${bg}; ${bordaGrossa}" ${feriado ? `title="Feriado — ${feriado.nome}"` : ''}>
      ${bandeiraHoje}
      <div class="text-[9px] text-[var(--ink-faint)] mono">${fmtDiaSemana(dia)}</div>
      <div class="text-[10px] mono font-semibold" style="color:${feriado ? 'var(--ink-faint)' : (isToday ? 'var(--orange-deep)' : 'var(--ink-dim)')}">${fmtData(dia)}</div>
    </div>`;
  }).join('');
}

// Faixas alternadas de cor por sprint (só entram em ação quando há mais de
// uma sprint visível de uma vez) + o mapa de qual data é a última coluna de
// cada sprint, pra desenhar uma borda mais grossa na divisão. Como
// buildTableHeaderHTML sempre roda antes de buildRowsHTML/renderCellGeneric
// no mesmo ciclo de render, essas globais ficam "prontas" a tempo de colorir
// as células do corpo da grade também — evita ter que passar isso por
// parâmetro em toda a cadeia de funções de célula.
const FAIXA_SPRINT_COR = ['transparent', 'var(--panel-2)'];
let GRADE_FAIXA_POR_DATA = new Map();
let GRADE_FIM_SPRINT = new Set();

/* Posição PLANEJADA (fixa) de cada subtarefa com data cadastrada, indexada
   por "profissionalId|turnoIdx" -> subtarefaId. Reconstruída a cada entrada
   na Grade Geral (construirGradePlanejada), igual ao padrão já usado pra
   GRADE_FAIXA_POR_DATA/GRADE_FIM_SPRINT. É o que faz o card não se mover
   mais quando a subtarefa é pausada/atrasa — a alocação REAL (DB.grade,
   dinâmica) continua existindo em paralelo e vira a célula "execução real"
   quando cai num turno diferente do plano (ver renderCellGeneric). */
let GRADE_PLANO_POR_CELULA = new Map();
function construirGradePlanejada(){
  GRADE_PLANO_POR_CELULA = new Map();
  DB.subtarefas.forEach(sub=>{
    if(!sub.data_inicio_planejada) return; // sem data fixa -> segue 100% dinâmica, como sempre
    turnosDoPlano(sub).forEach(({idx})=>{
      const chave = sub.responsavel_id + '|' + idx;
      // colisão (dados legados mal espaçados): quem já estava lá fica —
      // evita sobrescrever silenciosamente o card de outra subtarefa.
      if(!GRADE_PLANO_POR_CELULA.has(chave)) GRADE_PLANO_POR_CELULA.set(chave, sub.id);
    });
  });
}

// Largura da "coluna" fixa à esquerda antes das colunas de dia começarem —
// tem que bater exatamente com a soma do que buildRowsHTML desenha ali (nome
// do profissional + rótulo M/T), senão o cabeçalho de datas fica desalinhado
// com as células de verdade embaixo dele.
const GRADE_NOME_WIDTH = 172;
const GRADE_ROTULO_TURNO_WIDTH = 20; // w-5 do <span>M</span>/<span>T</span>
const GRADE_LEAD_WIDTH = GRADE_NOME_WIDTH + GRADE_ROTULO_TURNO_WIDTH;

function buildTableHeaderHTML(colWidth, diasList, showSprintLabels, leadWidthPx = 128){
  let sprintRow = '';
  GRADE_FAIXA_POR_DATA = new Map();
  GRADE_FIM_SPRINT = new Set();
  if(showSprintLabels && diasList.length){
    const runs = [];
    diasList.forEach(d=>{
      // com um filtro de sprint específico ativo, a faixa do cabeçalho é
      // sempre a sprint filtrada — mesmo pra datas "emprestadas" (onde o
      // trabalho dessa sprint foi de fato alocado, mas que nominalmente
      // pertencem ao bloco de outra sprint no calendário sequencial). Sem
      // isso, filtrar por uma sprint específica podia mostrar a faixa de
      // outra sprint misturada, o que é enganoso.
      const sid = SPRINT_FILTER !== 'all' ? SPRINT_FILTER : sprintIdForDate(d);
      if(runs.length && runs[runs.length-1].sid === sid) runs[runs.length-1].dias.push(d);
      else runs.push({ sid, dias:[d] });
    });
    const multiplasSprints = runs.length > 1;
    if(multiplasSprints){
      runs.forEach((r, i)=>{
        r.dias.forEach(d=> GRADE_FAIXA_POR_DATA.set(d.toDateString(), FAIXA_SPRINT_COR[i % FAIXA_SPRINT_COR.length]));
        GRADE_FIM_SPRINT.add(r.dias[r.dias.length-1].toDateString());
      });
    }
    sprintRow = `<div class="flex">` + runs.map((r,i)=>{
      const bg = multiplasSprints ? FAIXA_SPRINT_COR[i % FAIXA_SPRINT_COR.length] : 'var(--panel-2)';
      const bordaGrossa = multiplasSprints && i < runs.length-1 ? 'border-right:3px solid var(--ink-dim);' : '';
      const periodo = periodoSprintTxt(r.sid);
      const label = `${periodo ? periodo+' · ' : ''}${nomeSprint(r.sid)}`;
      return `<div class="flex items-center justify-center border-r border-b border-[var(--line)] text-[9px] font-bold mono uppercase text-[var(--ink-dim)]" style="width:${colWidth*r.dias.length}px; height:18px; background:${bg}; ${bordaGrossa} overflow:hidden; white-space:nowrap; padding:0 4px;" title="${label}">${label}</div>`;
    }).join('') + `</div>`;
  }
  return `<div class="sticky top-0 z-20 bg-[var(--panel)]">
    ${showSprintLabels ? `<div class="flex"><div class="shrink-0 sticky left-0 bg-[var(--panel)] border-r border-[var(--line)] z-30" style="width:${leadWidthPx}px; height:18px;"></div>${sprintRow}</div>` : ''}
    <div class="flex border-b border-[var(--line)]">
      <div class="shrink-0 sticky left-0 bg-[var(--panel)] border-r border-[var(--line)] z-30 flex items-center px-3" style="width:${leadWidthPx}px;">
        <span class="text-[10px] text-[var(--ink-faint)] mono uppercase">Time</span>
      </div>
      <div class="flex">${renderHeaderCols(colWidth, diasList)}</div>
    </div>
  </div>`;
}

function renderCellGeneric(p, dia, turnoTipo, colWidth, matchFn, hideNonMatching){
  const { ts, g: gReal } = gradeDoDia(p.id, dia, turnoTipo);
  if(!ts) return `<div class="shrink-0" style="width:${colWidth}px; height:34px;"></div>`;
  const isNow = ts.idx === CURRENT_IDX;
  // mesma faixa/borda de divisão de sprint usada no cabeçalho (renderHeaderCols),
  // aplicada ao invólucro da célula — só fica visível na "aleta" ao redor do
  // quadradinho colorido da tarefa, sem competir com a cor da própria tarefa.
  const chaveDia = dia.toDateString();
  const faixaBg = GRADE_FAIXA_POR_DATA.get(chaveDia) || 'transparent';
  const bordaGrossa = GRADE_FIM_SPRINT.has(chaveDia) ? 'border-right:3px solid var(--ink-dim);' : '';
  const wrapStyle = `width:${colWidth}px; height:34px; background:${faixaBg}; ${bordaGrossa}`;
  const vazio = (extra) => `<div class="shrink-0 flex items-center justify-center" style="${wrapStyle}">${extra || `<div class="cell empty" style="width:${colWidth-6}px; height:30px;"></div>`}</div>`;

  // Célula do PLANO fixo: se uma subtarefa com data cadastrada ocupa este
  // turno pelo cronograma original, ela sempre manda aqui — a posição nunca
  // se move por causa de pausa/atraso, só ganha um badge sinalizando o
  // desvio. A alocação real (DB.grade) segue existindo em paralelo; quando
  // ela cai num turno diferente do plano, vira a célula "execução real"
  // logo abaixo (Caso B).
  const idPlanejado = GRADE_PLANO_POR_CELULA.get(p.id + '|' + ts.idx);
  if(idPlanejado){
    const sub = getSubtarefa(idPlanejado);
    const hist = getHistoria(sub.historia_id);
    const matches = matchFn(sub);
    if(!matches && hideNonMatching) return vazio(`<div class="cell empty" style="width:${colWidth-6}px; height:30px; opacity:.3;"></div>`);
    const dimmed = !matches;
    const emSincroniaComPlano = gReal && gReal.tarefa_id === idPlanejado;
    const statusTurno = emSincroniaComPlano ? gReal.status_turno : 'Planejado';
    const cls = statusClasses(statusTurno, isNow) + (dimmed ? 'pointer-events-none ' : '');
    const bg = corDaSubtarefa(sub);
    const statusV = hist ? statusVisualHistoria(hist.id) : 'aguardando';
    const atraso = atrasoSubtarefaPlanejada(sub);
    // bolinha de status da história fica no canto inferior ESQUERDO agora —
    // abre o canto inferior direito pro badge de atraso, que é o sinal que
    // efetivamente importa aqui: "isso não aconteceu no dia planejado".
    const statusBadge = `<span style="position:absolute; bottom:1px; left:2px; width:11px; height:11px; border-radius:50%; background:${statusVisualCor(statusV)}; box-shadow:0 0 0 1px rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; font-size:7px; font-weight:800; color:#fff; line-height:1;" title="${statusVisualLabel(statusV)}">${statusV==='concluida'?'✓':''}</span>`;
    // Contar subtarefas que pertencem a esta história
    const numSubtarefas = hist ? DB.subtarefas.filter(s => s.historia_id === hist.id).length : 0;
    const subtarefasLabel = numSubtarefas > 0 ? ` · ${numSubtarefas} ${numSubtarefas === 1 ? 'subtarefa' : 'subtarefas'}` : '';
    return `<div class="shrink-0 flex items-center justify-center" style="${wrapStyle}">
      <div class="${cls} flex items-center justify-center px-0.5" style="width:${colWidth-6}px; height:30px; background:${bg}; opacity:${dimmed ? 0.2 : 1}; position:relative;"
        onclick='handleCellClick(${JSON.stringify(sub.id)}, ${JSON.stringify(p.id)}, ${ts.idx})'
        title="${sub.id} — ${sub.titulo} (planejado) · História: ${hist ? hist.id : '—'} (${statusVisualLabel(statusV)})${subtarefasLabel} · ${nomeProjeto(sub.projeto_id)} · ${nomeSprint(sub.sprint_id)}">
        ${statusBadge}
        <span class="text-[9px] font-bold mono truncate" style="color:#111418">${hist ? hist.id.split('-').slice(1).join('-') : sub.id.split('-').slice(1).join('-')}</span>
      </div>
    </div>`;
  }

  // Caso B: este turno não é a posição planejada de ninguém. Só sobra a
  // alocação real (dinâmica) — de uma subtarefa sem data cadastrada
  // (comportamento de sempre, sem marcação especial) ou o pedaço de uma
  // subtarefa COM plano que atrasou e caiu aqui (célula "execução real",
  // com contorno tracejado pra deixar claro que é um desvio do plano).
  if(!gReal){
    const feriado = getFeriado(dia);
    if(feriado){
      return vazio(`<div class="cell flex items-center justify-center" style="width:${colWidth-6}px; height:30px; background:#E9EAEC;" title="Feriado — ${feriado.nome}">
          <span class="text-[7px] font-bold mono uppercase leading-none text-center" style="color:var(--ink-faint)">Feriado</span>
        </div>`);
    }
    return vazio();
  }
  const sub = getSubtarefa(gReal.tarefa_id);
  const hist = getHistoria(sub.historia_id);
  const matches = matchFn(sub);
  if(!matches && hideNonMatching) return vazio(`<div class="cell empty" style="width:${colWidth-6}px; height:30px; opacity:.3;"></div>`);
  const dimmed = !matches;
  const desviado = !!sub.data_inicio_planejada; // tem plano fixo em outro dia -> isto aqui é a execução real, atrasada
  const cls = statusClasses(gReal.status_turno, isNow) + (dimmed ? 'pointer-events-none ' : '');
  const bg = gReal.status_turno === 'Bloqueado' ? '#E9EAEC' : corDaSubtarefa(sub);
  const statusV = hist ? statusVisualHistoria(hist.id) : 'aguardando';
  const statusBadge = gReal.status_turno === 'Bloqueado' ? '' : `<span style="position:absolute; bottom:1px; right:2px; width:12px; height:12px; border-radius:50%; background:${statusVisualCor(statusV)}; box-shadow:0 0 0 1px rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; font-size:8px; font-weight:800; color:#fff; line-height:1;" title="${statusVisualLabel(statusV)}">${statusV==='concluida'?'✓':''}</span>`;
  const realBadge = desviado ? `<span style="position:absolute; top:1px; right:2px; font-size:9px; line-height:1; text-shadow:0 0 2px rgba(255,255,255,.9);" title="Execução real — planejada para ${fmtData(new Date(sub.data_inicio_planejada+'T00:00:00'))}">↷</span>` : '';
  const borda = desviado ? 'border:1.5px dashed rgba(17,20,24,.55);' : '';
  return `<div class="shrink-0 flex items-center justify-center" style="${wrapStyle}">
    <div class="${cls} flex items-center justify-center px-0.5" style="width:${colWidth-6}px; height:30px; background:${bg}; opacity:${dimmed ? 0.2 : (desviado ? 0.85 : 1)}; ${borda} position:relative;"
      onclick='handleCellClick(${JSON.stringify(sub.id)}, ${JSON.stringify(p.id)}, ${ts.idx})'
      title="${sub.id} — ${sub.titulo} (${gReal.status_turno})${desviado ? ' · execução real, plano em ' + fmtData(new Date(sub.data_inicio_planejada+'T00:00:00')) : ''} · História: ${hist ? hist.id : '—'} (${statusVisualLabel(statusV)}) · ${nomeProjeto(sub.projeto_id)} · ${nomeSprint(sub.sprint_id)}">
      ${statusBadge}${realBadge}
      <span class="text-[9px] font-bold mono truncate" style="color:${gReal.status_turno==='Bloqueado' ? '#5C6570' : '#111418'}">${hist ? hist.id.split('-').slice(1).join('-') : sub.id.split('-').slice(1).join('-')}</span>
    </div>
  </div>`;
}

  return profissionaisList.map(p=>{
    const linhaManha = diasList.map(dia=> renderCellGeneric(p, dia, 'manha', colWidth, matchFn, hideNonMatching)).join('');
    const linhaTarde = diasList.map(dia=> renderCellGeneric(p, dia, 'tarde', colWidth, matchFn, hideNonMatching)).join('');
    return `
      <div class="border-b border-[var(--line)]">
        <div class="flex">
          <div class="shrink-0 sticky left-0 bg-[var(--panel)] border-r border-[var(--line)] flex flex-col justify-center px-3 py-1 z-10" style="width:${GRADE_NOME_WIDTH}px;">
            <div class="text-xs font-semibold leading-snug">${p.nome}</div>
            <div class="text-[10px] text-[var(--ink-faint)] mono truncate">${p.tecnologia_principal}</div>
          </div>

              <span class="w-5 shrink-0 text-center text-[8px] text-[var(--ink-faint)] mono cursor-help" title="Turno da manhã — 4h de trabalho">M</span>
              <div class="flex">${linhaManha}</div>

              <div class="flex">${linhaTarde}</div>
